<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login — TOEGO</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://accounts.google.com">
<meta name="theme-color" content="#2874f0" id="tg-theme-meta">
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100vw;overflow-x:hidden;min-height:100vh;font-family:'Roboto',Arial,sans-serif;color:#212121;background:#f1f3f6;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font:inherit;}
a{color:inherit;text-decoration:none;}
header#top,#top_menu,nav.o_main_navbar,.o_main_navbar,footer#bottom,.o_footer,#footer,.o_breadcrumb,.breadcrumb{display:none!important;}
.tg-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#f1f3f6;}
.tg-card{width:100%;max-width:720px;background:#fff;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.10);display:flex;overflow:hidden;}
.tg-left{flex:0 0 40%;max-width:40%;background:#2874f0;color:#fff;padding:34px 30px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:background .3s;}
.tg-left::after{content:'';position:absolute;bottom:-80px;left:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%);border-radius:50%;}
.tg-left-logo{font-weight:900;font-style:italic;font-size:24px;letter-spacing:-0.4px;position:relative;z-index:2;}
.tg-left-logo span{color:#ffe500;}
.tg-left-content{position:relative;z-index:2;margin-top:auto;margin-bottom:auto;padding:24px 0;}
.tg-left-title{font-size:26px;font-weight:500;line-height:1.15;margin:0 0 12px;letter-spacing:-0.2px;}
.tg-left-sub{font-size:14px;line-height:1.5;opacity:0.88;margin:0;max-width:260px;}
.tg-left-foot{font-size:11px;opacity:0.7;position:relative;z-index:2;}
.tg-right{flex:1 1 auto;padding:36px 42px 32px;display:flex;flex-direction:column;justify-content:center;}
.tg-field{position:relative;margin-bottom:24px;}
.tg-field input{width:100%;height:42px;border:none;border-bottom:1px solid #d4d5d9;background:transparent;font-size:15px;color:#212121;padding:6px 0 8px;outline:none;transition:border-color .2s;border-radius:0;}
.tg-field input:focus{border-bottom-color:#2874f0;}
.tg-field label{position:absolute;left:0;top:12px;font-size:15px;color:#878787;pointer-events:none;transition:all .18s cubic-bezier(.4,0,.2,1);background:#fff;padding:0 4px;margin-left:-4px;}
.tg-field input:focus+label,.tg-field input:not(:placeholder-shown)+label,.tg-field input.filled+label{top:-7px;font-size:12px;color:#2874f0;}
.tg-field input:not(:focus):not(:placeholder-shown)+label{color:#878787;}
.tg-field-pass{position:relative;}
.tg-pass-toggle{position:absolute;right:0;top:10px;font-size:12.5px;color:#2874f0;font-weight:600;padding:4px 0;}
.tg-terms{font-size:11.5px;color:#878787;line-height:1.55;margin:4px 0 20px;}
.tg-terms a{color:#2874f0;font-weight:500;}
.tg-submit{width:100%;padding:14px 16px;border-radius:3px;font-size:15px;font-weight:700;color:#fff;background:#fb641b;letter-spacing:0.3px;display:flex;align-items:center;justify-content:center;gap:10px;transition:box-shadow .18s,filter .15s;box-shadow:0 1px 2px rgba(0,0,0,0.15);}
.tg-submit:hover{filter:brightness(1.05);box-shadow:0 4px 12px rgba(251,100,27,0.35);}
.tg-submit:disabled{opacity:0.75;cursor:not-allowed;}
.tg-submit.loading{pointer-events:none;}
.tg-spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:tgSpin .7s linear infinite;display:none;}
@keyframes tgSpin{to{transform:rotate(360deg);}}
.tg-submit.loading .tg-spinner{display:block;}
.tg-div{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:#999;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;font-weight:500;}
.tg-div::before,.tg-div::after{content:'';flex:1;height:1px;background:#e5e7eb;}
.tg-alt-btn{width:100%;padding:12px 16px;border-radius:3px;background:#fff;border:1px solid #d4d5d9;font-size:14px;font-weight:600;color:#2874f0;display:flex;align-items:center;justify-content:center;gap:10px;}
.tg-alt-btn svg{width:18px;height:18px;flex-shrink:0;}
.tg-alt-btn.loading{pointer-events:none;opacity:0.75;}
.tg-forgot-row{text-align:right;margin:-12px 0 18px;}
.tg-forgot{font-size:13px;color:#2874f0;font-weight:600;}
.tg-mode{text-align:center;margin-top:20px;font-size:13.5px;color:#878787;}
.tg-mode button{color:#2874f0;font-weight:700;margin-left:4px;}
.tg-field-name{display:none;}
.tg-card.signup .tg-field-name{display:block;}
.tg-card.signup .tg-forgot-row{display:none;}
.tg-toasts{position:fixed;top:20px;right:20px;z-index:999999;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 40px);pointer-events:none;}
.tg-toast{padding:13px 18px;border-radius:4px;background:#212121;color:#fff;font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.25);pointer-events:auto;animation:tgToastIn .25s;max-width:380px;line-height:1.4;}
@keyframes tgToastIn{from{transform:translateX(130%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.tg-toast.success{background:#388e3c;}
.tg-toast.error{background:#d32f2f;}
.tg-toast.info{background:#2874f0;}
.tg-auth-loading{position:fixed;inset:0;background:#fff;z-index:99999998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;}
.tg-auth-loading.show{display:flex;}
.tg-auth-loading-logo{font-weight:900;font-style:italic;font-size:32px;color:#2874f0;letter-spacing:-0.5px;margin-bottom:8px;}
.tg-auth-loading-logo span{color:#ffe500;}
.tg-auth-loading-spinner{width:48px;height:48px;border:4px solid #e0e0e0;border-top-color:#2874f0;border-radius:50%;animation:tgSpin .8s linear infinite;}
.tg-auth-loading-text{font-size:15px;color:#666;font-weight:500;text-align:center;padding:0 20px;line-height:1.5;}
.tg-auth-loading-check{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin-bottom:6px;animation:tgCheckPop .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 12px 40px rgba(34,197,94,0.4);}
@keyframes tgCheckPop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.tg-auth-loading-check svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:tgCheckDraw .3s .1s ease forwards;}
@keyframes tgCheckDraw{to{stroke-dashoffset:0;}}
.tg-overlay{position:fixed;inset:0;background:rgba(241,243,246,0.96);backdrop-filter:blur(4px);z-index:999998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.tg-overlay.show{display:flex;}
.tg-overlay-spinner{width:42px;height:42px;border:4px solid #d4d5d9;border-top-color:#2874f0;border-radius:50%;animation:tgSpin .8s linear infinite;}
.tg-overlay-text{font-size:14px;color:#212121;font-weight:500;text-align:center;padding:0 20px;}
.tg-modal{position:fixed;inset:0;background:rgba(15,23,41,0.6);backdrop-filter:blur(4px);z-index:999999999;display:none;align-items:center;justify-content:center;padding:20px;}
.tg-modal.show{display:flex;}
.tg-modal-box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:32px 28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.tg-modal-icon{width:72px;height:72px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;}
.tg-modal-icon.warn{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:#f57c00;}
.tg-modal-icon.error{background:linear-gradient(135deg,#ffebee,#ffcdd2);color:#d32f2f;}
.tg-modal-icon.info{background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:#1565c0;}
.tg-modal-icon.success{background:linear-gradient(135deg,#e6f7ec,#c8e6c9);color:#1b8a3a;}
.tg-modal-title{font-size:19px;font-weight:800;color:#212121;margin:0 0 10px;line-height:1.3;}
.tg-modal-desc{font-size:14px;color:#666;line-height:1.55;margin:0 0 22px;}
.tg-modal-desc b{color:#212121;font-weight:700;word-break:break-word;}
.tg-modal-actions{display:flex;gap:10px;flex-direction:column;}
.tg-modal-btn{padding:13px 20px;border-radius:10px;font-size:14.5px;font-weight:800;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
.tg-modal-btn.primary{background:linear-gradient(135deg,#2874f0,#1a5dc7);color:#fff;box-shadow:0 4px 12px rgba(40,116,240,0.35);}
.tg-modal-btn.orange{background:linear-gradient(135deg,#fb641b,#e65100);color:#fff;box-shadow:0 4px 12px rgba(251,100,27,0.35);}
.tg-modal-btn.danger{background:linear-gradient(135deg,#d32f2f,#b71c1c);color:#fff;box-shadow:0 4px 12px rgba(211,47,47,0.35);}
.tg-modal-btn.ghost{background:#f1f3f6;color:#212121;}
@media (max-width:720px){.tg-wrap{padding:16px 12px;align-items:flex-start;padding-top:28px;}.tg-card{max-width:100%;flex-direction:column;}.tg-left{flex:0 0 auto;max-width:100%;padding:22px 24px 20px;}.tg-left-content{margin:8px 0 0;padding:0;}.tg-left-title{font-size:19px;}.tg-left-sub{font-size:12.5px;max-width:100%;}.tg-left-foot{display:none;}.tg-right{padding:26px 24px 28px;}.tg-toasts{top:12px;right:12px;left:12px;max-width:none;align-items:stretch;}.tg-toast{max-width:none;}}
</style>
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
(function() {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════
     STEP 1: CONSTANTS
     ═══════════════════════════════════════════════════════════════ */
  const API_KEY = "AIzaSyAhxecFY9TwZTYbdCVRAcnp1whI-Uqc-P8";
  const PROJECT_ID = "toego-ecommerce";
  const REDIRECT_URL = 'shop-home.html';
  const SESSION_KEY = 'toego_session_v2';

  const REST_SIGNUP = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`;
  const REST_LOGIN = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`;
  const REST_RESET = `https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=${API_KEY}`;
  const REST_PROFILE = `https://identitytoolkit.googleapis.com/v1/accounts:update?key=${API_KEY}`;

  /* ═══════════════════════════════════════════════════════════════
     STEP 2: UNIVERSAL SESSION STORAGE
     Uses 4 methods: localStorage, sessionStorage, window.name, memory
     Whichever works, uses it — NO ERRORS EVER
     ═══════════════════════════════════════════════════════════════ */
  const _memoryStore = new Map();

  const SessionStore = {
    save(data) {
      const str = JSON.stringify(data);
      /* Try localStorage */
      try { localStorage.setItem(SESSION_KEY, str); } catch(e) {}
      /* Try sessionStorage */
      try { sessionStorage.setItem(SESSION_KEY, str); } catch(e) {}
      /* Try window.name (survives refresh in same tab, no cookies) */
      try {
        const existing = window.name ? JSON.parse(window.name) : {};
        existing[SESSION_KEY] = data;
        window.name = JSON.stringify(existing);
      } catch(e) {
        try { window.name = JSON.stringify({ [SESSION_KEY]: data }); } catch(e2) {}
      }
      /* Always keep in memory */
      _memoryStore.set(SESSION_KEY, data);
    },
    load() {
      /* Try memory first (fastest) */
      if (_memoryStore.has(SESSION_KEY)) {
        const m = _memoryStore.get(SESSION_KEY);
        if (m && m.ts && Date.now() - m.ts < 30 * 24 * 3600 * 1000) return m;
      }
      /* Try localStorage */
      try {
        const s = localStorage.getItem(SESSION_KEY);
        if (s) { const d = JSON.parse(s); if (d && d.ts && Date.now() - d.ts < 30 * 24 * 3600 * 1000) return d; }
      } catch(e) {}
      /* Try sessionStorage */
      try {
        const s = sessionStorage.getItem(SESSION_KEY);
        if (s) { const d = JSON.parse(s); if (d && d.ts && Date.now() - d.ts < 30 * 24 * 3600 * 1000) return d; }
      } catch(e) {}
      /* Try window.name */
      try {
        if (window.name) {
          const obj = JSON.parse(window.name);
          if (obj && obj[SESSION_KEY]) {
            const d = obj[SESSION_KEY];
            if (d && d.ts && Date.now() - d.ts < 30 * 24 * 3600 * 1000) return d;
          }
        }
      } catch(e) {}
      return null;
    },
    clear() {
      try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
      try { sessionStorage.removeItem(SESSION_KEY); } catch(e) {}
      try {
        if (window.name) {
          const obj = JSON.parse(window.name);
          delete obj[SESSION_KEY];
          window.name = JSON.stringify(obj);
        }
      } catch(e) {}
      _memoryStore.delete(SESSION_KEY);
    }
  };

  /* ═══════════════════════════════════════════════════════════════
     STEP 3: REST ERROR MAPPER
     ═══════════════════════════════════════════════════════════════ */
  function mapRestError(msg) {
    msg = String(msg || '').toUpperCase();
    if (msg.includes('EMAIL_EXISTS')) return 'auth/email-already-in-use';
    if (msg.includes('EMAIL_NOT_FOUND')) return 'auth/user-not-found';
    if (msg.includes('INVALID_PASSWORD')) return 'auth/wrong-password';
    if (msg.includes('INVALID_LOGIN_CREDENTIALS')) return 'auth/wrong-password';
    if (msg.includes('INVALID_EMAIL')) return 'auth/invalid-email';
    if (msg.includes('USER_DISABLED')) return 'auth/user-disabled';
    if (msg.includes('TOO_MANY_ATTEMPTS')) return 'auth/too-many-requests';
    if (msg.includes('WEAK_PASSWORD')) return 'auth/weak-password';
    if (msg.includes('MISSING_PASSWORD')) return 'auth/weak-password';
    if (msg.includes('OPERATION_NOT_ALLOWED')) return 'auth/operation-not-allowed';
    if (msg.includes('INVALID_IDP_RESPONSE')) return 'auth/wrong-password';
    return 'auth/unknown';
  }

  /* ═══════════════════════════════════════════════════════════════
     STEP 4: REST API CALLS
     ═══════════════════════════════════════════════════════════════ */
  async function restSignup(email, password) {
    const res = await fetch(REST_SIGNUP, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, returnSecureToken: true })
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && data.error.message) || 'UNKNOWN';
      throw { code: mapRestError(msg), message: msg };
    }
    return data;
  }

  async function restLogin(email, password) {
    const res = await fetch(REST_LOGIN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, returnSecureToken: true })
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && data.error.message) || 'UNKNOWN';
      throw { code: mapRestError(msg), message: msg };
    }
    return data;
  }

  async function restReset(email) {
    const res = await fetch(REST_RESET, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requestType: 'PASSWORD_RESET', email })
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && data.error.message) || 'UNKNOWN';
      throw { code: mapRestError(msg), message: msg };
    }
    return data;
  }

  async function updateProfileRest(idToken, displayName) {
    try {
      await fetch(REST_PROFILE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken, displayName, returnSecureToken: false })
      });
    } catch(e) {}
  }

  /* ═══════════════════════════════════════════════════════════════
     STEP 5: SAVE USER DOC VIA FIRESTORE REST
     ═══════════════════════════════════════════════════════════════ */
  async function saveUserDoc(idToken, uid, email, name) {
    try {
      const docUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/users/${uid}`;
      const now = new Date().toISOString();
      const fields = {
        uid: { stringValue: uid },
        email: { stringValue: email },
        name: { stringValue: name || email.split('@')[0] },
        role: { stringValue: 'customer' },
        lastLogin: { timestampValue: now }
      };
      /* Check if exists */
      const checkRes = await fetch(docUrl, { headers: { 'Authorization': 'Bearer ' + idToken } });
      if (checkRes.ok) {
        /* Update only */
        await fetch(docUrl + '?updateMask.fieldPaths=name&updateMask.fieldPaths=lastLogin', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
          body: JSON.stringify({ fields })
        });
      } else {
        /* Create */
        fields.createdAt = { timestampValue: now };
        await fetch(docUrl, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
          body: JSON.stringify({ fields })
        });
      }
    } catch(e) { console.warn('[userdoc]', e); }
  }

  /* ═══════════════════════════════════════════════════════════════
     STEP 6: FIREBASE INIT (for Google auth only)
     ═══════════════════════════════════════════════════════════════ */
  if (!window.__TOEGO_FB__) {
    try {
      window.__TOEGO_FB__ = firebase.initializeApp({
        apiKey: API_KEY,
        authDomain: PROJECT_ID + ".firebaseapp.com",
        projectId: PROJECT_ID,
        storageBucket: PROJECT_ID + ".firebasestorage.app",
        messagingSenderId: "234167880880",
        appId: "1:234167880880:web:b89d4b8e5f8cc9af3c3f75"
      });
    } catch(e) { console.error('[fb]', e); }
  }
  const auth = firebase.auth();
  const db = firebase.firestore();
  const FV = firebase.firestore.FieldValue;

  /* Set NONE persistence for maximum compatibility */
  auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => {});

  /* ═══════════════════════════════════════════════════════════════
     STEP 7: UI HELPERS
     ═══════════════════════════════════════════════════════════════ */
  const overlay = document.getElementById('tg-overlay');
  const overlayText = document.getElementById('tg-overlay-text');
  function showOverlay(t) { if (overlayText) overlayText.textContent = t || 'Please wait…'; if (overlay) overlay.classList.add('show'); }
  function hideOverlay() { if (overlay) overlay.classList.remove('show'); }

  function toast(msg, type) {
    type = type || 'info';
    const w = document.getElementById('tg-toasts');
    if (!w || !msg) return;
    const el = document.createElement('div');
    el.className = 'tg-toast ' + type;
    el.textContent = msg;
    w.appendChild(el);
    setTimeout(() => { el.style.transition = 'transform .3s, opacity .3s'; el.style.transform = 'translateX(130%)'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2500);
  }

  /* ═══ MODAL ═══ */
  const modal = document.getElementById('tg-modal');
  const modalIcon = document.getElementById('tg-modal-icon');
  const modalTitle = document.getElementById('tg-modal-title');
  const modalDesc = document.getElementById('tg-modal-desc');
  const modalPrimary = document.getElementById('tg-modal-primary');
  const modalSecondary = document.getElementById('tg-modal-secondary');
  let _modalCb = null;

  function showModal(opts) {
    opts = opts || {};
    const type = opts.type || 'info';
    const icons = { warn: '!', error: '✕', info: 'i', success: '✓' };
    modalIcon.className = 'tg-modal-icon ' + type;
    modalIcon.textContent = icons[type] || '!';
    modalTitle.textContent = opts.title || 'Notice';
    modalDesc.innerHTML = opts.desc || '';
    modalPrimary.innerHTML = opts.primaryText || 'OK';
    modalPrimary.className = 'tg-modal-btn ' + (type === 'error' ? 'danger' : type === 'warn' ? 'orange' : 'primary');
    _modalCb = opts.onPrimary || null;
    if (opts.secondaryText) {
      modalSecondary.style.display = 'flex';
      modalSecondary.textContent = opts.secondaryText;
      modalSecondary.onclick = function() { closeModal(); if (opts.onSecondary) opts.onSecondary(); };
    } else {
      modalSecondary.style.display = 'none';
    }
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() { modal.classList.remove('show'); document.body.style.overflow = ''; _modalCb = null; }
  modalPrimary.addEventListener('click', function() { const cb = _modalCb; closeModal(); if (cb) cb(); });
  modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });

  /* ═══════════════════════════════════════════════════════════════
     STEP 8: ERROR DISPLAY — SILENT for storage errors
     ═══════════════════════════════════════════════════════════════ */
  function showError(err) {
    const code = (err && err.code) || 'unknown';
    console.warn('[auth-error]', code, err && err.message);

    /* SILENT — storage/cookie errors never shown */
    if (code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') return;
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return;
    if (code === 'auth/no-auth-event') return;

    if (code === 'auth/email-already-in-use') {
      showModal({ type: 'warn', title: 'Already Registered', desc: 'Ye email pehle se registered hai.<br><br>Isi email se <b>login</b> karo?', primaryText: 'Yes, Login', secondaryText: 'Try Different Email', onPrimary: () => { if (mode !== 'login') setMode('login'); passwordInput.value = ''; passwordInput.focus(); }, onSecondary: () => { emailInput.focus(); emailInput.select(); } });
      return;
    }
    if (code === 'auth/weak-password') {
      showModal({ type: 'warn', title: 'Weak Password', desc: 'Password kam se kam <b>6 characters</b> ka hona chahiye.', primaryText: 'Try Again', onPrimary: () => { passwordInput.focus(); passwordInput.select(); } });
      return;
    }
    if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') {
      showModal({ type: 'error', title: 'Incorrect Password', desc: 'Email sahi hai lekin <b>password galat</b> hai.<br><br>Yaad nahi? "Reset Password" use karo.', primaryText: 'Try Again', secondaryText: 'Reset Password', onPrimary: () => { passwordInput.focus(); passwordInput.select(); }, onSecondary: () => { doForgotPassword(); } });
      return;
    }
    if (code === 'auth/user-not-found') {
      showModal({ type: 'warn', title: 'Account Not Found', desc: 'Is email se koi account nahi mila.<br><br>Naya account banao ya different email try karo.', primaryText: 'Create Account', secondaryText: 'Try Different Email', onPrimary: () => setMode('signup'), onSecondary: () => { emailInput.focus(); emailInput.select(); } });
      return;
    }
    if (code === 'auth/invalid-email') {
      showModal({ type: 'warn', title: 'Invalid Email', desc: 'Please ek <b>valid email address</b> daalo.', primaryText: 'OK', onPrimary: () => { emailInput.focus(); emailInput.select(); } });
      return;
    }
    if (code === 'auth/network-request-failed') {
      showModal({ type: 'error', title: 'No Internet', desc: 'Network connection check karo.', primaryText: 'Retry', onPrimary: () => submitBtn.click() });
      return;
    }
    if (code === 'auth/too-many-requests') {
      showModal({ type: 'error', title: 'Too Many Attempts', desc: 'Kuch der baad try karo ya password reset karo.', primaryText: 'OK' });
      return;
    }
    if (code === 'auth/user-disabled') {
      showModal({ type: 'error', title: 'Account Disabled', desc: 'Ye account block ho gaya hai.', primaryText: 'OK' });
      return;
    }
    if (code === 'auth/operation-not-allowed') {
      showModal({ type: 'error', title: 'Configuration Error', desc: 'Service abhi available nahi hai. Baad me try karo.', primaryText: 'OK' });
      return;
    }

    /* Generic */
    showModal({ type: 'error', title: 'Login Failed', desc: 'Kuch problem aayi. Please try again.', primaryText: 'Try Again' });
  }

  /* ═══════════════════════════════════════════════════════════════
     STEP 9: UI REFS
     ═══════════════════════════════════════════════════════════════ */
  const card = document.getElementById('tg-card');
  const leftTitle = document.getElementById('tg-left-title');
  const leftSub = document.getElementById('tg-left-sub');
  const form = document.getElementById('tg-form');
  const nameInput = document.getElementById('tg-name');
  const emailInput = document.getElementById('tg-email');
  const passwordInput = document.getElementById('tg-password');
  const submitBtn = document.getElementById('tg-submit');
  const submitText = document.getElementById('tg-submit-text');
  const modeSwitch = document.getElementById('tg-mode-switch');
  const modeLabel = document.getElementById('tg-mode-label');
  const passToggle = document.getElementById('tg-toggle-pass');
  const googleBtn = document.getElementById('tg-google');
  const googleText = document.getElementById('tg-google-text');
  const forgotLink = document.getElementById('tg-forgot');
  const forgotRow = document.getElementById('tg-forgot-row');

  let mode = 'login';
  function setMode(m) {
    mode = m;
    if (m === 'signup') {
      card.classList.add('signup');
      leftTitle.textContent = 'Looks like you\'re new here!';
      leftSub.textContent = 'Sign up with TOEGO and unlock exclusive deals, faster checkout & order tracking.';
      submitText.textContent = 'Sign Up';
      modeLabel.textContent = 'Already have an account?';
      modeSwitch.textContent = 'Log in';
      passwordInput.setAttribute('autocomplete', 'new-password');
      forgotRow.style.display = 'none';
    } else {
      card.classList.remove('signup');
      leftTitle.textContent = 'Login';
      leftSub.textContent = 'Get access to your Orders, Wishlist and Recommendations';
      submitText.textContent = 'Login';
      modeLabel.textContent = 'New to TOEGO?';
      modeSwitch.textContent = 'Create an account';
      passwordInput.setAttribute('autocomplete', 'current-password');
      forgotRow.style.display = '';
    }
  }
  modeSwitch.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));
  passToggle.addEventListener('click', () => {
    const isPass = passwordInput.type === 'password';
    passwordInput.type = isPass ? 'text' : 'password';
    passToggle.textContent = isPass ? 'Hide' : 'Show';
  });
  [nameInput, emailInput, passwordInput].forEach(inp => {
    if (!inp) return;
    const upd = () => inp.classList.toggle('filled', !!inp.value);
    inp.addEventListener('input', upd);
    inp.addEventListener('blur', upd);
    upd();
  });

  function setSubmitLoading(on, txt) {
    if (on) { submitBtn.classList.add('loading'); submitBtn.disabled = true; if (txt) submitText.textContent = txt; }
    else { submitBtn.classList.remove('loading'); submitBtn.disabled = false; submitText.textContent = mode === 'signup' ? 'Sign Up' : 'Login'; }
  }
  function setGoogleLoading(on) {
    googleBtn.classList.toggle('loading', on);
    googleText.textContent = on ? 'Please wait…' : 'Continue with Google';
  }

  /* ═══════════════════════════════════════════════════════════════
     STEP 10: SUCCESS HANDLER
     ═══════════════════════════════════════════════════════════════ */
  let _redirected = false;

  function showSuccessAndRedirect(userData) {
    if (_redirected) return;
    _redirected = true;

    /* Show green check */
    const el = document.getElementById('tg-auth-loading');
    const txt = document.getElementById('tg-auth-loading-text');
    const spinner = document.getElementById('tg-auth-loading-spinner');
    const check = document.getElementById('tg-auth-loading-check');
    if (txt) txt.textContent = 'Login successful! Redirecting…';
    if (spinner) spinner.style.display = 'none';
    if (check) check.style.display = 'flex';
    if (el) el.classList.add('show');
    const wrap = document.getElementById('tg-wrap');
    if (wrap) wrap.style.display = 'none';
    document.body.style.overflow = 'hidden';

    /* Save session (all 4 methods) */
    SessionStore.save({
      uid: userData.uid,
      email: userData.email,
      name: userData.name || userData.email.split('@')[0],
      idToken: userData.idToken || '',
      ts: Date.now()
    });

    /* Save login success flag for shop-home toast */
    try {
      sessionStorage.setItem('tg_login_success', JSON.stringify({ name: userData.name || 'User', ts: Date.now() }));
    } catch(e) {
      try { window.name = JSON.stringify({ tg_login_success: { name: userData.name || 'User', ts: Date.now() } }); } catch(e2) {}
    }

    setTimeout(() => { window.location.replace(REDIRECT_URL); }, 400);
  }

  /* ═══════════════════════════════════════════════════════════════
     STEP 11: EMAIL/PASSWORD SUBMIT — 3-TIER FALLBACK
     Tier 1: Firebase SDK
     Tier 2: Recover from auth.currentUser (storage error case)
     Tier 3: REST API directly
     ═══════════════════════════════════════════════════════════════ */
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = (emailInput.value || '').trim();
    const password = passwordInput.value || '';
    const name = (nameInput && nameInput.value || '').trim();

    /* Validate */
    if (!email) { showModal({ type: 'warn', title: 'Email Required', desc: 'Please apna <b>email</b> daalo.', primaryText: 'OK', onPrimary: () => emailInput.focus() }); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showModal({ type: 'warn', title: 'Invalid Email', desc: 'Please valid email daalo.<br><br>Example: name@gmail.com', primaryText: 'OK', onPrimary: () => { emailInput.focus(); emailInput.select(); } }); return; }
    if (!password) { showModal({ type: 'warn', title: 'Password Required', desc: 'Please apna <b>password</b> daalo.', primaryText: 'OK', onPrimary: () => passwordInput.focus() }); return; }
    if (password.length < 6) { showModal({ type: 'warn', title: 'Password Too Short', desc: 'Password kam se kam <b>6 characters</b>.', primaryText: 'OK', onPrimary: () => { passwordInput.focus(); passwordInput.select(); } }); return; }
    if (mode === 'signup' && !name) { showModal({ type: 'warn', title: 'Name Required', desc: 'Please apna <b>full name</b> daalo.', primaryText: 'OK', onPrimary: () => nameInput.focus() }); return; }

    setSubmitLoading(true, mode === 'signup' ? 'Creating account…' : 'Logging in…');

    /* ═══ TIER 1: Firebase SDK ═══ */
    try {
      console.log('[tier1] Firebase SDK', mode);
      let cred;
      if (mode === 'signup') {
        cred = await auth.createUserWithEmailAndPassword(email, password);
        if (cred.user && name) {
          try { await cred.user.updateProfile({ displayName: name }); } catch(e) {}
        }
      } else {
        cred = await auth.signInWithEmailAndPassword(email, password);
      }
      if (cred && cred.user) {
        console.log('[tier1] ✓ success');
        /* Save user doc via SDK */
        try {
          const ref = db.collection('users').doc(cred.user.uid);
          ref.get().then(snap => {
            const data = {
              uid: cred.user.uid, email: email,
              name: name || cred.user.displayName || email.split('@')[0],
              role: 'customer', lastLogin: FV.serverTimestamp()
            };
            if (!snap.exists) { data.createdAt = FV.serverTimestamp(); ref.set(data).catch(() => {}); }
            else { ref.update({ lastLogin: FV.serverTimestamp() }).catch(() => {}); }
          }).catch(() => {});
        } catch(e) {}
        showSuccessAndRedirect({
          uid: cred.user.uid,
          email: email,
          name: name || cred.user.displayName || email.split('@')[0]
        });
        return;
      }
    } catch (err) {
      const code = err && err.code;
      console.log('[tier1] failed:', code);

      /* ═══ TIER 2: Recover from auth.currentUser (storage error case) ═══ */
      if (code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') {
        if (auth.currentUser) {
          console.log('[tier2] ✓ recovered from auth.currentUser');
          showSuccessAndRedirect({
            uid: auth.currentUser.uid,
            email: auth.currentUser.email || email,
            name: name || auth.currentUser.displayName || email.split('@')[0]
          });
          return;
        }
        /* ═══ TIER 3: REST API directly ═══ */
        console.log('[tier3] trying REST API');
        try {
          const data = mode === 'signup'
            ? await restSignup(email, password)
            : await restLogin(email, password);

          console.log('[tier3] ✓ success');

          /* Update name if signup */
          if (mode === 'signup' && name && data.idToken) {
            updateProfileRest(data.idToken, name);
          }

          /* Save user doc */
          if (data.idToken && data.localId) {
            saveUserDoc(data.idToken, data.localId, email, name);
          }

          showSuccessAndRedirect({
            uid: data.localId,
            email: data.email || email,
            name: name || data.email.split('@')[0],
            idToken: data.idToken
          });
          return;
        } catch (restErr) {
          console.log('[tier3] failed:', restErr && restErr.code);
          setSubmitLoading(false);
          showError(restErr);
          return;
        }
      }

      /* ═══ Real error — show it ═══ */
      setSubmitLoading(false);
      showError(err);
    }
  });

  /* ═══════════════════════════════════════════════════════════════
     STEP 12: GOOGLE LOGIN
     ═══════════════════════════════════════════════════════════════ */
  googleBtn.addEventListener('click', async () => {
    setGoogleLoading(true);

    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    try {
      const result = await auth.signInWithPopup(provider);
      if (result && result.user) {
        showSuccessAndRedirect({
          uid: result.user.uid,
          email: result.user.email,
          name: result.user.displayName || result.user.email.split('@')[0]
        });
        return;
      }
      setGoogleLoading(false);
    } catch (err) {
      const code = err && err.code;

      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
        setGoogleLoading(false);
        return;
      }

      /* Recover from auth.currentUser */
      if ((code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') && auth.currentUser) {
        showSuccessAndRedirect({
          uid: auth.currentUser.uid,
          email: auth.currentUser.email,
          name: auth.currentUser.displayName || auth.currentUser.email.split('@')[0]
        });
        return;
      }

      /* Popup blocked → redirect */
      if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') {
        try {
          sessionStorage.setItem('tg_google_pending', '1');
        } catch(e) {}
        try { await auth.signInWithRedirect(provider); return; }
        catch (re) { setGoogleLoading(false); showError(re); return; }
      }

      if (code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') {
        setGoogleLoading(false);
        return;
      }

      setGoogleLoading(false);
      showError(err);
    }
  });

  /* ═══ REDIRECT RETURN ═══ */
  (async function handleRedirectReturn() {
    try {
      const result = await auth.getRedirectResult();
      if (result && result.user) {
        try { sessionStorage.removeItem('tg_google_pending'); } catch(e) {}
        showSuccessAndRedirect({
          uid: result.user.uid,
          email: result.user.email,
          name: result.user.displayName || result.user.email.split('@')[0]
        });
      }
    } catch (err) { /* silent */ }
  })();

  /* ═══════════════════════════════════════════════════════════════
     STEP 13: AUTH STATE LISTENER
     Catches SDK sign-ins automatically
     ═══════════════════════════════════════════════════════════════ */
  let _authStateFirst = true;
  auth.onAuthStateChanged((user) => {
    if (!user) {
      _authStateFirst = false;
      return;
    }
    /* If user appears due to SDK sign-in, trigger success */
    if (_authStateFirst || !_redirected) {
      console.log('[auth-state] user present:', user.email);
      showSuccessAndRedirect({
        uid: user.uid,
        email: user.email,
        name: user.displayName || user.email.split('@')[0]
      });
    }
    _authStateFirst = false;
  });

  /* ═══════════════════════════════════════════════════════════════
     STEP 14: RESTORE SESSION FROM PREVIOUS LOGIN
     If user already has a session (from window.name/localStorage),
     redirect immediately to shop-home
     ═══════════════════════════════════════════════════════════════ */
  (function restoreSession() {
    const session = SessionStore.load();
    if (session && session.uid && session.email) {
      /* Check if recently logged in — if yes, auto-redirect */
      const ageMs = Date.now() - (session.ts || 0);
      if (ageMs < 30 * 24 * 3600 * 1000) {
        console.log('[session] found — redirecting to shop-home');
        window.location.replace(REDIRECT_URL);
      }
    }
  })();

  /* ═══════════════════════════════════════════════════════════════
     STEP 15: FORGOT PASSWORD
     ═══════════════════════════════════════════════════════════════ */
  async function doForgotPassword() {
    const email = (emailInput.value || '').trim();
    if (!email) { showModal({ type: 'info', title: 'Email Required', desc: 'Password reset ke liye pehle <b>email</b> daalo.', primaryText: 'OK', onPrimary: () => emailInput.focus() }); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showModal({ type: 'warn', title: 'Invalid Email', desc: 'Please valid email daalo.', primaryText: 'OK', onPrimary: () => { emailInput.focus(); emailInput.select(); } }); return; }

    showOverlay('Sending reset link…');
    try {
      /* Try SDK first */
      try { await auth.sendPasswordResetEmail(email); }
      catch(sdkErr) {
        console.log('[reset] SDK failed, trying REST:', sdkErr && sdkErr.code);
        await restReset(email);
      }
      hideOverlay();
      showModal({ type: 'success', title: 'Reset Link Sent', desc: 'Reset link bhej diya gaya hai:<br><br><b>' + email + '</b><br><br>Inbox check karo (spam bhi dekh lo).', primaryText: 'OK' });
    } catch (err) {
      hideOverlay();
      const code = err && err.code;
      if (code === 'auth/user-not-found') {
        showModal({ type: 'warn', title: 'Account Not Found', desc: 'Is email se koi account nahi mila.', primaryText: 'Create Account', secondaryText: 'Cancel', onPrimary: () => setMode('signup') });
      } else {
        showError(err);
      }
    }
  }
  forgotLink.addEventListener('click', (e) => { e.preventDefault(); doForgotPassword(); });

  /* ═══ THEME ═══ */
  setTimeout(() => {
    try {
      db.collection('siteSettings').doc('theme').get()
        .then(snap => {
          if (snap.exists) {
            const p = snap.data().themeColor || '#2874f0';
            document.getElementById('tg-left').style.background = p;
            document.documentElement.style.setProperty('--tg-primary', p);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', p);
          }
        })
        .catch(() => {});
    } catch(e) {}
  }, 300);

})();
</script>
</body>
