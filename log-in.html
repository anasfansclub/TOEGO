<meta name="theme-color" content="#2874f0" id="tg-theme-meta">
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100vw;overflow-x:hidden;min-height:100vh;font-family:'Roboto',Arial,sans-serif;color:#212121;background:#f1f3f6;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font:inherit;}
a{color:inherit;text-decoration:none;}
header#top,#top_menu,nav.o_main_navbar,.o_main_navbar,footer#bottom,.o_footer,#footer,.o_breadcrumb,.breadcrumb{display:none!important;}

.tg-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(135deg,#f1f3f6 0%,#e8ecf4 100%);}
.tg-card{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(15,23,41,0.12);display:flex;overflow:hidden;}
.tg-left{flex:0 0 40%;max-width:40%;background:linear-gradient(135deg,#2874f0 0%,#1a5dc7 100%);color:#fff;padding:40px 34px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.tg-left::before{content:'';position:absolute;top:-100px;right:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(255,255,255,0.12),transparent 70%);border-radius:50%;pointer-events:none;}
.tg-left::after{content:'';position:absolute;bottom:-80px;left:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,229,0,0.15),transparent 70%);border-radius:50%;pointer-events:none;}
.tg-left-logo{font-weight:900;font-style:italic;font-size:28px;letter-spacing:-0.4px;position:relative;z-index:2;}
.tg-left-logo span{color:#ffe500;}
.tg-left-content{position:relative;z-index:2;margin-top:auto;margin-bottom:auto;padding:32px 0;}
.tg-left-title{font-size:28px;font-weight:700;line-height:1.2;margin:0 0 14px;letter-spacing:-0.3px;}
.tg-left-sub{font-size:14.5px;line-height:1.55;opacity:0.92;margin:0;max-width:280px;font-weight:400;}
.tg-left-foot{font-size:11px;opacity:0.7;position:relative;z-index:2;}
.tg-right{flex:1 1 auto;padding:44px 48px 40px;display:flex;flex-direction:column;justify-content:center;}
.tg-field{position:relative;margin-bottom:26px;}
.tg-field input{width:100%;height:46px;border:none;border-bottom:1.5px solid #d4d5d9;background:transparent;font-size:15px;color:#212121;padding:8px 0 10px;outline:none;border-radius:0;transition:border-color .2s;}
.tg-field input:focus{border-bottom-color:#2874f0;}
.tg-field label{position:absolute;left:0;top:14px;font-size:15px;color:#878787;pointer-events:none;transition:all .2s ease;background:#fff;padding:0 4px;margin-left:-4px;font-weight:400;}
.tg-field input:focus+label,.tg-field input:not(:placeholder-shown)+label,.tg-field input.filled+label{top:-8px;font-size:12px;color:#2874f0;font-weight:600;}
.tg-field-pass{position:relative;}
.tg-pass-toggle{position:absolute;right:0;top:12px;font-size:13px;color:#2874f0;font-weight:700;padding:4px 0;letter-spacing:0.2px;}
.tg-pass-toggle:hover{color:#1a5dc7;}
.tg-terms{font-size:11.5px;color:#878787;line-height:1.6;margin:6px 0 22px;}
.tg-terms a{color:#2874f0;font-weight:600;}
.tg-submit{width:100%;padding:15px 20px;border-radius:6px;font-size:15.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#fb641b 0%,#e04e0a 100%);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 8px rgba(251,100,27,0.3);transition:all .15s;letter-spacing:0.3px;}
.tg-submit:hover:not(:disabled){filter:brightness(1.05);box-shadow:0 4px 14px rgba(251,100,27,0.4);transform:translateY(-1px);}
.tg-submit:active:not(:disabled){transform:translateY(0);}
.tg-submit:disabled{opacity:0.75;cursor:not-allowed;}
.tg-submit.loading{pointer-events:none;}
.tg-spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:tgSpin .7s linear infinite;display:none;}
@keyframes tgSpin{to{transform:rotate(360deg);}}
.tg-submit.loading .tg-spinner{display:block;}
.tg-div{display:flex;align-items:center;gap:14px;margin:22px 0 16px;color:#999;font-size:11px;text-transform:uppercase;font-weight:600;letter-spacing:0.6px;}
.tg-div::before,.tg-div::after{content:'';flex:1;height:1px;background:#e5e7eb;}
.tg-alt-btn{width:100%;padding:13px 20px;border-radius:6px;background:#fff;border:1.5px solid #d4d5d9;font-size:14.5px;font-weight:700;color:#2874f0;display:flex;align-items:center;justify-content:center;gap:12px;transition:all .15s;min-height:50px;}
.tg-alt-btn:hover:not(:disabled){background:#f8faff;border-color:#2874f0;box-shadow:0 2px 8px rgba(40,116,240,0.12);}
.tg-alt-btn svg{width:20px;height:20px;flex-shrink:0;}
.tg-alt-btn.loading{pointer-events:none;opacity:0.7;}
.tg-forgot-row{text-align:right;margin:-14px 0 20px;}
.tg-forgot{font-size:13.5px;color:#2874f0;font-weight:700;}
.tg-forgot:hover{text-decoration:underline;}
.tg-mode{text-align:center;margin-top:24px;font-size:14px;color:#878787;}
.tg-mode button{color:#2874f0;font-weight:800;margin-left:6px;}
.tg-mode button:hover{text-decoration:underline;}
.tg-field-name{display:none;}
.tg-card.signup .tg-field-name{display:block;}
.tg-card.signup .tg-forgot-row{display:none;}
.tg-toasts{position:fixed;top:20px;right:20px;z-index:999999;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 40px);pointer-events:none;}
.tg-toast{padding:13px 20px;border-radius:8px;background:#212121;color:#fff;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,0.25);pointer-events:auto;animation:tgToastIn .3s;max-width:380px;line-height:1.4;font-weight:500;}
@keyframes tgToastIn{from{transform:translateX(130%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.tg-toast.success{background:linear-gradient(135deg,#388e3c,#2e7d32);}
.tg-toast.error{background:linear-gradient(135deg,#d32f2f,#b71c1c);}
.tg-toast.info{background:linear-gradient(135deg,#2874f0,#1a5dc7);}
.tg-auth-loading{position:fixed;inset:0;background:#fff;z-index:99999998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:20px;}
.tg-auth-loading.show{display:flex;}
.tg-auth-loading-logo{font-weight:900;font-style:italic;font-size:36px;color:#2874f0;margin-bottom:6px;letter-spacing:-0.5px;}
.tg-auth-loading-logo span{color:#ffe500;}
.tg-auth-loading-spinner{width:52px;height:52px;border:4px solid #e0e0e0;border-top-color:#2874f0;border-radius:50%;animation:tgSpin .85s linear infinite;}
.tg-auth-loading-text{font-size:15px;color:#666;font-weight:500;text-align:center;padding:0 20px;line-height:1.5;max-width:320px;}
.tg-auth-loading-check{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin-bottom:6px;animation:tgCheckPop .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 12px 40px rgba(34,197,94,0.4);}
@keyframes tgCheckPop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.tg-auth-loading-check svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:tgCheckDraw .35s .1s ease forwards;}
@keyframes tgCheckDraw{to{stroke-dashoffset:0;}}
.tg-modal{position:fixed;inset:0;background:rgba(15,23,41,0.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:999999999;display:none;align-items:center;justify-content:center;padding:20px;}
.tg-modal.show{display:flex;}
.tg-modal-box{background:#fff;border-radius:16px;max-width:440px;width:100%;padding:34px 28px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.35);animation:tgModalPop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes tgModalPop{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.tg-modal-icon{width:76px;height:76px;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;}
.tg-modal-icon.warn{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:#f57c00;}
.tg-modal-icon.error{background:linear-gradient(135deg,#ffebee,#ffcdd2);color:#d32f2f;}
.tg-modal-icon.info{background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:#1565c0;}
.tg-modal-icon.success{background:linear-gradient(135deg,#e6f7ec,#c8e6c9);color:#1b8a3a;}
.tg-modal-title{font-size:20px;font-weight:800;color:#212121;margin:0 0 12px;line-height:1.3;letter-spacing:-0.2px;}
.tg-modal-desc{font-size:14px;color:#555;line-height:1.6;margin:0 0 24px;}
.tg-modal-desc b{color:#212121;font-weight:800;word-break:break-word;}
.tg-modal-actions{display:flex;gap:10px;flex-direction:column;}
.tg-modal-btn{padding:13px 20px;border-radius:10px;font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;width:100%;transition:all .15s;min-height:48px;}
.tg-modal-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
.tg-modal-btn.primary{background:linear-gradient(135deg,#2874f0,#1a5dc7);color:#fff;box-shadow:0 4px 12px rgba(40,116,240,0.3);}
.tg-modal-btn.orange{background:linear-gradient(135deg,#fb641b,#e65100);color:#fff;box-shadow:0 4px 12px rgba(251,100,27,0.3);}
.tg-modal-btn.danger{background:linear-gradient(135deg,#d32f2f,#b71c1c);color:#fff;box-shadow:0 4px 12px rgba(211,47,47,0.3);}
.tg-modal-btn.ghost{background:#f1f3f6;color:#212121;}
@media (max-width:768px){
  .tg-wrap{padding:16px 12px;align-items:flex-start;padding-top:24px;min-height:100vh;}
  .tg-card{max-width:100%;flex-direction:column;border-radius:14px;}
  .tg-left{flex:0 0 auto;max-width:100%;padding:24px 22px 22px;}
  .tg-left-content{display:none;}
  .tg-left-logo{font-size:24px;text-align:center;}
  .tg-left-foot{display:none;}
  .tg-right{padding:28px 24px 32px;}
  .tg-field input{height:50px;font-size:16px;padding:10px 0 12px;}
  .tg-field label{font-size:15.5px;top:16px;}
  .tg-field input:focus+label,.tg-field input:not(:placeholder-shown)+label,.tg-field input.filled+label{top:-8px;font-size:12.5px;}
  .tg-field{margin-bottom:24px;}
  .tg-submit{padding:16px 20px;font-size:16px;min-height:54px;border-radius:8px;}
  .tg-alt-btn{padding:15px 20px;font-size:15px;min-height:54px;border-radius:8px;}
  .tg-alt-btn svg{width:22px;height:22px;}
  .tg-pass-toggle{font-size:13.5px;top:14px;padding:6px 0;}
  .tg-terms{font-size:12px;margin:8px 0 20px;}
  .tg-forgot{font-size:14px;}
  .tg-mode{font-size:14.5px;margin-top:22px;}
  .tg-toasts{top:12px;right:12px;left:12px;max-width:none;align-items:stretch;}
  .tg-toast{max-width:none;font-size:13px;padding:12px 16px;}
  .tg-modal-box{padding:28px 22px 22px;border-radius:14px;}
  .tg-modal-icon{width:68px;height:68px;font-size:34px;margin-bottom:16px;}
  .tg-modal-title{font-size:18px;}
  .tg-modal-desc{font-size:13.5px;margin-bottom:20px;}
  .tg-modal-btn{font-size:14px;min-height:50px;padding:14px 18px;}
  .tg-auth-loading-logo{font-size:30px;}
  .tg-auth-loading-text{font-size:14px;}
}
@media (max-width:380px){
  .tg-right{padding:22px 18px 26px;}
  .tg-left{padding:20px 18px;}
  .tg-left-logo{font-size:22px;}
  .tg-submit{font-size:15px;min-height:50px;}
  .tg-alt-btn{font-size:14px;}
  .tg-field input{font-size:16px;}
}
</style>
</head>
<body>

<div class="tg-wrap" id="tg-wrap">

        <button type="button" class="tg-alt-btn" id="tg-google">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
          <span id="tg-google-text">Continue with Google</span>
        </button>
        <div class="tg-mode">
          <span id="tg-mode-label">New to TOEGO?</span>
          <button type="button" id="tg-mode-switch">Create an account</button>
        </div>
      </form>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
(function() {
  'use strict';

  const API_KEY = "AIzaSyAhxecFY9TwZTYbdCVRAcnp1whI-Uqc-P8";
  const PROJECT_ID = "toego-ecommerce";
  const REDIRECT_URL = 'shop-home.html';
  const AUTH_CACHE_KEY = 'toego_auth_cache';
  const SESSION_KEY = 'toego_session_v2';
  const GOOGLE_PENDING_KEY = 'tg_google_pending';
  const LOGIN_SUCCESS_KEY = 'tg_login_success';

  const REST_SIGNUP = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`;
  const REST_LOGIN = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`;
  const REST_RESET = `https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=${API_KEY}`;
  const REST_PROFILE = `https://identitytoolkit.googleapis.com/v1/accounts:update?key=${API_KEY}`;

  const IS_MOBILE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(navigator.userAgent);
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const IS_IN_APP = /FBAN|FBAV|Instagram|Line|WhatsApp|Twitter/i.test(navigator.userAgent);

  console.log('[device]', { IS_MOBILE, IS_IOS, IS_IN_APP });

  const _mem = new Map();
  function safeGet(k) {
    try { const v = localStorage.getItem(k); if (v) return v; } catch(e) {}
    try { const v = sessionStorage.getItem(k); if (v) return v; } catch(e) {}
    return _mem.get(k) ?? null;
  }
  function safeSet(k, v) {
    try { localStorage.setItem(k, v); } catch(e) {}
    try { sessionStorage.setItem(k, v); } catch(e) {}
    _mem.set(k, v);
  }
  function safeRemove(k) {
    try { localStorage.removeItem(k); } catch(e) {}
    try { sessionStorage.removeItem(k); } catch(e) {}
    _mem.delete(k);
  }

  function setPendingGoogle() { safeSet(GOOGLE_PENDING_KEY, String(Date.now())); }
  function clearPendingGoogle() { safeRemove(GOOGLE_PENDING_KEY); }
  function isPendingGoogle() {
    try {
      const v = safeGet(GOOGLE_PENDING_KEY);
      if (!v) return false;
      const ts = Number(v);
      if (!ts || isNaN(ts) || Date.now() - ts > 5 * 60 * 1000) { clearPendingGoogle(); return false; }
      return true;
    } catch(e) { return false; }
  }

  function markLoginSuccess(name) {
    safeSet(LOGIN_SUCCESS_KEY, JSON.stringify({ name: name || 'User', ts: Date.now() }));
  }

  function mapRestError(msg) {
    msg = String(msg || '').toUpperCase();
    if (msg.includes('EMAIL_EXISTS')) return 'auth/email-already-in-use';
    if (msg.includes('EMAIL_NOT_FOUND')) return 'auth/user-not-found';
    if (msg.includes('INVALID_PASSWORD')) return 'auth/wrong-password';
    if (msg.includes('INVALID_LOGIN_CREDENTIALS')) return 'auth/wrong-password';
    if (msg.includes('INVALID_EMAIL')) return 'auth/invalid-email';
    if (msg.includes('USER_DISABLED')) return 'auth/user-disabled';
    if (msg.includes('TOO_MANY_ATTEMPTS')) return 'auth/too-many-requests';
    if (msg.includes('WEAK_PASSWORD')) return 'auth/weak-password';
    if (msg.includes('OPERATION_NOT_ALLOWED')) return 'auth/operation-not-allowed';
    return 'auth/unknown';
  }

  async function restCall(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && data.error.message) || 'UNKNOWN';
      throw { code: mapRestError(msg), message: msg };
    }
    return data;
  }

  async function saveUserDocREST(idToken, uid, email, name, photoURL) {
    if (!idToken || !uid) return;
    try {
      const docUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/users/${uid}`;
      const now = new Date().toISOString();
      const fields = {
        uid: { stringValue: String(uid) },
        email: { stringValue: String(email || '') },
        name: { stringValue: String(name || (email || '').split('@')[0] || 'User') },
        role: { stringValue: 'customer' },
        lastLogin: { timestampValue: now }
      };
      if (photoURL) fields.photoURL = { stringValue: String(photoURL) };
      const checkRes = await fetch(docUrl + '?mask.fieldPaths=uid', {
        headers: { 'Authorization': 'Bearer ' + idToken }
      });
      if (checkRes.ok) {
        const params = '?updateMask.fieldPaths=name&updateMask.fieldPaths=lastLogin' + (photoURL ? '&updateMask.fieldPaths=photoURL' : '');
        await fetch(docUrl + params, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
          body: JSON.stringify({ fields })
        });
      } else {
        fields.createdAt = { timestampValue: now };
        await fetch(docUrl, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
          body: JSON.stringify({ fields })
        });
      }
    } catch(e) {}
  }

  async function saveUserDocSDK(user, name, photoURL) {
    try {
      const ref = db.collection('users').doc(user.uid);
      const snap = await ref.get();
      const data = {
        uid: user.uid,
        email: user.email || '',
        name: name || user.displayName || (user.email || '').split('@')[0] || 'User',
        role: 'customer',
        lastLogin: FV.serverTimestamp()
      };
      if (photoURL || user.photoURL) data.photoURL = photoURL || user.photoURL;
      if (!snap.exists) {
        data.createdAt = FV.serverTimestamp();
        await ref.set(data);
      } else {
        await ref.update(data);
      }
    } catch(e) {}
  }

        if (cred.user && name) { try { await cred.user.updateProfile({ displayName: name }); } catch(e) {} }
      } else {
        cred = await auth.signInWithEmailAndPassword(email, password);
      }
      if (cred && cred.user) {
        let idToken = '';
        try { idToken = await cred.user.getIdToken(); } catch(e) {}
        await handleSuccess({
          uid: cred.user.uid,
          email: email,
          name: name || cred.user.displayName || email.split('@')[0],
          photoURL: cred.user.photoURL || '',

      await new Promise(r => setTimeout(r, 400));

        return;
      }

        setGoogleLoading(false);
        showModal({ type: 'error', title: 'Account Disabled', desc: 'Ye Google account block hai.', primaryText: 'OK' });
        return;
      }

      setGoogleLoading(false);

  /* REDIRECT RETURN HANDLER — awaits persistence (necessary for page reload) */
  (async function handleRedirectReturn() {
    const persistMode = await persistencePromise;
    console.log('[redirect-return] persistence mode:', persistMode);

    if (!isPendingGoogle()) {
      console.log('[redirect-return] not pending — skipping');
      return;
    }

    console.log('[redirect-return] pending — checking');

    let resolvedUser = null;

    try {
      const result = await auth.getRedirectResult();
      if (result && result.user) {
        console.log('[redirect-return] ✓ redirect result has user');
        resolvedUser = result.user;
      }
    } catch (err) {
      console.warn('[redirect-return] error:', err && err.code);
    }

    if (!resolvedUser && auth.currentUser) {
      resolvedUser = auth.currentUser;
    }

    if (!resolvedUser) {
      console.log('[redirect-return] polling (10s max)…');
      const start = Date.now();
      while (Date.now() - start < 10000) {
        if (!isPendingGoogle()) break;
        if (auth.currentUser) { resolvedUser = auth.currentUser; break; }
        await new Promise(r => setTimeout(r, 250));
      }
    }

    if (resolvedUser) return handleGoogleUser(resolvedUser);

    console.log('[redirect-return] ✗ no user');
    clearPendingGoogle();
    hideAuthLoading();
    setGoogleLoading(false);
    showModal({
      type: 'warn',
      title: 'Login Incomplete',
      desc: 'Google account verify ho gaya lekin session nahi aaya.<br><br><b>Try Again</b> dabayein.<br><br><small style="color:#999;">Tip: Browser me third-party cookies allow karein.</small>',
      primaryText: 'Try Again',

    });
  })();

  let _authCheckFirst = true;
  (async () => {
    await persistencePromise;
    auth.onAuthStateChanged(async (user) => {
      console.log('[auth-state]', user ? user.email : 'null');

      if (_redirected) return;

      if (user) {
        _authCheckFirst = false;
        clearPendingGoogle();
        if (isPendingGoogle()) showAuthLoading('Welcome back!', true);
        let idToken = '';
        try { idToken = await user.getIdToken(); } catch(e) {}
        await handleSuccess({
          uid: user.uid,
          email: user.email || '',
          name: user.displayName || (user.email || '').split('@')[0] || 'User',
          photoURL: user.photoURL || '',
          idToken: idToken
        });
        return;
      }

      if (_authCheckFirst) {
        _authCheckFirst = false;
        if (isPendingGoogle()) return;
        safeRemove(AUTH_CACHE_KEY);
        safeRemove(SESSION_KEY);
      }
    });
  })();

  /* FAILSAFE */
  setTimeout(() => {
    if (isPendingGoogle() && (!auth || !auth.currentUser) && !_redirected) {
      console.log('[failsafe] restoring form');
      clearPendingGoogle();
      hideAuthLoading();
      setGoogleLoading(false);
    }
  }, 15000);

  /* FORGOT PASSWORD */
  async function doForgotPassword() {
    const email = (emailInput.value || '').trim();
    if (!email) { showModal({ type: 'info', title: 'Email Required', desc: 'Password reset ke liye email daalo.', primaryText: 'OK', onPrimary: () => emailInput.focus() }); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showModal({ type: 'warn', title: 'Invalid Email', desc: 'Valid email daalo.', primaryText: 'OK', onPrimary: () => { emailInput.focus(); emailInput.select(); } }); return; }
    try {
      await persistencePromise;
      try { await auth.sendPasswordResetEmail(email); }
      catch(sdkErr) { await restReset(email); }
      showModal({ type: 'success', title: 'Reset Link Sent', desc: 'Reset link bhej diya:<br><br><b>' + email + '</b>', primaryText: 'OK' });
    } catch (err) {
      const code = err && err.code;
      if (code === 'auth/user-not-found') {
        showModal({ type: 'warn', title: 'Account Not Found', desc: 'Is email se koi account nahi mila.', primaryText: 'Create Account', secondaryText: 'Cancel', onPrimary: () => setMode('signup') });
      } else {
        showError(err);
      }
    }
  }
  forgotLink.addEventListener('click', (e) => { e.preventDefault(); doForgotPassword(); });

  /* THEME */
  setTimeout(async () => {
    try {
      await persistencePromise;
      db.collection('siteSettings').doc('theme').get()
        .then(snap => {
          if (snap.exists) {
            const p = snap.data().themeColor || '#2874f0';
            const left = document.getElementById('tg-left');
            if (left) left.style.background = 'linear-gradient(135deg, ' + p + ' 0%, ' + p + ' 100%)';
            document.documentElement.style.setProperty('--tg-primary', p);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', p);
          }
        }).catch(() => {});
    } catch(e) {}
  }, 500);

})();
</script>
</body>
</html>
