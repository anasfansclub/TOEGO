<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEGO Admin — Push Notifications</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#2963eb;--primary-dark:#1a4fc7;--bg:#f1f3f6;--card:#fff;--text:#212121;--muted:#878787;--border:#e0e0e0;--success:#388e3c;--error:#d32f2f;--warn:#f57c00;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Roboto',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.adm-header{background:var(--primary);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
.adm-header h1{margin:0;font-size:20px;font-weight:900;font-style:italic;}
.adm-header h1 span{color:#ffe500;}
.adm-header .badge{background:rgba(255,255,255,0.2);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;}
.adm-wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:900px){.adm-wrap{grid-template-columns:1fr;}}
.adm-card{background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);padding:22px;margin-bottom:20px;}
.adm-card h2{margin:0 0 16px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;}
.adm-field{margin-bottom:14px;}
.adm-field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.adm-field input,.adm-field textarea,.adm-field select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:11px 13px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;}
.adm-field input:focus,.adm-field textarea:focus,.adm-field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(41,99,235,0.1);}
.adm-field textarea{min-height:80px;resize:vertical;}
.adm-btn{padding:13px 22px;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;white-space:nowrap;}
.adm-btn.primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(41,99,235,0.3);}
.adm-btn.primary:hover{filter:brightness(1.08);}
.adm-btn.primary:disabled{opacity:0.6;cursor:not-allowed;}
.adm-btn.block{width:100%;}
.adm-status{padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-top:12px;display:none;}
.adm-status.show{display:block;}
.adm-status.success{background:#e6f7ec;color:#1b8a3a;}
.adm-status.error{background:#ffebee;color:#c62828;}
.adm-status.info{background:#e3f2fd;color:#1565c0;}
.adm-templates{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:400px;overflow-y:auto;padding-right:4px;}
@media(max-width:520px){.adm-templates{grid-template-columns:1fr;}}
.adm-tpl{border:1.5px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;transition:all .15s;background:#fafbfc;}
.adm-tpl:hover{border-color:var(--primary);background:#f0f5ff;}
.adm-tpl.active{border-color:var(--primary);background:#f0f5ff;box-shadow:0 0 0 3px rgba(41,99,235,0.12);}
.adm-tpl-title{font-size:13px;font-weight:800;margin-bottom:3px;}
.adm-tpl-body{font-size:11.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.adm-preview{background:linear-gradient(135deg,#2874f0,#0f1729);border-radius:12px;padding:24px;color:#fff;margin-bottom:16px;min-height:140px;display:flex;flex-direction:column;justify-content:center;}
.adm-preview-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:0.7;margin-bottom:8px;font-weight:700;}
.adm-preview-title{font-size:17px;font-weight:800;margin-bottom:4px;}
.adm-preview-body{font-size:13px;opacity:0.9;line-height:1.45;}
.adm-preview-img{margin-top:10px;border-radius:8px;overflow:hidden;max-height:120px;}
.adm-preview-img img{width:100%;height:100%;object-fit:cover;}
.adm-log{background:#0f1729;color:#a5d6ff;border-radius:8px;padding:14px;font-family:monospace;font-size:12px;max-height:180px;overflow-y:auto;line-height:1.6;}
.adm-log .ok{color:#4ade80;}
.adm-log .err{color:#f87171;}
.adm-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.adm-tab{padding:8px 16px;border-radius:999px;background:var(--bg);border:none;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);}
.adm-tab.active{background:var(--primary);color:#fff;}
.adm-hidden{display:none!important;}
.adm-loading{position:fixed;inset:0;background:#fff;z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;}
.adm-loading.hidden{display:none;}
.adm-loading-spinner{width:48px;height:48px;border:4px solid #e0e0e0;border-top-color:var(--primary);border-radius:50%;animation:admSpin .8s linear infinite;}
@keyframes admSpin{to{transform:rotate(360deg);}}
.adm-loading-text{font-size:15px;color:#666;font-weight:600;text-align:center;padding:0 20px;}
.adm-header .logout-btn{background:rgba(255,255,255,0.15);color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;display:none;}
.adm-header .logout-btn.show{display:inline-block;}
.adm-header .logout-btn:hover{background:rgba(255,255,255,0.25);}
.adm-header-actions{display:flex;align-items:center;gap:10px;}
.img-upload-wrap { display: flex; gap: 10px; align-items: center; }
.img-upload-wrap input[type="url"] { flex: 1; }
.img-upload-btn { background: #f1f3f6; border: 1.5px solid var(--border); padding: 11px 15px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap;}
.img-upload-btn:hover { background: #e4e7ec; }
</style>
</head>
<body>

<div class="adm-loading" id="adm-loading">
  <div class="adm-loading-spinner"></div>
  <div class="adm-loading-text">Checking admin session…</div>
</div>

<header class="adm-header">
  <h1>TOE<span>GO</span> Admin</h1>
  <div class="adm-header-actions">
    <div class="badge" id="adm-auth-badge">Not logged in</div>
    <button class="logout-btn" id="adm-logout-btn" onclick="admLogout()">Logout</button>
  </div>
</header>

<div class="adm-wrap">
  <div>
    <div class="adm-card" id="adm-login-card">
      <h2>🔐 Admin Login</h2>
      <div class="adm-field">
        <label>Email</label>
        <input type="email" id="adm-email" value="anasfansclub@gmail.com" placeholder="anasfansclub@gmail.com">
      </div>
      <div class="adm-field">
        <label>Password</label>
        <input type="password" id="adm-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')admLogin()">
      </div>
      <button class="adm-btn primary block" id="adm-login-btn" onclick="admLogin()">Login</button>
      <div class="adm-status" id="adm-login-status"></div>
    </div>

    <div class="adm-card adm-hidden" id="adm-compose-card">
      <h2>📢 Send Notification</h2>

      <div class="adm-preview">
        <div class="adm-preview-label">🔔 Live Preview</div>
        <div class="adm-preview-title" id="adm-preview-title">Notification Title</div>
        <div class="adm-preview-body" id="adm-preview-body">Notification body text will appear here…</div>
        <div class="adm-preview-img adm-hidden" id="adm-preview-img-wrap"><img id="adm-preview-img" src="" alt=""></div>
      </div>

      <div class="adm-field">
        <label>Title *</label>
        <input type="text" id="adm-title" placeholder="🔥 50% OFF Sale!" maxlength="100" oninput="admUpdatePreview()">
      </div>
      <div class="adm-field">
        <label>Body *</label>
        <textarea id="adm-body" placeholder="Aaj hi shop karo, limited time deal!" maxlength="300" oninput="admUpdatePreview()"></textarea>
      </div>
      
      <div class="adm-field">
        <label>Image (Auto 30KB Cloudinary)</label>
        <div class="img-upload-wrap">
          <input type="url" id="adm-image" placeholder="Image URL ya upload karein..." oninput="admUpdatePreview()">
          <button class="img-upload-btn" onclick="document.getElementById('adm-image-file').click()">
            📤 Upload
          </button>
          <input type="file" id="adm-image-file" accept="image/*" style="display:none" onchange="admHandleImageUpload(event)">
        </div>
        <div id="adm-img-status" style="font-size:12px; margin-top:6px; font-weight:600; color:var(--warn); display:none;"></div>
      </div>

      <div class="adm-field">
        <label>Click URL (optional)</label>
        <input type="text" id="adm-url" placeholder="/shop-home.html">
      </div>
      <div class="adm-field">
        <label>Send to</label>
        <select id="adm-target">
          <option value="all">Saare users (multicast tokens)</option>
          <option value="topic:all-users">Topic: all-users</option>
        </select>
      </div>

      <button class="adm-btn primary block" id="adm-send-btn" onclick="admSend()">🚀 Send Notification</button>
      <div class="adm-status" id="adm-send-status"></div>
    </div>
  </div>

  <div>
    <div class="adm-card adm-hidden" id="adm-templates-card">
      <h2>📋 Unique Templates</h2>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px;">Template par click karo — form auto-fill ho jayega</div>
      <div class="adm-tabs" id="adm-tpl-tabs">
        <button class="adm-tab active" data-cat="all" onclick="admFilterTpl('all',this)">All</button>
        <button class="adm-tab" data-cat="fomo" onclick="admFilterTpl('fomo',this)">🔥 FOMO</button>
        <button class="adm-tab" data-cat="cart" onclick="admFilterTpl('cart',this)">🛒 Cart</button>
        <button class="adm-tab" data-cat="festival" onclick="admFilterTpl('festival',this)">🎉 Festival</button>
      </div>
      <div class="adm-templates" id="adm-templates-list"></div>
    </div>

    <div class="adm-card adm-hidden" id="adm-log-card">
      <h2>📜 Send Log</h2>
      <div class="adm-log" id="adm-log"><div style="opacity:0.5;">Abhi tak koi notification nahi bheja…</div></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
(function(){
  'use strict';

  const CLOUDFLARE_WORKER_URL = 'https://toego-notification-worker.divinebatteriess.workers.dev/';
  const ADMIN_EMAILS = ['anasfansclub@gmail.com'];
  const LOGO_URL = 'https://res.cloudinary.com/kshufv2s/image/upload/v1792601941/511898-50kb_rriscx.jpg'; // ✅ AAPKA NAYA LOGO
  
  let CLOUDINARY_CLOUD_NAME = "YOUR_CLOUD_NAME"; 
  let CLOUDINARY_UPLOAD_PRESET = "YOUR_UPLOAD_PRESET"; 

  if (!window.__TOEGO_FB__) {
    window.__TOEGO_FB__ = firebase.initializeApp({
      apiKey: "AIzaSyAhxecFY9TwZTYbdCVRAcnp1whI-Uqc-P8",
      authDomain: "toego-ecommerce.firebaseapp.com",
      projectId: "toego-ecommerce",
      storageBucket: "toego-ecommerce.firebasestorage.app",
      messagingSenderId: "234167880880",
      appId: "1:234167880880:web:b89d4b8e5f8cc9af3c3f75"
    });
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});

  db.collection('siteSettings').doc('cloudinary').get().then(snap => {
    if (snap.exists) {
      const d = snap.data();
      if (d.cloudName) CLOUDINARY_CLOUD_NAME = d.cloudName;
      if (d.uploadPreset) CLOUDINARY_UPLOAD_PRESET = d.uploadPreset;
    }
  }).catch(()=>{});

  // ✅ Naye aur Unique Templates (High Conversions)
  const TEMPLATES = [
    { cat:'fomo', title:'🔥 Bhai, 10 Minute me Sale khatam!', body:'Aapke liye special deal 10 minute me end ho rahi hai. Abhi check karo!', url:'/products.html' },
    { cat:'fomo', title:'😱 Sirf 3 Piece Bache Hain!', body:'Aapka pasandida product jald hi out of stock ho jayega. Jaldi karo!', url:'/products.html' },
    { cat:'fomo', title:'🚨 80% Off Sirf Aaj Ke Liye', body:'Mega Sale ka aakhri din! 80% tak ka discount miss mat karo.', url:'/products.html' },
    { cat:'cart', title:'🛒 Bhai, Cart bhool gaye kya?', body:'Aapke cart me items wait kar rahe hain. Checkout karke order complete karo.', url:'/cart.html' },
    { cat:'cart', title:'💸 Aapke Cart ka Price Drop hua hai!', body:'Great news! Jo items aapke cart me hain, unka price kam ho gaya hai.', url:'/cart.html' },
    { cat:'cart', title:'🎁 Cart me surprise gift!', body:'Aapka order free delivery ke liye eligible hai. Abhi order karo.', url:'/cart.html' },
    { cat:'general', title:'👋 Aapko miss kar rahe hain!', body:'TOEGO par naye products aaye hain. Dekhne ke liye wapas aao.', url:'/shop-home.html' },
    { cat:'general', title:'🎉 Welcome Gift Unlocked!', body:'Aapke liye ek special welcome discount unlock hua hai. Abhi use karo.', url:'/shop-home.html' },
    { cat:'festival', title:'🪔 Diwali Dhamaka Live!', body:'Diwali special offers live hain. Lighting deal uthao aur saste me kharido.', url:'/products.html' },
    { cat:'festival', title:'🎊 Naye Saal ka Tohfa', body:'Naye saal par aapke liye bumper discount. Abhi shop karo!', url:'/products.html' }
  ];

  let TPL_FILTER = 'all';

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function showStatus(id, msg, type){ const el = $(id); if(!el) return; el.className = 'adm-status show ' + type; el.textContent = msg; }
  function hideLoading(){ const el = $('adm-loading'); if (el) el.classList.add('hidden'); }
  function showLoading(text){ const el = $('adm-loading'); if (el) { el.classList.remove('hidden'); const t = el.querySelector('.adm-loading-text'); if (t && text) t.textContent = text; } }

  function isWhitelistedAdmin(email) {
    if (!email) return false;
    return ADMIN_EMAILS.some(a => a.toLowerCase() === email.toLowerCase().trim());
  }

  function showAdminPanel(user) {
    $('adm-auth-badge').textContent = '✓ Admin — ' + (user.email || user.uid);
    $('adm-login-card').classList.add('adm-hidden');
    $('adm-compose-card').classList.remove('adm-hidden');
    $('adm-templates-card').classList.remove('adm-hidden');
    $('adm-log-card').classList.remove('adm-hidden');
    $('adm-logout-btn').classList.add('show');
    renderTemplates();
    hideLoading();
  }

  function showLoginForm(reason) {
    $('adm-auth-badge').textContent = reason || 'Not logged in';
    $('adm-login-card').classList.remove('adm-hidden');
    $('adm-compose-card').classList.add('adm-hidden');
    $('adm-templates-card').classList.add('adm-hidden');
    $('adm-log-card').classList.add('adm-hidden');
    $('adm-logout-btn').classList.remove('show');
    hideLoading();
  }

  auth.onAuthStateChanged(async (user) => {
    if (!user) { showLoginForm('Not logged in'); return; }
    if (isWhitelistedAdmin(user.email)) {
      showAdminPanel(user);
    } else {
      showLoginForm('Not an admin');
      showStatus('adm-login-status', 'Yeh account admin nahi hai.', 'error');
    }
  });

  window.admLogin = function() {
    const email = ($('adm-email').value || '').trim();
    const pass = $('adm-password').value;
    if (!email || !pass) { showStatus('adm-login-status', 'Email aur password daalo', 'error'); return; }
    $('adm-login-btn').disabled = true;
    $('adm-login-btn').textContent = 'Logging in…';
    auth.signInWithEmailAndPassword(email, pass)
      .then(() => { $('adm-password').value = ''; $('adm-login-btn').disabled = false; $('adm-login-btn').textContent = 'Login'; })
      .catch(err => { showStatus('adm-login-status', 'Login failed: ' + (err.message || err.code), 'error'); $('adm-login-btn').disabled = false; $('adm-login-btn').textContent = 'Login'; });
  };

  window.admLogout = function() {
    if (!confirm('Logout karna hai?')) return;
    showLoading('Logging out…');
    auth.signOut().then(() => { hideLoading(); $('adm-email').value = ''; $('adm-password').value = ''; $('adm-login-status').classList.remove('show'); }).catch(e => { hideLoading(); alert(e.message); });
  };

  function renderTemplates(){
    const list = $('adm-templates-list'); if (!list) return;
    const filtered = TPL_FILTER === 'all' ? TEMPLATES : TEMPLATES.filter(t => t.cat === TPL_FILTER);
    list.innerHTML = filtered.map((t) => {
      const idx = TEMPLATES.indexOf(t);
      return '<div class="adm-tpl" data-idx="' + idx + '" onclick="admPickTpl(' + idx + ')"><div class="adm-tpl-title">' + esc(t.title) + '</div><div class="adm-tpl-body">' + esc(t.body) + '</div></div>';
    }).join('');
  }

  window.admFilterTpl = function(cat, btn){
    TPL_FILTER = cat;
    document.querySelectorAll('#adm-tpl-tabs .adm-tab').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderTemplates();
  };

  window.admPickTpl = function(idx){
    const t = TEMPLATES[idx]; if (!t) return;
    $('adm-title').value = t.title || '';
    $('adm-body').value = t.body || '';
    $('adm-url').value = t.url || '';
    $('adm-image').value = '';
    document.querySelectorAll('.adm-tpl').forEach(el => el.classList.remove('active'));
    const el = document.querySelector('.adm-tpl[data-idx="' + idx + '"]');
    if (el) el.classList.add('active');
    admUpdatePreview();
  };

  window.admUpdatePreview = function(){
    $('adm-preview-title').textContent = ($('adm-title').value || 'Notification Title');
    $('adm-preview-body').textContent = ($('adm-body').value || 'Notification body text will appear here…');
    const img = ($('adm-image').value || '').trim();
    const wrap = $('adm-preview-img-wrap');
    const imgEl = $('adm-preview-img');
    if (img && /^https?:\/\//.test(img)) { imgEl.src = img; wrap.classList.remove('adm-hidden'); }
    else { wrap.classList.add('adm-hidden'); imgEl.src = ''; }
  };

  function dataURItoBlob(dataURI) {
    const byteString = atob(dataURI.split(',')[1]);
    const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
    const ab = new ArrayBuffer(byteString.length);
    const ia = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
    return new Blob([ab], { type: mimeString });
  }

  function compressImageTo30KB(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const max_size = 800;
          if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
          else { if (height > max_size) { width *= max_size / height; height = max_size; } }
          
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          let quality = 0.9;
          let dataUrl = canvas.toDataURL('image/jpeg', quality);
          while (dataUrl.length * 0.75 > 30 * 1024 && quality > 0.1) {
            quality -= 0.1;
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(dataUrl);
        };
        img.onerror = (error) => reject(error);
      };
      reader.onerror = (error) => reject(error);
    });
  }

  window.admHandleImageUpload = async function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusEl = $('adm-img-status');
    statusEl.style.display = 'block';
    statusEl.style.color = 'var(--warn)';
    statusEl.textContent = '⏳ Compressing image to <30KB...';

    try {
      const compressedDataUrl = await compressImageTo30KB(file);
      const blob = dataURItoBlob(compressedDataUrl);
      const sizeKB = (blob.size / 1024).toFixed(1);
      
      statusEl.textContent = `⏳ Compressed to ${sizeKB}KB. Uploading to Cloudinary...`;

      if (!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET || CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME') {
        throw new Error('Cloudinary config missing! Please set keys in code.');
      }

      const formData = new FormData();
      formData.append('file', blob);
      formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      formData.append('folder', 'toego/notifications');

      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
      });

      const data = await res.json();
      if (data.secure_url) {
        $('adm-image').value = data.secure_url;
        admUpdatePreview();
        statusEl.style.color = 'var(--success)';
        statusEl.textContent = `✅ Image Uploaded (${sizeKB}KB)`;
        setTimeout(() => statusEl.style.display = 'none', 3000);
      } else {
        throw new Error(data.error?.message || 'Upload failed');
      }
    } catch (err) {
      statusEl.style.color = 'var(--error)';
      statusEl.textContent = '❌ ' + err.message;
    }
    event.target.value = '';
  };

  window.admSend = async function(){
    const user = auth.currentUser;
    if (!user) { showStatus('adm-send-status', 'Login required', 'error'); return; }

    const title = ($('adm-title').value || '').trim();
    const body = ($('adm-body').value || '').trim();
    const image = ($('adm-image').value || '').trim();
    const url = ($('adm-url').value || '').trim();
    const target = $('adm-target').value;

    if (!title && !body) { showStatus('adm-send-status', 'Title ya body daalo', 'error'); return; }

    $('adm-send-btn').disabled = true;
    $('adm-send-btn').textContent = 'Sending…';
    showStatus('adm-send-status', 'Notification bhej raha hoon…', 'info');

    // ✅ Yahan aapka naya LOGO set kiya gaya hai
    const fcmMessage = {
      notification: { title: title, body: body },
      data: {
        title: title, body: body, image: image || '', url: url || '/shop-home.html'
      },
      webpush: {
        fcmOptions: { link: url || 'https://toego.in/shop-home.html' },
        notification: {
          title: title,
          body: body,
          icon: LOGO_URL, // Naya logo
          badge: LOGO_URL,
          image: image || undefined
        }
      }
    };

    if (target.startsWith('topic:')) {
      fcmMessage.topic = target.split(':')[1];
    } else {
      try {
        const tokensSnap = await db.collection('fcm_tokens').get();
        const tokens = tokensSnap.docs.map(d => d.data().token).filter(Boolean);
        if (!tokens.length) throw new Error('No FCM tokens found. Visit shop-home and allow notifications.');
        fcmMessage.tokens = tokens;
      } catch(e) {
        showStatus('adm-send-status', e.message, 'error');
        $('adm-send-btn').disabled = false; $('adm-send-btn').textContent = '🚀 Send Notification';
        return;
      }
    }

    try {
      const res = await fetch(CLOUDFLARE_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: fcmMessage })
      });
      const data = await res.json();
      
      if (res.ok && data.success) {
        let msg = '✓ Sent! Success: ' + (data.successCount || 0) + ', Failed: ' + (data.failureCount || 0);
        showStatus('adm-send-status', msg, 'success');
        admLog(msg, 'ok');
      } else {
        throw new Error(data.error || 'Failed to send');
      }
    } catch (err) {
      showStatus('adm-send-status', '✕ Error: ' + err.message, 'error');
      admLog('ERROR: ' + err.message, 'err');
    } finally {
      $('adm-send-btn').disabled = false; $('adm-send-btn').textContent = '🚀 Send Notification';
    }
  };

  function admLog(msg, cls){
    const el = $('adm-log'); if (!el) return;
    const time = new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const line = '<div><span style="opacity:0.5;">[' + time + ']</span> <span class="' + (cls||'') + '">' + esc(msg) + '</span></div>';
    el.innerHTML = line + el.innerHTML;
  }

  setTimeout(() => {
    if (!$('adm-loading').classList.contains('hidden')) { hideLoading(); if (!auth.currentUser) showLoginForm('Not logged in'); }
  }, 8000);

})();
</script>
</body>
</html>
