<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Addresses — TOEGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#2874f0" id="tg-theme-meta">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin:0!important; padding:0!important; width:100%!important; max-width:100vw; overflow-x:hidden; background:#f1f3f6; font-family:'Roboto',Arial,sans-serif; color:#212121; -webkit-font-smoothing:antialiased; }
img { max-width:100%; display:block; }
button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, select, textarea { font:inherit; }
a { color:inherit; text-decoration:none; }
header#top, #top_menu, nav.o_main_navbar, .o_main_navbar, footer#bottom, .o_footer, #footer, .o_breadcrumb, .breadcrumb, .o_website_edit_toolbar, .o_notification_manager, .o_editor_banner, .o_loading_indicator { display:none!important; visibility:hidden!important; }

/* ---------- HEADER ---------- */
.tg-hd { background:#2874f0; position:fixed; top:0; left:0; right:0; z-index:1000; box-shadow:0 1px 4px rgba(0,0,0,.15); width:100%; }
.tg-hd-inner { display:flex; align-items:center; gap:10px; padding:10px 14px; height:58px; }
.tg-hd-back { width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:#fff; border-radius:50%; flex-shrink:0; transition:background .15s; }
.tg-hd-back:hover { background:rgba(255,255,255,.12); }
.tg-hd-back svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.tg-hd-title { flex:1; color:#fff; font-size:17px; font-weight:700; letter-spacing:-.2px; display:flex; align-items:center; gap:8px; }
.tg-hd-count { font-size:12.5px; font-weight:500; opacity:.85; }
.tg-hd-actions { display:flex; gap:2px; flex-shrink:0; }
.tg-hd-btn { width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:#fff; border-radius:50%; position:relative; transition:background .15s; }
.tg-hd-btn:hover { background:rgba(255,255,255,.12); }
.tg-hd-btn svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- LAYOUT ---------- */
.tg-wrap { padding-top:58px; padding-bottom:100px; min-height:100vh; }
.tg-container { max-width:640px; margin:0 auto; padding:12px; }

/* ---------- ADD BUTTON ---------- */
.tg-add-btn { width:100%; padding:16px; background:linear-gradient(135deg,#2874f0,#1a5dc7); color:#fff; font-size:14.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; border-radius:12px; box-shadow:0 6px 18px rgba(40,116,240,.28); display:flex; align-items:center; justify-content:center; gap:10px; transition:all .15s; margin-bottom:14px; }
.tg-add-btn:hover { filter:brightness(1.05); transform:translateY(-1px); }
.tg-add-btn svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- ADDRESS CARDS ---------- */
.tg-addr-list { display:flex; flex-direction:column; gap:12px; }
.tg-addr-card { background:#fff; border-radius:12px; padding:16px 18px; box-shadow:0 1px 4px rgba(0,0,0,.05); border:1.5px solid transparent; position:relative; transition:border-color .15s, box-shadow .15s; }
.tg-addr-card:hover { box-shadow:0 4px 14px rgba(0,0,0,.08); }
.tg-addr-card.default { border-color:#2874f0; background:linear-gradient(135deg,#f8fbff,#f0f5ff); }
.tg-addr-card.default::before { content:''; position:absolute; left:0; top:12px; bottom:12px; width:4px; background:#2874f0; border-radius:0 4px 4px 0; }

.tg-addr-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.tg-addr-avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#eef3ff,#e0eaff); color:#2874f0; font-weight:900; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tg-addr-name-wrap { flex:1; min-width:0; }
.tg-addr-name { font-size:15px; font-weight:800; color:#212121; display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:2px; }
.tg-addr-phone { font-size:12.5px; color:#666; font-weight:500; }
.tg-addr-badge { font-size:9.5px; font-weight:800; padding:3px 8px; border-radius:4px; text-transform:uppercase; letter-spacing:.5px; }
.tg-addr-badge.home { background:#e0eaff; color:#2874f0; }
.tg-addr-badge.work { background:#fff3e0; color:#fb641b; }
.tg-addr-badge.other { background:#f3eefb; color:#7e57c2; }
.tg-addr-badge.default-pill { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; box-shadow:0 2px 6px rgba(34,197,94,.35); }

.tg-addr-body { font-size:13px; color:#444; line-height:1.55; margin-bottom:12px; padding-left:50px; }
.tg-addr-body b { color:#212121; font-weight:600; }

.tg-addr-actions { display:flex; gap:8px; flex-wrap:wrap; padding-left:50px; }
.tg-addr-btn { padding:8px 14px; border-radius:8px; font-size:12px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; display:inline-flex; align-items:center; gap:5px; transition:all .15s; cursor:pointer; }
.tg-addr-btn svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.tg-addr-btn.edit { background:#fff; color:#2874f0; border:1.5px solid #2874f0; }
.tg-addr-btn.edit:hover { background:#f0f5ff; }
.tg-addr-btn.default-b { background:#fff; color:#1b8a3a; border:1.5px solid #a5d6b7; }
.tg-addr-btn.default-b:hover { background:#f0fff4; }
.tg-addr-btn.delete { background:#fff; color:#d32f2f; border:1.5px solid #ffcdd2; }
.tg-addr-btn.delete:hover { background:#ffebee; }

/* ---------- EMPTY ---------- */
.tg-empty { background:#fff; border-radius:14px; padding:48px 24px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.tg-empty-img { width:140px; height:140px; margin:0 auto 20px; background:linear-gradient(135deg,#eef3ff,#e0eaff); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:64px; box-shadow:0 12px 40px rgba(40,116,240,.15); }
.tg-empty-title { font-size:19px; font-weight:800; color:#212121; margin:0 0 8px; }
.tg-empty-desc { font-size:13.5px; color:#666; line-height:1.55; margin:0 0 22px; max-width:380px; margin-left:auto; margin-right:auto; }

/* ---------- SKELETON ---------- */
.tg-skel-card { background:#fff; border-radius:12px; padding:16px 18px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.tg-skel { background:linear-gradient(90deg,#f0f0f0 0%,#e8e8e8 50%,#f0f0f0 100%); background-size:200% 100%; animation:tgShim 1.2s infinite; border-radius:6px; }
@keyframes tgShim { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }

/* ---------- MODAL ---------- */
.tg-modal { position:fixed; inset:0; background:rgba(15,23,41,.6); backdrop-filter:blur(4px); z-index:99999; display:none; align-items:flex-end; justify-content:center; animation:tgFadeIn .18s ease; }
.tg-modal.show { display:flex; }
@keyframes tgFadeIn { from { opacity:0; } to { opacity:1; } }
.tg-modal-card { width:100%; max-width:520px; background:#fff; border-radius:18px 18px 0 0; padding:22px 20px 26px; animation:tgSlideUp .28s cubic-bezier(.34,1.2,.64,1); max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
@keyframes tgSlideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
.tg-modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; position:sticky; top:-22px; background:#fff; padding-top:4px; z-index:2; }
.tg-modal-title { font-size:18px; font-weight:800; color:#212121; }
.tg-modal-close { width:32px; height:32px; border-radius:50%; background:#f1f3f6; color:#666; display:flex; align-items:center; justify-content:center; font-size:14px; transition:all .15s; }
.tg-modal-close:hover { background:#e0e0e0; }
.tg-modal-field { margin-bottom:12px; }
.tg-modal-field label { display:block; font-size:11.5px; color:#666; font-weight:700; margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px; }
.tg-modal-field label .rq { color:#d32f2f; }
.tg-modal-field input, .tg-modal-field textarea { width:100%; border:1.5px solid #e0e0e0; border-radius:10px; padding:12px 14px; font-size:14px; color:#212121; outline:none; background:#fff; transition:border-color .15s,box-shadow .15s; font-family:inherit; }
.tg-modal-field input:focus, .tg-modal-field textarea:focus { border-color:#2874f0; box-shadow:0 0 0 3px rgba(40,116,240,.10); }
.tg-modal-field textarea { resize:vertical; min-height:70px; }
.tg-modal-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tg-modal-save { width:100%; padding:14px; border-radius:10px; background:linear-gradient(135deg,#2874f0,#1a5dc7); color:#fff; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; box-shadow:0 6px 18px rgba(40,116,240,.3); margin-top:8px; transition:all .15s; }
.tg-modal-save:disabled { opacity:.7; cursor:not-allowed; }
.tg-modal-save:hover:not(:disabled) { filter:brightness(1.05); }

.tg-addr-types { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.tg-addr-type { padding:10px 6px; border:1.5px solid #e0e0e0; border-radius:10px; background:#fff; font-size:13px; font-weight:700; color:#666; text-align:center; transition:all .15s; display:flex; align-items:center; justify-content:center; gap:5px; cursor:pointer; }
.tg-addr-type:hover { border-color:#2874f0; color:#2874f0; }
.tg-addr-type.active { border-color:#2874f0; background:#f0f5ff; color:#2874f0; box-shadow:0 0 0 3px rgba(40,116,240,.08); }

.tg-addr-default-row { display:flex; align-items:center; gap:10px; padding:12px 14px; background:#f8f9fb; border-radius:10px; margin-bottom:14px; cursor:pointer; user-select:none; }
.tg-addr-default-row input { width:18px; height:18px; accent-color:#2874f0; cursor:pointer; }
.tg-addr-default-row span { font-size:13px; font-weight:600; color:#212121; }

/* ---------- BOTTOM NAV ---------- */
.tg-bnav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e0e0e0; display:flex; z-index:9999; box-shadow:0 -2px 8px rgba(0,0,0,.06); padding-bottom:env(safe-area-inset-bottom,0); }
.tg-bnav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 2px; gap:3px; font-size:10px; color:#666; font-weight:600; position:relative; transition:color .15s; }
.tg-bnav-item.active { color:#2874f0; }
.tg-bnav-item svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.tg-bnav-badge { position:absolute; top:4px; right:calc(50% - 20px); background:#ff6161; color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

/* ---------- TOASTS ---------- */
.tg-toasts { position:fixed; bottom:88px; left:50%; transform:translateX(-50%); z-index:99999; display:flex; flex-direction:column; gap:8px; max-width:calc(100vw - 24px); pointer-events:none; }
.tg-toast { padding:12px 20px; background:#212121; color:#fff; font-size:13px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.3); pointer-events:auto; font-weight:500; animation:tgToastIn .3s; }
@keyframes tgToastIn { from { transform:translateY(20px); opacity:0; } to { transform:none; opacity:1; } }
.tg-toast.success { background:#388e3c; }
.tg-toast.error { background:#d32f2f; }
.tg-toast.info { background:#2874f0; }

/* ---------- RESPONSIVE ---------- */
@media (max-width:480px) {
  .tg-modal-row { grid-template-columns:1fr; gap:0; }
  .tg-addr-body { padding-left:0; }
  .tg-addr-actions { padding-left:0; }
  .tg-addr-name { font-size:14px; }
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="tg-hd">
  <div class="tg-hd-inner">
    <a href="account.html" class="tg-hd-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div class="tg-hd-title">My Addresses <span class="tg-hd-count" id="tg-count"></span></div>
    <div class="tg-hd-actions">
      <a href="shop-home.html" class="tg-hd-btn" aria-label="Shop Home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<div class="tg-wrap">
  <div class="tg-container">

    <!-- Add New Button -->
    <button class="tg-add-btn" onclick="tgOpenNewAddr()">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      Add New Address
    </button>

    <!-- Loading Skeleton -->
    <div id="tg-loading">
      <div class="tg-skel-card">
        <div class="tg-skel" style="width:40px;height:40px;border-radius:50%;margin-bottom:12px;"></div>
        <div class="tg-skel" style="width:70%;height:14px;margin-bottom:8px;"></div>
        <div class="tg-skel" style="width:50%;height:12px;margin-bottom:12px;"></div>
        <div class="tg-skel" style="width:100%;height:12px;margin-bottom:6px;"></div>
        <div class="tg-skel" style="width:60%;height:12px;"></div>
      </div>
    </div>

    <!-- Address List -->
    <div class="tg-addr-list" id="tg-addr-list" style="display:none;"></div>

    <!-- Empty State -->
    <div class="tg-empty" id="tg-empty" style="display:none;">
      <div class="tg-empty-img">📍</div>
      <h2 class="tg-empty-title">No addresses yet</h2>
      <p class="tg-empty-desc">Add your delivery address to make checkout faster and easier.</p>
      <button class="tg-add-btn" onclick="tgOpenNewAddr()" style="max-width:280px;margin:0 auto;">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Add Your First Address
      </button>
    </div>

  </div>
</div>

<!-- ============ ADD / EDIT MODAL ============ -->
<div class="tg-modal" id="tg-addr-modal">
  <div class="tg-modal-card">
    <div class="tg-modal-head">
      <div class="tg-modal-title" id="tg-modal-title">Add New Address</div>
      <button class="tg-modal-close" onclick="tgCloseAddr()">✕</button>
    </div>

    <div class="tg-modal-field">
      <label>Address Type <span class="rq">*</span></label>
      <div class="tg-addr-types" id="tg-addr-types">
        <button type="button" class="tg-addr-type active" data-type="home" onclick="tgPickAddrType('home',this)">🏠 Home</button>
        <button type="button" class="tg-addr-type" data-type="work" onclick="tgPickAddrType('work',this)">🏢 Work</button>
        <button type="button" class="tg-addr-type" data-type="other" onclick="tgPickAddrType('other',this)">📍 Other</button>
      </div>
    </div>

    <div class="tg-modal-field">
      <label>Full Name <span class="rq">*</span></label>
      <input type="text" id="tg-addr-name" placeholder="Enter full name" maxlength="60" autocomplete="name">
    </div>

    <div class="tg-modal-row">
      <div class="tg-modal-field">
        <label>Phone Number <span class="rq">*</span></label>
        <input type="tel" id="tg-addr-phone" placeholder="10-digit mobile" maxlength="10" inputmode="numeric" autocomplete="tel">
      </div>
      <div class="tg-modal-field">
        <label>Alternate Phone</label>
        <input type="tel" id="tg-addr-alt-phone" placeholder="Optional" maxlength="10" inputmode="numeric">
      </div>
    </div>

    <div class="tg-modal-field">
      <label>Address Line (House No., Building, Street) <span class="rq">*</span></label>
      <textarea id="tg-addr-line" placeholder="House no., building, street, area" maxlength="180" autocomplete="street-address"></textarea>
    </div>

    <div class="tg-modal-row">
      <div class="tg-modal-field">
        <label>Locality / Area</label>
        <input type="text" id="tg-addr-locality" placeholder="e.g. Civil Lines" maxlength="60">
      </div>
      <div class="tg-modal-field">
        <label>Landmark</label>
        <input type="text" id="tg-addr-landmark" placeholder="e.g. Near SBI Bank" maxlength="60">
      </div>
    </div>

    <div class="tg-modal-row">
      <div class="tg-modal-field">
        <label>City <span class="rq">*</span></label>
        <input type="text" id="tg-addr-city" placeholder="City" maxlength="40" autocomplete="address-level2">
      </div>
      <div class="tg-modal-field">
        <label>Pincode <span class="rq">*</span></label>
        <input type="text" id="tg-addr-pin" placeholder="6-digit" maxlength="6" inputmode="numeric" autocomplete="postal-code">
      </div>
    </div>

    <div class="tg-modal-row">
      <div class="tg-modal-field">
        <label>District</label>
        <input type="text" id="tg-addr-district" placeholder="District" maxlength="40">
      </div>
      <div class="tg-modal-field">
        <label>State <span class="rq">*</span></label>
        <input type="text" id="tg-addr-state" placeholder="State" maxlength="40" autocomplete="address-level1">
      </div>
    </div>

    <div class="tg-modal-field">
      <label>Email (optional)</label>
      <input type="email" id="tg-addr-email" placeholder="you@example.com" maxlength="80" autocomplete="email">
    </div>

    <label class="tg-addr-default-row">
      <input type="checkbox" id="tg-addr-default">
      <span>Set as default address</span>
    </label>

    <button class="tg-modal-save" id="tg-addr-save" onclick="tgSaveAddr()">
      <span id="tg-addr-save-text">Save Address</span>
    </button>
  </div>
</div>

<!-- ============ BOTTOM NAV ============ -->
<nav class="tg-bnav">
  <a href="shop-home.html" class="tg-bnav-item"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
  <a href="categories.html" class="tg-bnav-item"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Categories</span></a>
  <a href="cart.html" class="tg-bnav-item"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1.5"/><circle cx="18" cy="21" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L22 7H6"/></svg><span>Cart</span><span class="tg-bnav-badge" id="tg-bnav-badge" style="display:none;">0</span></a>

  <a href="account.html" class="tg-bnav-item active"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></svg><span>Account</span></a>
</nav>

    window.__TOEGO_FB__ = firebase.initializeApp({

    });
  }
  const auth = firebase.auth();
  const db = firebase.firestore();
  const FV = firebase.firestore.FieldValue;

  try { db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED, merge: true }); } catch(e) {}
  try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch(e) {}

  /* ========== CONSTANTS ========== */
  const ADDR_LIST_KEY = 'toego_saved_addresses';
  const ADDR_KEY = 'toego_last_address';
  const ADDR_LAST_IDX = 'toego_last_addr_index';

  function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function toast(msg, type) {

    const w = document.getElementById('tg-toasts');

  function typeBadge(t) {
    t = (t || 'home').toLowerCase();
    const map = {
      home: { label: 'Home', cls: 'home', icon: '🏠' },
      work: { label: 'Work', cls: 'work', icon: '🏢' },
      other: { label: 'Other', cls: 'other', icon: '📍' }
    };
    const m = map[t] || map.home;
    return `<span class="tg-addr-badge ${m.cls}">${m.icon} ${m.label}</span>`;
  }

  function ini(n) { return String(n || 'U').trim().charAt(0).toUpperCase(); }

  function updateCartBadge() {
    let raw = [];
    try { raw = JSON.parse(localStorage.getItem(GUEST_CART_KEY) || '[]'); } catch(e) { raw = []; }
    const n = raw.reduce((s, i) => s + Number(i.qty || 1), 0);
    const el = document.getElementById('tg-bnav-badge');
    if (el) { el.textContent = n; el.style.display = n > 0 ? 'flex' : 'none'; }
  }

  /* ========== STORAGE ========== */
  async function loadAddresses() {
    if (currentUser) {
      try {
        const snap = await db.collection('users').doc(currentUser.uid).get();
        if (snap.exists) {
          const arr = snap.data().addresses;
          if (Array.isArray(arr)) return arr;
        }
      } catch(e) {
        console.warn('[addresses] firestore load failed:', e && e.message);
      }
      return [];
    }
    try {
      const arr = JSON.parse(localStorage.getItem(ADDR_LIST_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch(e) { return []; }
  }

  async function saveAddresses(list) {
    if (currentUser) {
      try {
        await db.collection('users').doc(currentUser.uid).set(
          { addresses: list, updatedAt: FV.serverTimestamp() },
          { merge: true }
        );
      } catch(e) {
        console.error('[addresses] save failed:', e);
        toast('Could not save address', 'error');
        throw e;
      }
    } else {
      try { localStorage.setItem(ADDR_LIST_KEY, JSON.stringify(list)); } catch(e) {}
    }
  }

  /* ========== RENDER ========== */
  function render() {
    const loading = document.getElementById('tg-loading');
    const listEl = document.getElementById('tg-addr-list');
    const emptyEl = document.getElementById('tg-empty');
    const countEl = document.getElementById('tg-count');

    if (loading) loading.style.display = 'none';

    if (!addresses.length) {
      if (listEl) { listEl.style.display = 'none'; listEl.innerHTML = ''; }
      if (emptyEl) emptyEl.style.display = 'block';
      if (countEl) countEl.textContent = '';
      return;
    }

    if (emptyEl) emptyEl.style.display = 'none';
    if (listEl) listEl.style.display = 'flex';
    if (countEl) countEl.textContent = '(' + addresses.length + ')';

    listEl.innerHTML = addresses.map((a, i) => addrCardHtml(a, i)).join('');
  }

  function addrCardHtml(a, i) {
    const isDefault = a.isDefault === true;
    const cls = 'tg-addr-card' + (isDefault ? ' default' : '');
    const line2 = [a.locality, a.landmark ? '(Near ' + a.landmark + ')' : ''].filter(Boolean).join(', ');
    const cityLine = [a.city, a.district].filter(Boolean).join(', ') + (a.state ? ', ' + a.state : '') + (a.pin ? ' - ' + a.pin : '');
    const altPhoneHtml = a.altPhone ? ' / ' + esc(a.altPhone) : '';

    return `
      <div class="${cls}" data-idx="${i}">
        <div class="tg-addr-head">
          <div class="tg-addr-avatar">${esc(ini(a.name))}</div>
          <div class="tg-addr-name-wrap">
            <div class="tg-addr-name">
              ${esc(a.name)}
              ${typeBadge(a.type)}
              ${isDefault ? '<span class="tg-addr-badge default-pill">✓ Default</span>' : ''}
            </div>
            <div class="tg-addr-phone">📱 ${esc(a.phone)}${altPhoneHtml}</div>
          </div>
        </div>
        <div class="tg-addr-body">
          <b>${esc(a.line)}</b>${line2 ? ', ' + esc(line2) : ''}<br>
          ${esc(cityLine)}
        </div>
        <div class="tg-addr-actions">
          <button class="tg-addr-btn edit" onclick="tgEditAddr(${i})">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Edit
          </button>
          ${!isDefault ? `
            <button class="tg-addr-btn default-b" onclick="tgSetDefault(${i})">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              Set Default
            </button>
          ` : ''}
          <button class="tg-addr-btn delete" onclick="tgDeleteAddr(${i})">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            Delete
          </button>
        </div>
      </div>
    `;
  }

  /* ========== MODAL ========== */
  window.tgOpenNewAddr = function() {
    editingIndex = -1;
    pendingAddrType = 'home';
    document.getElementById('tg-modal-title').textContent = 'Add New Address';
    document.getElementById('tg-addr-save-text').textContent = 'Save Address';

    /* Reset type */
    document.querySelectorAll('#tg-addr-types .tg-addr-type').forEach(b => {
      b.classList.toggle('active', b.dataset.type === 'home');
    });

    /* Reset fields */
    ['tg-addr-name','tg-addr-phone','tg-addr-alt-phone','tg-addr-line','tg-addr-locality','tg-addr-landmark','tg-addr-city','tg-addr-pin','tg-addr-district','tg-addr-state','tg-addr-email'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('tg-addr-default').checked = false;

    /* Prefill from profile */
    if (userProfile) {
      const nameEl = document.getElementById('tg-addr-name');
      const phoneEl = document.getElementById('tg-addr-phone');
      const emailEl = document.getElementById('tg-addr-email');
      if (!nameEl.value && userProfile.name) nameEl.value = userProfile.name;
      if (!phoneEl.value && userProfile.phone) phoneEl.value = userProfile.phone;
      if (!emailEl.value && (userProfile.email || (currentUser && currentUser.email))) {
        emailEl.value = userProfile.email || currentUser.email;
      }
    } else if (currentUser && currentUser.email) {
      const emailEl = document.getElementById('tg-addr-email');
      if (!emailEl.value) emailEl.value = currentUser.email;
    }

    /* Prefill from last address */
    try {
      const saved = JSON.parse(localStorage.getItem(ADDR_KEY) || '{}');
      if (!document.getElementById('tg-addr-name').value && saved.name) document.getElementById('tg-addr-name').value = saved.name;
      if (!document.getElementById('tg-addr-phone').value && saved.phone) document.getElementById('tg-addr-phone').value = saved.phone;
    } catch(e) {}

    document.getElementById('tg-addr-modal').classList.add('show');
    document.body.style.overflow = 'hidden';
  };

  window.tgEditAddr = function(i) {
    const a = addresses[i];
    if (!a) return;
    editingIndex = i;
    pendingAddrType = (a.type || 'home').toLowerCase();
    document.getElementById('tg-modal-title').textContent = 'Edit Address';
    document.getElementById('tg-addr-save-text').textContent = 'Save Changes';

    /* Type */
    document.querySelectorAll('#tg-addr-types .tg-addr-type').forEach(b => {
      b.classList.toggle('active', b.dataset.type === pendingAddrType);
    });

    /* Fill fields */
    document.getElementById('tg-addr-name').value = a.name || '';
    document.getElementById('tg-addr-phone').value = a.phone || '';
    document.getElementById('tg-addr-alt-phone').value = a.altPhone || '';
    document.getElementById('tg-addr-line').value = a.line || '';
    document.getElementById('tg-addr-locality').value = a.locality || '';
    document.getElementById('tg-addr-landmark').value = a.landmark || '';
    document.getElementById('tg-addr-city').value = a.city || '';
    document.getElementById('tg-addr-pin').value = a.pin || '';
    document.getElementById('tg-addr-district').value = a.district || '';
    document.getElementById('tg-addr-state').value = a.state || '';
    document.getElementById('tg-addr-email').value = a.email || '';
    document.getElementById('tg-addr-default').checked = a.isDefault === true;

    document.getElementById('tg-addr-modal').classList.add('show');
    document.body.style.overflow = 'hidden';
  };

  window.tgCloseAddr = function() {
    document.getElementById('tg-addr-modal').classList.remove('show');
    document.body.style.overflow = '';
  };

  window.tgPickAddrType = function(t, el) {
    pendingAddrType = t;
    document.querySelectorAll('#tg-addr-types .tg-addr-type').forEach(b => b.classList.remove('active'));
    if (el) el.classList.add('active');
  };

  window.tgSaveAddr = async function() {
    const name = (document.getElementById('tg-addr-name').value || '').trim();
    const phone = (document.getElementById('tg-addr-phone').value || '').trim();
    const altPhone = (document.getElementById('tg-addr-alt-phone').value || '').trim();
    const line = (document.getElementById('tg-addr-line').value || '').trim();
    const locality = (document.getElementById('tg-addr-locality').value || '').trim();
    const landmark = (document.getElementById('tg-addr-landmark').value || '').trim();
    const city = (document.getElementById('tg-addr-city').value || '').trim();
    const pin = (document.getElementById('tg-addr-pin').value || '').trim();
    const district = (document.getElementById('tg-addr-district').value || '').trim();
    const state = (document.getElementById('tg-addr-state').value || '').trim();
    const email = (document.getElementById('tg-addr-email').value || '').trim();
    const isDefault = document.getElementById('tg-addr-default').checked;
    const type = pendingAddrType || 'home';

    /* Validation */
    if (!name || name.length < 2) { toast('Please enter full name', 'error'); return; }
    if (!/^\d{10}$/.test(phone)) { toast('Please enter a valid 10-digit phone', 'error'); return; }
    if (altPhone && !/^\d{10}$/.test(altPhone)) { toast('Alternate phone must be 10 digits', 'error'); return; }
    if (!line || line.length < 5) { toast('Please enter full address', 'error'); return; }
    if (!city) { toast('Please enter city', 'error'); return; }
    if (!/^\d{6}$/.test(pin)) { toast('Please enter a valid 6-digit pincode', 'error'); return; }
    if (!state) { toast('Please enter state', 'error'); return; }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('Please enter a valid email', 'error'); return; }

    const newAddr = {
      name, phone, altPhone, line, locality, landmark,
      city, pin, district, state, email,
      type, isDefault, country: 'India'
    };

    /* Update list */
    const list = addresses.slice();
    if (editingIndex >= 0) {
      list[editingIndex] = newAddr;
    } else {
      list.push(newAddr);
    }

    /* Handle default */
    if (isDefault) {
      list.forEach((a, i) => {
        if (editingIndex >= 0 && i === editingIndex) a.isDefault = true;
        else if (editingIndex < 0 && i === list.length - 1) a.isDefault = true;
        else a.isDefault = false;
      });
    } else if (!list.some(a => a.isDefault) && list.length) {
      /* Ensure at least one default */
      list[0].isDefault = true;
    }

    const btn = document.getElementById('tg-addr-save');
    if (btn) btn.disabled = true;

    try {
      await saveAddresses(list);
      addresses = list;
      render();

      /* Save as last used address */
      try { localStorage.setItem(ADDR_KEY, JSON.stringify(newAddr)); } catch(e) {}
      try { localStorage.setItem(PIN_KEY, pin); } catch(e) {}

      toast(editingIndex >= 0 ? 'Address updated' : 'Address added', 'success');
      tgCloseAddr();
    } catch(e) {
      console.error('[save addr]', e);
      toast('Could not save address', 'error');
    } finally {
      if (btn) btn.disabled = false;
    }
  };

  window.tgSetDefault = async function(i) {
    if (i < 0 || i >= addresses.length) return;
    const list = addresses.map((a, idx) => ({ ...a, isDefault: idx === i }));
    try {
      await saveAddresses(list);
      addresses = list;
      render();
      toast('Default address updated', 'success');
    } catch(e) {
      toast('Could not update default', 'error');
    }
  };

  window.tgDeleteAddr = function(i) {
    if (i < 0 || i >= addresses.length) return;
    const a = addresses[i];
    if (!confirm('Delete address for "' + (a.name || 'this contact') + '"?')) return;
    pendingDeleteIndex = i;
    doDelete();
  };

  async function doDelete() {
    const i = pendingDeleteIndex;
    if (i < 0 || i >= addresses.length) return;
    const wasDefault = addresses[i].isDefault === true;
    const list = addresses.slice();
    list.splice(i, 1);

    /* If deleted was default, promote first to default */
    if (wasDefault && list.length) list[0].isDefault = true;
    /* If no default at all, make first default */
    if (list.length && !list.some(a => a.isDefault)) list[0].isDefault = true;

    try {
      await saveAddresses(list);
      addresses = list;
      render();
      toast('Address deleted', 'success');
    } catch(e) {
      toast('Could not delete address', 'error');
    }
    pendingDeleteIndex = -1;
  }

  /* ========== INIT ========== */
  function loadProfile(u) {
    return db.collection('users').doc(u.uid).get().then(snap => {
      if (snap.exists) userProfile = snap.data();
      else userProfile = null;
    }).catch(() => { userProfile = null; });
  }

  async function initPage() {
    updateCartBadge();
    try { addresses = await loadAddresses(); } catch(e) { addresses = []; }
    render();
  }

  auth.onAuthStateChanged(async (u) => {
    currentUser = u;
    if (u) {
      await loadProfile(u);
    } else {
      userProfile = null;
    }
    /* Reload addresses for this user state */
    try { addresses = await loadAddresses(); } catch(e) { addresses = []; }
    render();
  });

  /* Modal backdrop close */
  document.querySelectorAll('.tg-modal').forEach(m => {
    m.addEventListener('click', (e) => {
      if (e.target === m) {
        m.classList.remove('show');
        document.body.style.overflow = '';
      }
    });
  });

  /* Enter key in form to save */
  document.querySelectorAll('#tg-addr-modal input').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); window.tgSaveAddr(); }
    });
  });

  /* Initial load */
  initPage();

})();
</script>
</body>
</html>
