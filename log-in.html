<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login — TOEGO</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://accounts.google.com">
<link rel="dns-prefetch" href="https://apis.google.com">
<meta name="theme-color" content="#2874f0" id="tg-theme-meta">
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100vw;overflow-x:hidden;min-height:100vh;font-family:'Roboto',Arial,sans-serif;color:#212121;background:#f1f3f6;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font:inherit;}
a{color:inherit;text-decoration:none;}
header#top,#top_menu,nav.o_main_navbar,.o_main_navbar,footer#bottom,.o_footer,#footer,.o_footer_copyright,.o_breadcrumb,.breadcrumb,.o_website_edit_toolbar,.o_notification_manager{display:none!important;}
.tg-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#f1f3f6;}
.tg-card{width:100%;max-width:720px;background:#fff;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.10);display:flex;overflow:hidden;}
.tg-left{flex:0 0 40%;max-width:40%;background:#2874f0;color:#fff;padding:34px 30px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:background .3s;}
.tg-left::after{content:'';position:absolute;bottom:-80px;left:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%);border-radius:50%;}
.tg-left-logo{font-weight:900;font-style:italic;font-size:24px;letter-spacing:-0.4px;position:relative;z-index:2;}
.tg-left-logo span{color:#ffe500;}
.tg-left-content{position:relative;z-index:2;margin-top:auto;margin-bottom:auto;padding:24px 0;}
.tg-left-title{font-size:26px;font-weight:500;line-height:1.15;margin:0 0 12px;letter-spacing:-0.2px;}
.tg-left-sub{font-size:14px;line-height:1.5;opacity:0.88;margin:0;max-width:260px;}
.tg-left-foot{font-size:11px;opacity:0.7;position:relative;z-index:2;letter-spacing:0.2px;}
.tg-right{flex:1 1 auto;padding:36px 42px 32px;display:flex;flex-direction:column;justify-content:center;}
.tg-field{position:relative;margin-bottom:24px;}
.tg-field input{width:100%;height:42px;border:none;border-bottom:1px solid #d4d5d9;background:transparent;font-size:15px;color:#212121;padding:6px 0 8px;outline:none;transition:border-color .2s;border-radius:0;}
.tg-field input:focus{border-bottom-color:#2874f0;}
.tg-field label{position:absolute;left:0;top:12px;font-size:15px;color:#878787;pointer-events:none;transition:all .18s cubic-bezier(.4,0,.2,1);background:#fff;padding:0 4px;margin-left:-4px;}
.tg-field input:focus+label,.tg-field input:not(:placeholder-shown)+label,.tg-field input.filled+label{top:-7px;font-size:12px;color:#2874f0;}
.tg-field input:not(:focus):not(:placeholder-shown)+label{color:#878787;}
.tg-field-pass{position:relative;}
.tg-pass-toggle{position:absolute;right:0;top:10px;font-size:12.5px;color:#2874f0;font-weight:600;padding:4px 0;letter-spacing:0.2px;}
.tg-terms{font-size:11.5px;color:#878787;line-height:1.55;margin:4px 0 20px;}
.tg-terms a{color:#2874f0;font-weight:500;}
.tg-submit{width:100%;padding:14px 16px;border-radius:3px;font-size:15px;font-weight:700;color:#fff;background:#fb641b;letter-spacing:0.3px;display:flex;align-items:center;justify-content:center;gap:10px;transition:box-shadow .18s,transform .1s,filter .15s;box-shadow:0 1px 2px rgba(0,0,0,0.15);position:relative;}
.tg-submit:hover{filter:brightness(1.05);box-shadow:0 4px 12px rgba(251,100,27,0.35);}
.tg-submit:disabled{opacity:0.75;cursor:not-allowed;}
.tg-submit.loading{pointer-events:none;}
.tg-spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:tgSpin .7s linear infinite;display:none;}
@keyframes tgSpin{to{transform:rotate(360deg);}}
.tg-submit.loading .tg-spinner{display:block;}
.tg-div{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:#999;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;font-weight:500;}
.tg-div::before,.tg-div::after{content:'';flex:1;height:1px;background:#e5e7eb;}
.tg-alt-btn{width:100%;padding:12px 16px;border-radius:3px;background:#fff;border:1px solid #d4d5d9;font-size:14px;font-weight:600;color:#2874f0;display:flex;align-items:center;justify-content:center;gap:10px;transition:box-shadow .18s,background .15s;letter-spacing:0.3px;}
.tg-alt-btn:hover{box-shadow:0 2px 8px rgba(0,0,0,0.10);background:#f8fbff;}
.tg-alt-btn svg{width:18px;height:18px;flex-shrink:0;}
.tg-alt-btn.loading{pointer-events:none;opacity:0.75;}
.tg-forgot-row{text-align:right;margin:-12px 0 18px;}
.tg-forgot{font-size:13px;color:#2874f0;font-weight:600;}
.tg-mode{text-align:center;margin-top:20px;font-size:13.5px;color:#878787;}
.tg-mode button{color:#2874f0;font-weight:700;margin-left:4px;letter-spacing:0.2px;}
.tg-field-name{display:none;}
.tg-card.signup .tg-field-name{display:block;}
.tg-card.signup .tg-forgot-row{display:none;}
.tg-toasts{position:fixed;top:20px;right:20px;z-index:999999;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 40px);pointer-events:none;}
.tg-toast{padding:13px 18px;border-radius:4px;background:#212121;color:#fff;font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.25);pointer-events:auto;display:flex;align-items:center;gap:10px;animation:tgToastIn .25s;max-width:380px;line-height:1.4;}
@keyframes tgToastIn{from{transform:translateX(130%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.tg-toast.success{background:#388e3c;}
.tg-toast.error{background:#d32f2f;}
.tg-toast.info{background:#2874f0;}
.tg-auth-loading{position:fixed;inset:0;background:#fff;z-index:99999998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;}
.tg-auth-loading.show{display:flex;}
.tg-auth-loading-logo{font-weight:900;font-style:italic;font-size:32px;color:#2874f0;letter-spacing:-0.5px;margin-bottom:8px;}
.tg-auth-loading-logo span{color:#ffe500;}
.tg-auth-loading-spinner{width:48px;height:48px;border:4px solid #e0e0e0;border-top-color:#2874f0;border-radius:50%;animation:tgSpin .8s linear infinite;}
.tg-auth-loading-text{font-size:15px;color:#666;font-weight:500;text-align:center;padding:0 20px;line-height:1.5;}
.tg-auth-loading-check{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin-bottom:6px;animation:tgCheckPop .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 12px 40px rgba(34,197,94,0.4);}
@keyframes tgCheckPop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.tg-auth-loading-check svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:tgCheckDraw .3s .1s ease forwards;}
@keyframes tgCheckDraw{to{stroke-dashoffset:0;}}
.tg-overlay{position:fixed;inset:0;background:rgba(241,243,246,0.96);backdrop-filter:blur(4px);z-index:999998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.tg-overlay.show{display:flex;}
.tg-overlay-spinner{width:42px;height:42px;border:4px solid #d4d5d9;border-top-color:#2874f0;border-radius:50%;animation:tgSpin .8s linear infinite;}
.tg-overlay-text{font-size:14px;color:#212121;font-weight:500;text-align:center;padding:0 20px;line-height:1.5;}
.tg-modal{position:fixed;inset:0;background:rgba(15,23,41,0.6);backdrop-filter:blur(4px);z-index:999999999;display:none;align-items:center;justify-content:center;padding:20px;animation:tgFadeIn .2s ease;}
.tg-modal.show{display:flex;}
@keyframes tgFadeIn{from{opacity:0;}to{opacity:1;}}
.tg-modal-box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:32px 28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:tgModalIn .25s cubic-bezier(.34,1.56,.64,1);}
@keyframes tgModalIn{from{transform:scale(0.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.tg-modal-icon{width:72px;height:72px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;}
.tg-modal-icon.warn{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:#f57c00;}
.tg-modal-icon.error{background:linear-gradient(135deg,#ffebee,#ffcdd2);color:#d32f2f;}
.tg-modal-icon.info{background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:#1565c0;}
.tg-modal-icon.success{background:linear-gradient(135deg,#e6f7ec,#c8e6c9);color:#1b8a3a;}
.tg-modal-title{font-size:19px;font-weight:800;color:#212121;margin:0 0 10px;letter-spacing:-0.2px;line-height:1.3;}
.tg-modal-desc{font-size:14px;color:#666;line-height:1.55;margin:0 0 22px;}
.tg-modal-desc b{color:#212121;font-weight:700;word-break:break-word;}
.tg-modal-actions{display:flex;gap:10px;flex-direction:column;}
.tg-modal-btn{padding:13px 20px;border-radius:10px;font-size:14.5px;font-weight:800;letter-spacing:0.3px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
.tg-modal-btn.primary{background:linear-gradient(135deg,#2874f0,#1a5dc7);color:#fff;box-shadow:0 4px 12px rgba(40,116,240,0.35);}
.tg-modal-btn.orange{background:linear-gradient(135deg,#fb641b,#e65100);color:#fff;box-shadow:0 4px 12px rgba(251,100,27,0.35);}
.tg-modal-btn.danger{background:linear-gradient(135deg,#d32f2f,#b71c1c);color:#fff;box-shadow:0 4px 12px rgba(211,47,47,0.35);}
.tg-modal-btn.ghost{background:#f1f3f6;color:#212121;}
@media (max-width:720px){.tg-wrap{padding:16px 12px;align-items:flex-start;padding-top:28px;}.tg-card{max-width:100%;flex-direction:column;}.tg-left{flex:0 0 auto;max-width:100%;padding:22px 24px 20px;}.tg-left-content{margin:8px 0 0;padding:0;}.tg-left-title{font-size:19px;margin-bottom:4px;}.tg-left-sub{font-size:12.5px;max-width:100%;}.tg-left-foot{display:none;}.tg-right{padding:26px 24px 28px;}.tg-toasts{top:12px;right:12px;left:12px;max-width:none;align-items:stretch;}.tg-toast{max-width:none;}.tg-auth-loading-logo{font-size:26px;}.tg-auth-loading-spinner{width:42px;height:42px;}}
@media (max-width:380px){.tg-right{padding:20px 18px 24px;}.tg-left{padding:18px 18px 16px;}.tg-left-title{font-size:17px;}.tg-field input{font-size:14px;}.tg-modal-box{padding:28px 20px 20px;}.tg-modal-icon{width:64px;height:64px;font-size:32px;}}
</style>
</head>
<body>

<div class="tg-auth-loading" id="tg-auth-loading">
  <div class="tg-auth-loading-logo">TOE<span>GO</span></div>
  <div class="tg-auth-loading-spinner" id="tg-auth-loading-spinner"></div>
  <div class="tg-auth-loading-check" id="tg-auth-loading-check" style="display:none;">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <div class="tg-auth-loading-text" id="tg-auth-loading-text">Signing you in…</div>
</div>

<div class="tg-overlay" id="tg-overlay">
  <div class="tg-overlay-spinner"></div>
  <div class="tg-overlay-text" id="tg-overlay-text">Please wait…</div>
</div>

<div class="tg-modal" id="tg-modal">
  <div class="tg-modal-box">
    <div class="tg-modal-icon" id="tg-modal-icon">!</div>
    <h3 class="tg-modal-title" id="tg-modal-title">Title</h3>
    <p class="tg-modal-desc" id="tg-modal-desc">Description</p>
    <div class="tg-modal-actions" id="tg-modal-actions">
      <button class="tg-modal-btn primary" id="tg-modal-primary">OK</button>
      <button class="tg-modal-btn ghost" id="tg-modal-secondary" style="display:none;">Cancel</button>
    </div>
  </div>
</div>

<div class="tg-toasts" id="tg-toasts"></div>

<div class="tg-wrap" id="tg-wrap">
  <div class="tg-card" id="tg-card">
    <aside class="tg-left" id="tg-left">
      <div class="tg-left-logo">TOE<span>GO</span></div>
      <div class="tg-left-content">
        <h1 class="tg-left-title" id="tg-left-title">Login</h1>
        <p class="tg-left-sub" id="tg-left-sub">Get access to your Orders, Wishlist and Recommendations</p>
      </div>
      <div class="tg-left-foot">© 2025 TOEGO.com</div>
    </aside>
    <main class="tg-right">
      <form id="tg-form" autocomplete="on" novalidate>
        <div class="tg-field tg-field-name">
          <input type="text" name="name" id="tg-name" placeholder=" " autocomplete="name" maxlength="60">
          <label for="tg-name">Enter Full Name</label>
        </div>
        <div class="tg-field">
          <input type="email" name="email" id="tg-email" placeholder=" " autocomplete="email" required>
          <label for="tg-email">Enter Email/Mobile number</label>
        </div>
        <div class="tg-field tg-field-pass">
          <input type="password" name="password" id="tg-password" placeholder=" " autocomplete="current-password" required minlength="6">
          <label for="tg-password">Enter Password</label>
          <button type="button" class="tg-pass-toggle" id="tg-toggle-pass">Show</button>
        </div>
        <div class="tg-forgot-row" id="tg-forgot-row">
          <a href="#" class="tg-forgot" id="tg-forgot">Forgot Password?</a>
        </div>
        <div class="tg-terms">By continuing, you agree to TOEGO's <a href="terms.html">Terms of Use</a> and <a href="privacy.html">Privacy Policy</a>.</div>
        <button type="submit" class="tg-submit" id="tg-submit">
          <span class="tg-spinner"></span>
          <span class="tg-btn-text" id="tg-submit-text">Login</span>
        </button>
        <div class="tg-div">or</div>
        <button type="button" class="tg-alt-btn" id="tg-google">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
          </svg>
          <span id="tg-google-text">Continue with Google</span>
        </button>
        <div class="tg-mode">
          <span id="tg-mode-label">New to TOEGO?</span>
          <button type="button" id="tg-mode-switch">Create an account</button>
        </div>
      </form>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
(function() {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════
     ✅ SAFE STORAGE WRAPPER
     ═══════════════════════════════════════════════════════════════ */
  const _memLocal = new Map();
  const _memSession = new Map();
  function _testStorage(type) {
    try {
      const s = window[type];
      if (!s) return false;
      const k = '__tg_test_' + Math.random();
      s.setItem(k, '1');
      const v = s.getItem(k);
      s.removeItem(k);
      return v === '1';
    } catch(e) { return false; }
  }
  const HAS_LOCAL = _testStorage('localStorage');
  const HAS_SESSION = _testStorage('sessionStorage');
  console.log('[boot] localStorage:', HAS_LOCAL, '| sessionStorage:', HAS_SESSION);

  const SafeStore = {
    local: {
      get(k) { try { if (HAS_LOCAL) return localStorage.getItem(k); } catch(e) {} return _memLocal.get(k) ?? null; },
      set(k, v) { try { if (HAS_LOCAL) { localStorage.setItem(k, v); return; } } catch(e) {} _memLocal.set(k, v); },
      remove(k) { try { if (HAS_LOCAL) localStorage.removeItem(k); } catch(e) {} _memLocal.delete(k); }
    },
    session: {
      get(k) { try { if (HAS_SESSION) return sessionStorage.getItem(k); } catch(e) {} return _memSession.get(k) ?? null; },
      set(k, v) { try { if (HAS_SESSION) { sessionStorage.setItem(k, v); return; } } catch(e) {} _memSession.set(k, v); },
      remove(k) { try { if (HAS_SESSION) sessionStorage.removeItem(k); } catch(e) {} _memSession.delete(k); }
    }
  };

  const REDIRECT_URL = 'shop-home.html';
  const AUTH_CACHE_KEY = 'toego_auth_cache';
  const GOOGLE_PENDING_KEY = 'tg_google_pending';
  const LOGIN_SUCCESS_KEY = 'tg_login_success';
  const GOOGLE_PENDING_TTL = 5 * 60 * 1000;

  function setPendingGoogle() { SafeStore.local.set(GOOGLE_PENDING_KEY, String(Date.now())); }
  function clearPendingGoogle() { SafeStore.local.remove(GOOGLE_PENDING_KEY); }
  function isPendingGoogle() {
    try {
      const v = SafeStore.local.get(GOOGLE_PENDING_KEY);
      if (!v) return false;
      const ts = Number(v);
      if (!ts || isNaN(ts) || Date.now() - ts > GOOGLE_PENDING_TTL) { clearPendingGoogle(); return false; }
      return true;
    } catch(e) { return false; }
  }

  function markLoginSuccess(name) {
    SafeStore.session.set(LOGIN_SUCCESS_KEY, JSON.stringify({ name: name || 'User', ts: Date.now() }));
  }

  if (isPendingGoogle()) {
    document.getElementById('tg-auth-loading').classList.add('show');
    document.getElementById('tg-wrap').style.display = 'none';
    document.body.style.overflow = 'hidden';
  }

  function showAuthLoading(text, showCheck) {
    const el = document.getElementById('tg-auth-loading');
    const txt = document.getElementById('tg-auth-loading-text');
    const spinner = document.getElementById('tg-auth-loading-spinner');
    const check = document.getElementById('tg-auth-loading-check');
    if (txt) txt.textContent = text || 'Signing you in…';
    if (showCheck) { if (spinner) spinner.style.display = 'none'; if (check) check.style.display = 'flex'; }
    else { if (spinner) spinner.style.display = 'block'; if (check) check.style.display = 'none'; }
    if (el) el.classList.add('show');
    const wrap = document.getElementById('tg-wrap');
    if (wrap) wrap.style.display = 'none';
    document.body.style.overflow = 'hidden';
  }
  function hideAuthLoading() {
    const el = document.getElementById('tg-auth-loading');
    if (el) el.classList.remove('show');
    const wrap = document.getElementById('tg-wrap');
    if (wrap) wrap.style.display = '';
    document.body.style.overflow = '';
  }

  /* ═══ FIREBASE INIT ═══ */
  let auth, db, FV;
  try {
    if (!window.__TOEGO_FB__) {
      window.__TOEGO_FB__ = firebase.initializeApp({
        apiKey: "AIzaSyAhxecFY9TwZTYbdCVRAcnp1whI-Uqc-P8",
        authDomain: "toego-ecommerce.firebaseapp.com",
        projectId: "toego-ecommerce",
        storageBucket: "toego-ecommerce.firebasestorage.app",
        messagingSenderId: "234167880880",
        appId: "1:234167880880:web:b89d4b8e5f8cc9af3c3f75"
      });
    }
    auth = firebase.auth();
    db = firebase.firestore();
    FV = firebase.firestore.FieldValue;
  } catch(e) {
    console.error('[init] firebase failed:', e);
  }

  /* ═══════════════════════════════════════════════════════════════
     ✅ FIXED PERSISTENCE — NONE if storage blocked
     Firebase v8 uses IndexedDB for LOCAL — we use NONE to avoid errors
     ═══════════════════════════════════════════════════════════════ */
  let PERSISTENCE_READY = Promise.resolve();
  if (auth) {
    const useNone = !HAS_LOCAL && !HAS_SESSION;
    const targetMode = useNone
      ? firebase.auth.Auth.Persistence.NONE
      : (HAS_LOCAL ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);

    PERSISTENCE_READY = auth.setPersistence(targetMode)
      .then(() => console.log('[auth] persistence =', useNone ? 'NONE' : (HAS_LOCAL ? 'LOCAL' : 'SESSION'), '✓'))
      .catch((e) => {
        console.warn('[auth] persistence fallback:', e && e.code);
        return auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => {});
      });
  }

  /* ═══ THEME ═══ */
  const themeMeta = document.getElementById('tg-theme-meta');
  function applyTheme(primary) {
    primary = primary || '#2874f0';
    if (themeMeta) themeMeta.setAttribute('content', primary);
    const left = document.getElementById('tg-left');
    if (left) left.style.background = primary;
    document.documentElement.style.setProperty('--tg-primary', primary);
    SafeStore.local.set('toego_theme_colors', JSON.stringify({ primary }));
  }
  (function() {
    try { const c = SafeStore.local.get('toego_theme_colors'); if (c) applyTheme(JSON.parse(c).primary); } catch(e) {}
  })();

  /* ═══ OVERLAY / TOAST ═══ */
  const overlay = document.getElementById('tg-overlay');
  const overlayText = document.getElementById('tg-overlay-text');
  function showOverlay(t) { if (overlayText) overlayText.textContent = t || 'Please wait…'; if (overlay) overlay.classList.add('show'); }
  function hideOverlay() { if (overlay) overlay.classList.remove('show'); }

  function toast(msg, type) {
    type = type || 'info';
    const w = document.getElementById('tg-toasts');
    if (!w || !msg) return;
    const el = document.createElement('div');
    el.className = 'tg-toast ' + type;
    el.textContent = msg;
    w.appendChild(el);
    setTimeout(() => { el.style.transition = 'transform .3s, opacity .3s'; el.style.transform = 'translateX(130%)'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2500);
  }

  /* ═══ MODAL ═══ */
  const modal = document.getElementById('tg-modal');
  const modalIcon = document.getElementById('tg-modal-icon');
  const modalTitle = document.getElementById('tg-modal-title');
  const modalDesc = document.getElementById('tg-modal-desc');
  const modalPrimary = document.getElementById('tg-modal-primary');
  const modalSecondary = document.getElementById('tg-modal-secondary');
  let _modalPrimaryCb = null;

  window.tgShowModal = function(opts) {
    opts = opts || {};
    const type = opts.type || 'info';
    const icons = { warn: '!', error: '✕', info: 'i', success: '✓' };
    modalIcon.className = 'tg-modal-icon ' + type;
    modalIcon.textContent = icons[type] || '!';
    modalTitle.textContent = opts.title || 'Notice';
    modalDesc.innerHTML = opts.desc || '';
    modalPrimary.innerHTML = opts.primaryText || 'OK';
    _modalPrimaryCb = opts.onPrimary || null;
    if (opts.secondaryText) {
      modalSecondary.style.display = 'flex';
      modalSecondary.textContent = opts.secondaryText;
      modalSecondary.onclick = function() { tgModalClose(); if (opts.onSecondary) opts.onSecondary(); };
    } else {
      modalSecondary.style.display = 'none';
    }
    modalPrimary.className = 'tg-modal-btn ' + (type === 'error' ? 'danger' : type === 'warn' ? 'orange' : 'primary');
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
  };
  window.tgModalClose = function() { modal.classList.remove('show'); document.body.style.overflow = ''; _modalPrimaryCb = null; };
  modalPrimary.addEventListener('click', function() { const cb = _modalPrimaryCb; tgModalClose(); if (cb) cb(); });
  modal.addEventListener('click', function(e) { if (e.target === modal) tgModalClose(); });

  /* ═══════════════════════════════════════════════════════════════
     ERROR HANDLER — Shows REAL error for debugging
     ═══════════════════════════════════════════════════════════════ */
  function showAuthError(err, context) {
    const code = (err && err.code) || 'unknown';
    console.error('[auth-error]', code, err && err.message, '| context:', context);

    /* Storage errors — mostly silent */
    if (code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') {
      console.log('[auth] silent storage error:', code);
      return;
    }
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return;
    if (code === 'auth/no-auth-event') return;

    if (code === 'auth/email-already-in-use') {
      tgShowModal({ type: 'warn', title: 'Already Registered', desc: 'Ye email pehle se registered hai.<br><br>Kya aap isi email se <b>login</b> karna chahte ho?', primaryText: 'Yes, Login', secondaryText: 'Try Different Email', onPrimary: function() { if (mode !== 'login') setMode('login'); passwordInput.value = ''; passwordInput.focus(); }, onSecondary: function() { emailInput.focus(); emailInput.select(); } });
      return;
    }
    if (code === 'auth/weak-password') {
      tgShowModal({ type: 'warn', title: 'Weak Password', desc: 'Password kam se kam <b>6 characters</b> ka hona chahiye.', primaryText: 'Try Again', onPrimary: function() { passwordInput.focus(); passwordInput.select(); } });
      return;
    }
    if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') {
      tgShowModal({
        type: 'error',
        title: 'Incorrect Email or Password',
        desc: 'Aapne jo email ya password daala hai woh <b>galat</b> hai.<br><br>✓ Email sahi hai?<br>✓ Password yaad hai?<br><br>Password bhool gaye? <b>"Reset Password"</b> use karo.',
        primaryText: 'Try Again',
        secondaryText: 'Reset Password',
        onPrimary: function() { passwordInput.focus(); passwordInput.select(); },
        onSecondary: function() {
          const email = (emailInput.value || '').trim();
          if (email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showOverlay('Sending reset link…');
            auth.sendPasswordResetEmail(email).then(function() {
              hideOverlay();
              tgShowModal({ type: 'success', title: 'Reset Link Sent', desc: 'Reset link bhej diya gaya hai:<br><br><b>' + email + '</b><br><br>Inbox check karo (spam bhi dekh lo).', primaryText: 'OK' });
            }).catch(function() {
              hideOverlay();
              toast('Could not send reset email', 'error');
            });
          } else {
            toast('Enter valid email first', 'error');
            emailInput.focus();
          }
        }
      });
      return;
    }
    if (code === 'auth/user-not-found') {
      tgShowModal({ type: 'warn', title: 'Account Not Found', desc: 'Is email se koi account nahi mila.<br><br>Check karo:<br>✓ Email sahi likha hai?<br>✓ Ya pehle signup karo?', primaryText: 'Create Account', secondaryText: 'Try Different Email', onPrimary: function() { setMode('signup'); }, onSecondary: function() { emailInput.focus(); emailInput.select(); } });
      return;
    }
    if (code === 'auth/invalid-email') {
      tgShowModal({ type: 'warn', title: 'Invalid Email', desc: 'Please ek <b>valid email address</b> daalo.<br><br>Example: name@gmail.com', primaryText: 'OK', onPrimary: function() { emailInput.focus(); emailInput.select(); } });
      return;
    }
    if (code === 'auth/network-request-failed') {
      tgShowModal({ type: 'error', title: 'No Internet', desc: 'Network connection check karo.<br>WiFi ya mobile data try karo.', primaryText: 'Retry', onPrimary: function() { submitBtn.click(); } });
      return;
    }
    if (code === 'auth/too-many-requests') {
      tgShowModal({ type: 'error', title: 'Too Many Attempts', desc: 'Bohot zyada attempts ho gaye.<br>Kuch der baad try karo ya password reset karo.', primaryText: 'OK' });
      return;
    }
    if (code === 'auth/user-disabled') {
      tgShowModal({ type: 'error', title: 'Account Disabled', desc: 'Ye account block ho gaya hai.<br>Support se contact karo.', primaryText: 'OK' });
      return;
    }
    if (code === 'auth/unauthorized-domain') {
      tgShowModal({ type: 'error', title: 'Configuration Error', desc: 'Google sign-in abhi available nahi hai.<br><br>Kripya <b>Email aur Password</b> use karo.', primaryText: 'OK' });
      return;
    }
    if (code === 'auth/operation-not-supported-in-this-environment') {
      tgShowModal({ type: 'error', title: 'Unsupported Browser', desc: 'Please <b>Chrome</b> ya <b>Safari</b> browser use karo.', primaryText: 'OK' });
      return;
    }
    if (code === 'auth/account-exists-with-different-credential') {
      tgShowModal({ type: 'warn', title: 'Email Already Used', desc: 'Ye email kisi aur sign-in method se registered hai.<br><br>Pehle us method se login karo.', primaryText: 'OK' });
      return;
    }
    if (code === 'auth/requires-recent-login') {
      tgShowModal({ type: 'warn', title: 'Re-login Required', desc: 'Security ke liye please <b>dobara login</b> karo.', primaryText: 'OK' });
      return;
    }

    /* Generic — show actual code for debugging */
    console.warn('[auth] unhandled:', code);
    tgShowModal({
      type: 'error',
      title: 'Login Failed',
      desc: 'Kuch problem aayi. Please try again.<br><br><small style="color:#999;font-size:11px;">Error: ' + code + '</small>',
      primaryText: 'Try Again'
    });
  }

  function syncUserDocAsync(user, extraName) {
    if (!user) return;
    try {
      const ref = db.collection('users').doc(user.uid);
      ref.get().then(snap => {
        if (!snap.exists) {
          ref.set({
            uid: user.uid, email: user.email || '',
            name: extraName || user.displayName || (user.email ? user.email.split('@')[0] : 'Guest'),
            phone: user.phoneNumber || '', photoURL: user.photoURL || '',
            role: 'customer', createdAt: FV.serverTimestamp(), lastLogin: FV.serverTimestamp(),
            provider: (user.providerData && user.providerData[0] && user.providerData[0].providerId) || 'password'
          }).catch(() => {});
        } else {
          const upd = { lastLogin: FV.serverTimestamp() };
          if (user.photoURL) upd.photoURL = user.photoURL;
          if (user.displayName) upd.name = user.displayName;
          ref.update(upd).catch(() => {});
        }
      }).catch(() => {});
    } catch(e) {}
  }

  function cacheAuth(user, extraName) {
    if (!user) { SafeStore.local.remove(AUTH_CACHE_KEY); return; }
    try {
      SafeStore.local.set(AUTH_CACHE_KEY, JSON.stringify({
        uid: user.uid, email: user.email || '',
        name: extraName || user.displayName || (user.email ? user.email.split('@')[0] : ''),
        photoURL: user.photoURL || '',
        role: 'customer',
        ts: Date.now()
      }));
    } catch(e) {}
  }

  /* ═══ UI REFS ═══ */
  const card = document.getElementById('tg-card');
  const leftTitle = document.getElementById('tg-left-title');
  const leftSub = document.getElementById('tg-left-sub');
  const form = document.getElementById('tg-form');
  const nameInput = document.getElementById('tg-name');
  const emailInput = document.getElementById('tg-email');
  const passwordInput = document.getElementById('tg-password');
  const submitBtn = document.getElementById('tg-submit');
  const submitText = document.getElementById('tg-submit-text');
  const modeSwitch = document.getElementById('tg-mode-switch');
  const modeLabel = document.getElementById('tg-mode-label');
  const passToggle = document.getElementById('tg-toggle-pass');
  const googleBtn = document.getElementById('tg-google');
  const googleText = document.getElementById('tg-google-text');
  const forgotLink = document.getElementById('tg-forgot');
  const forgotRow = document.getElementById('tg-forgot-row');

  let mode = 'login';
  function setMode(m) {
    mode = m;
    if (m === 'signup') {
      card.classList.add('signup');
      leftTitle.textContent = 'Looks like you\'re new here!';
      leftSub.textContent = 'Sign up with TOEGO and unlock exclusive deals, faster checkout & order tracking.';
      submitText.textContent = 'Sign Up';
      modeLabel.textContent = 'Already have an account?';
      modeSwitch.textContent = 'Log in';
      passwordInput.setAttribute('autocomplete', 'new-password');
      forgotRow.style.display = 'none';
    } else {
      card.classList.remove('signup');
      leftTitle.textContent = 'Login';
      leftSub.textContent = 'Get access to your Orders, Wishlist and Recommendations';
      submitText.textContent = 'Login';
      modeLabel.textContent = 'New to TOEGO?';
      modeSwitch.textContent = 'Create an account';
      passwordInput.setAttribute('autocomplete', 'current-password');
      forgotRow.style.display = '';
    }
  }
  modeSwitch.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));
  passToggle.addEventListener('click', () => {
    const isPass = passwordInput.type === 'password';
    passwordInput.type = isPass ? 'text' : 'password';
    passToggle.textContent = isPass ? 'Hide' : 'Show';
  });
  [nameInput, emailInput, passwordInput].forEach(inp => {
    if (!inp) return;
    const upd = () => inp.classList.toggle('filled', !!inp.value);
    inp.addEventListener('input', upd);
    inp.addEventListener('blur', upd);
    upd();
  });

  function setSubmitLoading(on, txt) {
    if (on) { submitBtn.classList.add('loading'); submitBtn.disabled = true; if (txt) submitText.textContent = txt; }
    else { submitBtn.classList.remove('loading'); submitBtn.disabled = false; submitText.textContent = mode === 'signup' ? 'Sign Up' : 'Login'; }
  }
  function setGoogleLoading(on) {
    googleBtn.classList.toggle('loading', on);
    googleText.textContent = on ? 'Please wait…' : 'Continue with Google';
  }

  let _redirected = false;
  function doFinalRedirect() {
    if (_redirected) return;
    _redirected = true;
    clearPendingGoogle();
    window.location.replace(REDIRECT_URL);
  }

  function handleAuthSuccess(user, source) {
    if (!user) return;
    console.log('[auth] success via', source, '-', user.email);
    showAuthLoading('Login successful! Redirecting…', true);
    cacheAuth(user);
    const name = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
    markLoginSuccess(name);
    syncUserDocAsync(user);
    setTimeout(doFinalRedirect, 350);
  }

  /* ═══════════════════════════════════════════════════════════════
     EMAIL / PASSWORD SUBMIT — AWAITS PERSISTENCE FIRST
     ═══════════════════════════════════════════════════════════════ */
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = (emailInput.value || '').trim();
    const password = passwordInput.value || '';
    const name = (nameInput && nameInput.value || '').trim();

    if (!email) { tgShowModal({ type: 'warn', title: 'Email Required', desc: 'Please apna <b>email</b> daalo.', primaryText: 'OK', onPrimary: () => emailInput.focus() }); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { tgShowModal({ type: 'warn', title: 'Invalid Email', desc: 'Please ek <b>valid email</b> daalo.', primaryText: 'OK', onPrimary: () => { emailInput.focus(); emailInput.select(); } }); return; }
    if (!password) { tgShowModal({ type: 'warn', title: 'Password Required', desc: 'Please apna <b>password</b> daalo.', primaryText: 'OK', onPrimary: () => passwordInput.focus() }); return; }
    if (password.length < 6) { tgShowModal({ type: 'warn', title: 'Password Too Short', desc: 'Password kam se kam <b>6 characters</b>.', primaryText: 'OK', onPrimary: () => { passwordInput.focus(); passwordInput.select(); } }); return; }
    if (mode === 'signup' && !name) { tgShowModal({ type: 'warn', title: 'Name Required', desc: 'Please apna <b>full name</b> daalo.', primaryText: 'OK', onPrimary: () => nameInput.focus() }); return; }

    setSubmitLoading(true, mode === 'signup' ? 'Creating account…' : 'Logging in…');

    try {
      /* ✅ CRITICAL: Await persistence BEFORE sign-in */
      await PERSISTENCE_READY;
      console.log('[auth] attempting', mode, 'for', email);

      let cred;
      if (mode === 'signup') {
        cred = await auth.createUserWithEmailAndPassword(email, password);
        console.log('[auth] signup success:', cred.user.uid);
        if (cred.user && name) {
          try { await cred.user.updateProfile({ displayName: name }); } catch(e) {}
        }
      } else {
        cred = await auth.signInWithEmailAndPassword(email, password);
        console.log('[auth] login success:', cred.user.uid);
      }
      handleAuthSuccess(cred.user, mode);
    } catch (err) {
      console.error('[auth]', mode, 'error:', err && err.code, err && err.message);
      setSubmitLoading(false);
      showAuthError(err, mode);
    }
  });

  /* ═══ GOOGLE ═══ */
  googleBtn.addEventListener('click', async () => {
    setGoogleLoading(true);
    await PERSISTENCE_READY;
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    try {
      const result = await auth.signInWithPopup(provider);
      if (result && result.user) { handleAuthSuccess(result.user, 'google-popup'); return; }
      setGoogleLoading(false);
    } catch (popupErr) {
      const code = popupErr && popupErr.code;
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') { setGoogleLoading(false); return; }
      if (code === 'auth/popup-blocked' || code === 'auth/operation-not-supported-in-this-environment') {
        setPendingGoogle();
        showAuthLoading('Redirecting to Google…', false);
        try { await auth.signInWithRedirect(provider); return; }
        catch (redirErr) { clearPendingGoogle(); hideAuthLoading(); setGoogleLoading(false); showAuthError(redirErr, 'google'); return; }
      }
      if (code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') { setGoogleLoading(false); return; }
      setGoogleLoading(false);
      showAuthError(popupErr, 'google');
    }
  });

  (async function handleRedirectReturn() {
    try {
      const result = await auth.getRedirectResult();
      if (result && result.user) { handleAuthSuccess(result.user, 'google-redirect'); return; }
      if (isPendingGoogle()) {
        setTimeout(() => { if (!auth.currentUser) { clearPendingGoogle(); hideAuthLoading(); } }, 3500);
      }
    } catch (err) {
      const code = err && err.code;
      if (code === 'auth/web-storage-unsupported' || code === 'auth/internal-error' || code === 'auth/no-auth-event' || code === 'auth/cancelled-popup-request') {
        if (isPendingGoogle() && !auth.currentUser) { clearPendingGoogle(); hideAuthLoading(); }
        return;
      }
      clearPendingGoogle();
      hideAuthLoading();
      showAuthError(err, 'google');
    }
  })();

  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      if (isPendingGoogle()) {
        setTimeout(() => { if (!auth.currentUser) { clearPendingGoogle(); hideAuthLoading(); } }, 2500);
      }
      return;
    }
    console.log('[auth] state-change →', user.email);
    clearPendingGoogle();
    handleAuthSuccess(user, 'state-change');
  });

  setTimeout(() => {
    if (auth.currentUser && !_redirected) { handleAuthSuccess(auth.currentUser, 'failsafe'); }
    else if (isPendingGoogle() && !auth.currentUser) { clearPendingGoogle(); hideAuthLoading(); }
  }, 6000);

  window.addEventListener('pageshow', (e) => {
    if (e.persisted && auth.currentUser && !_redirected) { handleAuthSuccess(auth.currentUser, 'pageshow'); }
  });

  forgotLink.addEventListener('click', async (e) => {
    e.preventDefault();
    const email = (emailInput.value || '').trim();
    if (!email) { tgShowModal({ type: 'info', title: 'Email Required', desc: 'Password reset ke liye pehle <b>email</b> daalo.', primaryText: 'OK', onPrimary: () => emailInput.focus() }); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { tgShowModal({ type: 'warn', title: 'Invalid Email', desc: 'Please valid email daalo.', primaryText: 'OK', onPrimary: () => { emailInput.focus(); emailInput.select(); } }); return; }
    showOverlay('Sending reset link…');
    try {
      await auth.sendPasswordResetEmail(email);
      hideOverlay();
      tgShowModal({ type: 'success', title: 'Reset Link Sent', desc: 'Reset link bhej diya gaya hai:<br><br><b>' + email + '</b><br><br>Inbox check karo (spam bhi dekh lo).', primaryText: 'OK' });
    } catch (err) {
      hideOverlay();
      const code = err && err.code;
      if (code === 'auth/user-not-found') {
        tgShowModal({ type: 'warn', title: 'Account Not Found', desc: 'Is email se koi account nahi mila.', primaryText: 'Create Account', secondaryText: 'Cancel', onPrimary: () => setMode('signup') });
      } else {
        showAuthError(err, 'reset');
      }
    }
  });

  setTimeout(() => {
    try {
      db.collection('siteSettings').doc('theme').get()
        .then(snap => { if (snap.exists) applyTheme(snap.data().themeColor || '#2874f0'); })
        .catch(() => {});
    } catch(e) {}
  }, 300);

})();
</script>
</body>
</html>
