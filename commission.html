<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Commission — TOEGO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">

<meta name="theme-color" content="#0a0e1a" id="tg-theme-meta">

<style>
:root {
  --primary: #2874f0;
  --primary-dark: #1a5dc7;
  --obsidian: #0a0e1a;
  --obsidian-light: #1a2138;
  --obsidian-mid: #131a2e;
  --gold: #d4af37;
  --gold-bright: #f4d03f;
  --gold-champagne: #f7e7ce;
  --emerald: #10b981;
  --emerald-light: #d1fae5;
  --ruby: #ef4444;
  --ruby-light: #fee2e2;
  --amber: #f59e0b;
  --amber-light: #fef3c7;
  --ink: #0f172a;
  --ink-muted: #64748b;
  --ink-light: #94a3b8;
  --surface: #ffffff;
  --surface-muted: #fafbfc;
  --border: #e5e7eb;
  --border-subtle: #f1f5f9;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04), 0 2px 8px rgba(15,23,42,0.04);
  --shadow-md: 0 2px 4px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.08);
  --shadow-lg: 0 8px 32px rgba(15,23,42,0.12), 0 4px 8px rgba(15,23,42,0.04);
  --shadow-gold: 0 8px 32px rgba(212,175,55,0.28), 0 2px 8px rgba(212,175,55,0.15);
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0 !important; padding: 0 !important;
  width: 100% !important; max-width: 100vw; overflow-x: hidden;
  background: var(--surface-muted);
  font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'ss01', 'cv01', 'cv11';
}
img { max-width: 100%; display: block; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font: inherit; }
a { color: inherit; text-decoration: none; }

header#top, #top_menu, nav.o_main_navbar, .o_main_navbar, footer#bottom, .o_footer, #footer, .o_footer_copyright, .o_breadcrumb, .breadcrumb, .o_website_edit_toolbar, .o_notification_manager, .o_editor_banner, .o_loading_indicator { display: none !important; }

/* ═══════════ PREMIUM HEADER ═══════════ */
.tg-hd {
  background: linear-gradient(180deg, #0a0e1a 0%, #131a2e 100%);
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  box-shadow: 0 4px 24px rgba(0,0,0,0.32);
  border-bottom: 1px solid rgba(212,175,55,0.15);
}
.tg-hd::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--gold) 20%, var(--gold-bright) 50%, var(--gold) 80%, transparent 100%);
  opacity: 0.7;
}
.tg-hd-inner {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 18px; height: 60px;
  max-width: 720px; margin: 0 auto;
}
.tg-hd-back {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  color: var(--gold-champagne); border-radius: 10px; flex-shrink: 0;
  transition: background 0.2s, color 0.2s;
  border: 1px solid rgba(212,175,55,0.12);
  background: rgba(212,175,55,0.05);
}
.tg-hd-back:hover { background: rgba(212,175,55,0.12); color: var(--gold-bright); }
.tg-hd-back svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tg-hd-title {
  flex: 1; color: #fff; font-family: 'Manrope', sans-serif;
  font-size: 17px; font-weight: 800; letter-spacing: -0.3px;
}

/* ═══════════ WRAP ═══════════ */
.tg-wrap { min-height: 100vh; padding-top: 60px; padding-bottom: 88px; }
.tg-container { max-width: 720px; margin: 0 auto; padding: 18px 16px; }

/* ═══════════ HERO — OBSIDIAN + GOLD ═══════════ */
.tg-hero {
  background:
    radial-gradient(ellipse 120% 80% at 0% 0%, rgba(212,175,55,0.18) 0%, transparent 50%),
    radial-gradient(ellipse 100% 70% at 100% 100%, rgba(16,185,129,0.12) 0%, transparent 50%),
    linear-gradient(135deg, #0a0e1a 0%, #131a2e 50%, #1a2138 100%);
  border-radius: 26px;
  padding: 28px 24px 24px;
  color: #fff;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 24px 60px rgba(10,14,26,0.4),
    0 8px 20px rgba(10,14,26,0.28),
    inset 0 1px 0 rgba(212,175,55,0.25),
    inset 0 -1px 0 rgba(0,0,0,0.4);
  margin-bottom: 18px;
  border: 1px solid rgba(212,175,55,0.15);
  isolation: isolate;
}
.tg-hero::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06) 0%, transparent 1px),
    radial-gradient(circle at 60% 70%, rgba(255,255,255,0.04) 0%, transparent 1px),
    radial-gradient(circle at 85% 25%, rgba(255,255,255,0.05) 0%, transparent 1px);
  background-size: 100px 100px, 140px 140px, 180px 180px;
  pointer-events: none; opacity: 0.8;
}
.tg-hero::after {
  content: ''; position: absolute; top: -60%; right: -30%;
  width: 400px; height: 400px;
  background: conic-gradient(from 180deg, transparent 0%, rgba(212,175,55,0.08) 50%, transparent 100%);
  border-radius: 50%; pointer-events: none;
  animation: tgHeroShimmer 8s linear infinite;
}
@keyframes tgHeroShimmer {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.tg-hero-inner { position: relative; z-index: 2; }

.tg-hero-label {
  font-family: 'Manrope', sans-serif;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 2px;
  font-weight: 800; color: var(--gold);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.tg-hero-label::before {
  content: ''; width: 20px; height: 2px;
  background: linear-gradient(90deg, var(--gold), var(--gold-bright));
  border-radius: 2px;
  box-shadow: 0 0 8px rgba(212,175,55,0.6);
}
.tg-hero-amount {
  font-family: 'Manrope', sans-serif;
  font-size: 48px; font-weight: 800; letter-spacing: -2.5px; line-height: 1;
  margin-bottom: 8px;
  background: linear-gradient(180deg, #fff 0%, var(--gold-champagne) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; color: transparent;
  font-variant-numeric: tabular-nums;
  filter: drop-shadow(0 2px 12px rgba(212,175,55,0.25));
}
.tg-hero-sub {
  font-size: 12.5px; color: rgba(247,231,206,0.75);
  font-weight: 500; margin-bottom: 20px;
  display: flex; align-items: center; gap: 6px;
}
.tg-hero-sub svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; flex-shrink: 0; }

.tg-hero-progress {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 999px; overflow: hidden;
  margin-bottom: 24px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
  position: relative;
}
.tg-hero-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold-bright) 100%);
  border-radius: 999px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 16px rgba(212,175,55,0.7), inset 0 1px 0 rgba(255,255,255,0.4);
  position: relative;
}
.tg-hero-progress-fill::after {
  content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 30px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6));
  border-radius: 999px;
  animation: tgProgressPulse 2s ease-in-out infinite;
}
@keyframes tgProgressPulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}
.tg-hero-progress-fill.full {
  background: linear-gradient(90deg, var(--emerald) 0%, #34d399 100%);
  box-shadow: 0 0 16px rgba(16,185,129,0.7), inset 0 1px 0 rgba(255,255,255,0.4);
}

.tg-hero-split {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 1px; background: rgba(212,175,55,0.2);
  border-radius: 16px; overflow: hidden;
  margin-bottom: 26px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 16px rgba(0,0,0,0.2);
}
.tg-hero-cell {
  background: rgba(10,14,26,0.7);
  padding: 16px 8px; text-align: center;
  transition: background 0.2s;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.tg-hero-cell:hover { background: rgba(26,33,56,0.85); }
.tg-hero-cell-val {
  font-family: 'Manrope', sans-serif;
  font-size: 17px; font-weight: 800; letter-spacing: -0.5px;
  line-height: 1.1; font-variant-numeric: tabular-nums;
  color: #fff;
}
.tg-hero-cell-val.pending { color: var(--gold-bright); }
.tg-hero-cell-val.total { color: #34d399; }
.tg-hero-cell-label {
  font-size: 9px; color: rgba(247,231,206,0.6); font-weight: 800;
  margin-top: 6px; letter-spacing: 1px; text-transform: uppercase;
}

/* Circle Actions */
.tg-actions {
  display: flex; justify-content: center; gap: 40px; padding: 2px 0 0;
}
.tg-circle-action {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 0; border: none; background: transparent; color: #fff;
  font-family: 'Manrope', sans-serif;
  font-size: 11.5px; font-weight: 800; cursor: pointer; letter-spacing: 0.5px;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.tg-circle-icon {
  width: 62px; height: 62px; border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(212,175,55,0.25);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  position: relative;
}
.tg-circle-icon::before {
  content: ''; position: absolute; inset: -2px;
  border-radius: 50%; opacity: 0; transition: opacity 0.3s;
  background: radial-gradient(circle, rgba(212,175,55,0.3), transparent 70%);
  filter: blur(8px);
}
.tg-circle-icon svg { width: 26px; height: 26px; stroke: var(--gold-champagne); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tg-circle-action.primary .tg-circle-icon {
  background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 100%);
  border-color: var(--gold-bright);
  box-shadow: 0 8px 28px rgba(212,175,55,0.5), 0 0 0 4px rgba(212,175,55,0.12);
}
.tg-circle-action.primary .tg-circle-icon svg { stroke: var(--obsidian); stroke-width: 2.6; }
.tg-circle-action.primary .tg-circle-icon::before { opacity: 1; }
.tg-circle-action:hover .tg-circle-icon {
  transform: translateY(-4px) scale(1.08);
}
.tg-circle-action.primary:hover .tg-circle-icon {
  box-shadow: 0 12px 36px rgba(212,175,55,0.7), 0 0 0 4px rgba(212,175,55,0.18);
}
.tg-circle-action:active .tg-circle-icon { transform: scale(0.94); }

/* ═══════════ QUICK STATS ═══════════ */
.tg-quick-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 18px;
}
.tg-qs {
  background: var(--surface);
  border-radius: 18px; padding: 16px 10px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-subtle);
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}
.tg-qs::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, currentColor, transparent);
  opacity: 0.3;
}
.tg-qs:nth-child(1)::before { color: var(--amber); }
.tg-qs:nth-child(2)::before { color: var(--emerald); }
.tg-qs:nth-child(3)::before { color: var(--primary); }
.tg-qs:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--border);
}
.tg-qs-icon {
  width: 36px; height: 36px; border-radius: 12px; margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.tg-qs-icon::after {
  content: ''; position: absolute; inset: 0; border-radius: 12px;
  background: currentColor; opacity: 0.12;
}
.tg-qs-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; position: relative; z-index: 1; }
.tg-qs:nth-child(1) .tg-qs-icon { color: var(--amber); }
.tg-qs:nth-child(2) .tg-qs-icon { color: var(--emerald); }
.tg-qs:nth-child(3) .tg-qs-icon { color: var(--primary); }
.tg-qs-val {
  font-family: 'Manrope', sans-serif;
  font-size: 20px; font-weight: 800; color: var(--ink);
  line-height: 1.1; margin-bottom: 4px; font-variant-numeric: tabular-nums;
  letter-spacing: -0.4px;
}
.tg-qs-label {
  font-size: 9.5px; color: var(--ink-light); font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.8px;
}

/* ═══════════ TABS ═══════════ */
.tg-tabs {
  display: flex; background: var(--surface);
  border-radius: 16px; padding: 6px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-sm);
  position: sticky; top: 72px; z-index: 100;
  border: 1px solid var(--border-subtle);
  gap: 4px;
}
.tg-tab {
  flex: 1; padding: 12px 10px; border-radius: 12px;
  font-family: 'Manrope', sans-serif;
  font-size: 13px; font-weight: 800; color: var(--ink-muted);
  text-align: center; cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  position: relative;
}
.tg-tab.active {
  background: linear-gradient(135deg, var(--obsidian) 0%, var(--obsidian-light) 100%);
  color: var(--gold-champagne);
  box-shadow: 0 8px 24px rgba(10,14,26,0.3), inset 0 1px 0 rgba(212,175,55,0.2);
}
.tg-tab-badge {
  background: rgba(0,0,0,0.08); color: inherit;
  font-size: 10px; padding: 3px 8px; border-radius: 10px;
  font-weight: 800; min-width: 22px; transition: all 0.25s;
  font-variant-numeric: tabular-nums;
}
.tg-tab.active .tg-tab-badge {
  background: rgba(212,175,55,0.2);
  color: var(--gold-bright);
}

/* ═══════════ CARDS ═══════════ */
.tg-list { display: flex; flex-direction: column; gap: 14px; }
.tg-card {
  background: var(--surface);
  border-radius: 20px;
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.tg-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
  border-color: var(--border);
}
.tg-card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; gap: 10px;
}
.tg-card-title {
  font-family: 'Manrope', sans-serif;
  font-size: 14px; font-weight: 800; color: var(--ink);
  display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;
}
.tg-card-title-text {
  display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1;
}
.tg-card-title-text b {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-weight: 800; font-size: 14px; letter-spacing: -0.2px;
  color: var(--ink);
}
.tg-card-title-text small {
  font-size: 11px; color: var(--ink-light); font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: 'Roboto', sans-serif;
  letter-spacing: 0.2px;
}
.tg-card-avatar {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(135deg, #eef3ff 0%, #d0e2ff 100%);
  color: var(--primary); font-family: 'Manrope', sans-serif;
  font-size: 16px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 2px 6px rgba(40,116,240,0.15);
}
.tg-card-avatar.green {
  background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
  color: #15803d;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 2px 6px rgba(16,185,129,0.15);
}

.tg-badge {
  font-family: 'Manrope', sans-serif;
  font-size: 9.5px; font-weight: 800; padding: 5px 11px;
  border-radius: 999px; text-transform: uppercase; letter-spacing: 0.6px;
  white-space: nowrap; flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 5px;
}
.tg-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  box-shadow: 0 0 6px currentColor;
}
.tg-badge.pending { background: var(--amber-light); color: #b45309; border: 1px solid #fcd34d; }
.tg-badge.credited, .tg-badge.paid { background: var(--emerald-light); color: #15803d; border: 1px solid #a7f3d0; }
.tg-badge.cancelled, .tg-badge.rejected { background: var(--ruby-light); color: #b91c1c; border: 1px solid #fecaca; }
.tg-badge.approved, .tg-badge.processing { background: #e0eaff; color: #1a5dc7; border: 1px solid #c5d8fa; }

.tg-card-body { display: flex; flex-direction: column; gap: 10px; }
.tg-card-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 12.5px; gap: 10px;
}
.tg-card-row .label {
  color: var(--ink-muted); font-weight: 500; display: flex; align-items: center; gap: 8px;
}
.tg-card-row .label svg {
  width: 14px; height: 14px; stroke: var(--ink-light); fill: none; stroke-width: 2.2;
  stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
}
.tg-card-row .val { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.tg-card-row .val.mono {
  font-family: 'SF Mono', 'Consolas', monospace; font-size: 11.5px;
  letter-spacing: -0.2px;
  background: var(--surface-muted); padding: 3px 10px; border-radius: 8px;
  border: 1px solid var(--border-subtle);
  color: var(--ink-muted);
}
.tg-card-row .val.green { color: var(--emerald); }
.tg-card-row .val.blue { color: var(--primary); }

.tg-commission-line {
  background: linear-gradient(135deg, #ecfdf5 0%, var(--emerald-light) 100%);
  border: 1px solid #a7f3d0;
  border-radius: 14px; padding: 14px 18px; margin-top: 8px;
  display: flex; align-items: center; justify-content: space-between;
  position: relative; overflow: hidden;
}
.tg-commission-line::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--emerald), #34d399);
}
.tg-commission-line .label {
  color: #15803d; font-weight: 800; font-size: 12px;
  display: flex; align-items: center; gap: 8px;
  font-family: 'Manrope', sans-serif;
  letter-spacing: 0.2px;
}
.tg-commission-line .label svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.6; }
.tg-commission-line .val {
  color: #052e16; font-family: 'Manrope', sans-serif;
  font-weight: 800; font-size: 20px;
  letter-spacing: -0.6px; font-variant-numeric: tabular-nums;
}
.tg-commission-line.rejected-line {
  background: linear-gradient(135deg, #fef2f2 0%, var(--ruby-light) 100%);
  border-color: #fecaca;
}
.tg-commission-line.rejected-line::before {
  background: linear-gradient(180deg, var(--ruby), #f87171);
}
.tg-commission-line.rejected-line .label { color: #b91c1c; }
.tg-commission-line.rejected-line .val { color: #7f1d1d; }
.tg-commission-line.pending-line {
  background: linear-gradient(135deg, #fffbeb 0%, var(--amber-light) 100%);
  border-color: #fde68a;
}
.tg-commission-line.pending-line::before {
  background: linear-gradient(180deg, var(--amber), #fbbf24);
}
.tg-commission-line.pending-line .label { color: #b45309; }
.tg-commission-line.pending-line .val { color: #78350f; }

.tg-items-details {
  margin-top: 10px; padding: 14px 16px;
  background: var(--surface-muted); border-radius: 12px;
  font-size: 11.5px; color: var(--ink-muted);
  border: 1px solid var(--border-subtle);
}
.tg-items-details-title {
  font-family: 'Manrope', sans-serif;
  font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  font-weight: 800; color: var(--ink-light); margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.tg-items-details-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}
.tg-item-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 8px 0;
  border-bottom: 1px dashed var(--border-subtle);
}
.tg-item-row:last-child { border-bottom: none; padding-bottom: 0; }
.tg-item-row:first-of-type { padding-top: 0; }
.tg-item-row-name {
  flex: 1; color: var(--ink); font-weight: 600; font-size: 11.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tg-item-row-qty {
  color: var(--ink-light); font-weight: 800; font-size: 10.5px; flex-shrink: 0;
  background: var(--surface); padding: 2px 8px; border-radius: 6px;
  border: 1px solid var(--border-subtle);
  font-variant-numeric: tabular-nums;
}
.tg-item-row-comm {
  color: var(--emerald); font-family: 'Manrope', sans-serif;
  font-weight: 800; font-size: 12px; flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.tg-admin-note {
  margin-top: 12px; padding: 12px 16px;
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  border-left: 3px solid var(--amber); border-radius: 10px;
  font-size: 11.5px; color: #78350f; line-height: 1.55;
  display: flex; align-items: flex-start; gap: 8px;
}
.tg-admin-note::before { content: '💬'; flex-shrink: 0; font-size: 14px; }

/* ═══════════ EMPTY STATE ═══════════ */
.tg-empty {
  background: var(--surface); border-radius: 24px; padding: 64px 32px;
  text-align: center; box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-subtle);
  position: relative;
  overflow: hidden;
}
.tg-empty::before {
  content: ''; position: absolute; top: -50%; left: 50%;
  transform: translateX(-50%);
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(40,116,240,0.06), transparent 60%);
  pointer-events: none;
}
.tg-empty-icon {
  width: 88px; height: 88px; margin: 0 auto 22px;
  background: linear-gradient(135deg, var(--obsidian) 0%, var(--obsidian-light) 100%);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px;
  box-shadow:
    0 16px 40px rgba(10,14,26,0.25),
    inset 0 1px 0 rgba(212,175,55,0.3);
  border: 1.5px solid rgba(212,175,55,0.2);
  position: relative;
}
.tg-empty-icon::after {
  content: ''; position: absolute; inset: -4px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212,175,55,0.2), transparent 70%);
  filter: blur(12px); opacity: 0.6;
}
.tg-empty-title {
  font-family: 'Manrope', sans-serif;
  font-size: 18px; font-weight: 800; color: var(--ink);
  margin-bottom: 8px; letter-spacing: -0.3px;
}
.tg-empty-desc {
  font-size: 13px; color: var(--ink-muted); line-height: 1.6;
  margin: 0 auto; max-width: 300px;
}

/* ═══════════ SKELETON ═══════════ */
.tg-skel {
  background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 50%, #f1f5f9 100%);
  background-size: 200% 100%; animation: tgShimmer 1.4s infinite; border-radius: 10px;
}
@keyframes tgShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.tg-skel-card { padding: 20px; background: var(--surface); border-radius: 20px; margin-bottom: 14px; border: 1px solid var(--border-subtle); }
.tg-skel-line { height: 12px; margin-bottom: 12px; }
.tg-skel-line.w-70 { width: 70%; }
.tg-skel-line.w-40 { width: 40%; }
.tg-skel-line.w-90 { width: 90%; }
.tg-skel-line.h-20 { height: 20px; }

/* ═══════════ MODAL ═══════════ */
.tg-modal {
  position: fixed; inset: 0;
  background: rgba(10,14,26,0.72);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  z-index: 99999; display: none; align-items: flex-end; justify-content: center;
}
.tg-modal.show { display: flex; animation: tgFadeIn 0.22s; }
@keyframes tgFadeIn { from { opacity: 0; } to { opacity: 1; } }
.tg-modal-card {
  width: 100%; max-width: 520px;
  background: var(--surface);
  border-radius: 28px 28px 0 0;
  padding: 26px 24px 30px;
  animation: tgSlideUp 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.3);
  border: 1px solid var(--border-subtle);
  border-bottom: none;
}
@keyframes tgSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@media (min-width: 640px) {
  .tg-modal { align-items: center; }
  .tg-modal-card { border-radius: 28px; max-height: 88vh; box-shadow: 0 24px 60px rgba(0,0,0,0.4); border: 1px solid var(--border-subtle); }
}
.tg-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.tg-modal-title {
  font-family: 'Manrope', sans-serif;
  font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -0.3px;
}
.tg-modal-close {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface-muted); color: var(--ink-muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer;
  transition: all 0.15s;
  border: 1px solid var(--border-subtle);
}
.tg-modal-close:hover { background: var(--border); color: var(--ink); transform: rotate(90deg); }
.tg-modal-field { margin-bottom: 18px; }
.tg-modal-field label {
  display: block; font-family: 'Manrope', sans-serif;
  font-size: 11px; color: var(--ink-muted); font-weight: 800;
  margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.6px;
}
.tg-modal-field input {
  width: 100%; height: 50px;
  border: 1.5px solid var(--border); border-radius: 14px;
  padding: 0 18px; font-size: 14.5px; color: var(--ink);
  outline: none; background: var(--surface);
  transition: all 0.15s;
  font-family: 'Roboto', sans-serif;
  font-weight: 500;
}
.tg-modal-field input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(40,116,240,0.1);
  background: #fafbff;
}
.tg-modal-save {
  width: 100%; padding: 17px; border-radius: 14px;
  background: linear-gradient(135deg, var(--obsidian) 0%, var(--obsidian-light) 100%);
  color: var(--gold-champagne);
  font-family: 'Manrope', sans-serif;
  font-size: 15px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow:
    0 8px 24px rgba(10,14,26,0.32),
    inset 0 1px 0 rgba(212,175,55,0.2);
  cursor: pointer; transition: all 0.2s;
  margin-top: 10px;
  letter-spacing: 0.3px;
  border: 1px solid rgba(212,175,55,0.15);
  position: relative;
  overflow: hidden;
}
.tg-modal-save::before {
  content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,0.15), transparent);
  transition: left 0.6s;
}
.tg-modal-save:hover:not(:disabled)::before { left: 100%; }
.tg-modal-save:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(10,14,26,0.4), inset 0 1px 0 rgba(212,175,55,0.3);
}
.tg-modal-save:disabled { opacity: 0.7; cursor: not-allowed; }

/* Balance Box */
.tg-wd-balance-box {
  background: linear-gradient(135deg, var(--obsidian) 0%, var(--obsidian-light) 100%);
  border-radius: 18px; padding: 18px 20px; margin-bottom: 22px;
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid rgba(212,175,55,0.2);
  box-shadow: 0 8px 24px rgba(10,14,26,0.25), inset 0 1px 0 rgba(212,175,55,0.15);
  position: relative;
  overflow: hidden;
}
.tg-wd-balance-box::before {
  content: ''; position: absolute; top: -50%; right: -20%;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(212,175,55,0.18), transparent 70%);
  pointer-events: none;
}
.tg-wd-balance-label {
  font-family: 'Manrope', sans-serif;
  font-size: 10.5px; color: var(--gold);
  font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
  position: relative;
}
.tg-wd-balance-val {
  font-family: 'Manrope', sans-serif;
  font-size: 24px; font-weight: 800;
  color: var(--gold-champagne);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.6px;
  position: relative;
  filter: drop-shadow(0 2px 8px rgba(212,175,55,0.3));
}
.tg-wd-balance-box > div > div:last-child {
  color: rgba(247,231,206,0.55) !important;
  font-size: 10.5px !important;
  font-family: 'Roboto', sans-serif;
  font-weight: 500;
}

/* Method Selector */
.tg-wd-method-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
.tg-wd-method-btn {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 20px 10px 16px;
  border: 2px solid var(--border); border-radius: 18px;
  background: var(--surface); color: var(--ink-muted);
  font-family: 'Manrope', sans-serif;
  font-size: 12px; font-weight: 800;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}
.tg-wd-method-btn .tg-wd-method-circle {
  width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, #f0f5ff, #e0eaff);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.tg-wd-method-btn:hover { border-color: #c5d8fa; transform: translateY(-3px); box-shadow: var(--shadow-sm); }
.tg-wd-method-btn.active {
  border-color: var(--obsidian);
  background: linear-gradient(135deg, var(--obsidian) 0%, var(--obsidian-light) 100%);
  box-shadow: 0 8px 28px rgba(10,14,26,0.28);
}
.tg-wd-method-btn.active .tg-wd-method-circle {
  background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 100%);
  box-shadow: 0 6px 20px rgba(212,175,55,0.5);
  transform: scale(1.1);
}
.tg-wd-method-btn.active span { color: var(--gold-champagne); }

/* ═══════════ TOASTS ═══════════ */
.tg-toasts {
  position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
  z-index: 99999; display: flex; flex-direction: column; gap: 10px;
  max-width: calc(100vw - 24px); pointer-events: none;
}
.tg-toast {
  padding: 14px 24px;
  background: linear-gradient(135deg, var(--obsidian) 0%, var(--obsidian-light) 100%);
  color: #fff; font-size: 13px; border-radius: 14px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(212,175,55,0.2);
  pointer-events: auto; font-weight: 600;
  animation: tgToastIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  border: 1px solid rgba(212,175,55,0.2);
}
@keyframes tgToastIn { from { transform: translateY(24px) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
.tg-toast.success { background: linear-gradient(135deg, #064e3b 0%, #15803d 100%); border-color: rgba(52,211,153,0.3); }
.tg-toast.error { background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 100%); border-color: rgba(252,165,165,0.3); }
.tg-toast.info { background: linear-gradient(135deg, var(--obsidian) 0%, var(--primary) 100%); border-color: rgba(212,175,55,0.2); }

/* ═══════════ BOTTOM NAV ═══════════ */
.tg-bnav {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
  border-top: 1px solid var(--border-subtle); display: flex; z-index: 9999;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.06);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.tg-bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 11px 2px; gap: 5px; font-size: 9.5px; color: var(--ink-light);
  font-family: 'Manrope', sans-serif;
  font-weight: 700; transition: color 0.2s;
  letter-spacing: 0.2px;
  position: relative;
}
.tg-bnav-item.active { color: var(--primary); }
.tg-bnav-item.active::after {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 24px; height: 3px;
  background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  border-radius: 0 0 3px 3px;
}
.tg-bnav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tg-bnav-item.active svg { stroke-width: 2.4; }

/* ═══════════ RESPONSIVE ═══════════ */
@media (max-width: 520px) {
  .tg-container { padding: 14px 12px; }
  .tg-hero { padding: 24px 20px 22px; border-radius: 24px; }
  .tg-hero-amount { font-size: 42px; letter-spacing: -2px; }
  .tg-hero-cell-val { font-size: 15px; }
  .tg-circle-icon { width: 58px; height: 58px; }
  .tg-circle-icon svg { width: 24px; height: 24px; }
  .tg-qs-val { font-size: 18px; }
  .tg-card { padding: 16px; border-radius: 18px; }
  .tg-card-row { font-size: 12px; }
  .tg-modal-card { padding: 24px 20px 26px; border-radius: 24px 24px 0 0; }
  .tg-modal-title { font-size: 18px; }
  .tg-hero-label { font-size: 10px; letter-spacing: 1.6px; }
  .tg-hero-sub { font-size: 12px; }
}
</style>

<script>
(function() {
  try {
    var c = localStorage.getItem('toego_theme_colors') || sessionStorage.getItem('toego_theme_colors');
    if (!c) return;
    var t = JSON.parse(c);
    if (t && t.primary) {
      document.documentElement.style.setProperty('--primary', t.primary);
      document.documentElement.style.setProperty('--primary-dark', t.dark || t.primary);
      var m = document.getElementById('tg-theme-meta');
      if (m) m.setAttribute('content', t.primary);
    }
  } catch(e) {}
})();
</script>
</head>
<body>

<header class="tg-hd">
  <div class="tg-hd-inner">
    <a href="account.html" class="tg-hd-back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div class="tg-hd-title">My Commission</div>
  </div>
</header>

<div class="tg-wrap">
  <div class="tg-container">

    <!-- ═══ HERO ═══ -->
    <div class="tg-hero">
      <div class="tg-hero-inner">
        <div class="tg-hero-label">Available Balance</div>
        <div class="tg-hero-amount" id="tg-hero-amount">₹0</div>
        <div class="tg-hero-sub" id="tg-hero-sub">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span id="tg-hero-sub-text">Min withdraw ₹100</span>
        </div>

        <div class="tg-hero-progress">
          <div class="tg-hero-progress-fill" id="tg-hero-progress" style="width: 0%;"></div>
        </div>

        <div class="tg-hero-split">
          <div class="tg-hero-cell">
            <div class="tg-hero-cell-val" id="tg-hero-available">₹0</div>
            <div class="tg-hero-cell-label">Available</div>
          </div>
          <div class="tg-hero-cell">
            <div class="tg-hero-cell-val pending" id="tg-hero-pending">₹0</div>
            <div class="tg-hero-cell-label">Pending</div>
          </div>
          <div class="tg-hero-cell">
            <div class="tg-hero-cell-val total" id="tg-hero-total">₹0</div>
            <div class="tg-hero-cell-label">Total Earned</div>
          </div>
        </div>

        <div class="tg-actions">
          <button type="button" class="tg-circle-action primary" onclick="tgOpenWithdraw()">
            <div class="tg-circle-icon">
              <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <span>Withdraw</span>
          </button>
          <button type="button" class="tg-circle-action" onclick="tgShareRefer()">
            <div class="tg-circle-icon">
              <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
            </div>
            <span>Refer</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ═══ QUICK STATS ═══ -->
    <div class="tg-quick-stats">
      <div class="tg-qs">
        <div class="tg-qs-icon"><svg viewBox="0 0 24 24"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg></div>
        <div class="tg-qs-val" id="tg-qs-referrals">0</div>
        <div class="tg-qs-label">Referrals</div>
      </div>
      <div class="tg-qs">
        <div class="tg-qs-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <div class="tg-qs-val" id="tg-qs-withdrawn">₹0</div>
        <div class="tg-qs-label">Withdrawn</div>
      </div>
      <div class="tg-qs">
        <div class="tg-qs-icon"><svg viewBox="0 0 24 24"><path d="M6 2h12l2 6H4z"/><path d="M4 8v12h16V8"/><path d="M10 12h4"/></svg></div>
        <div class="tg-qs-val" id="tg-qs-orders">0</div>
        <div class="tg-qs-label">Orders</div>
      </div>
    </div>

    <!-- ═══ TABS ═══ -->
    <div class="tg-tabs">
      <div class="tg-tab active" data-tab="referrals" onclick="tgSwitchTab('referrals')">
        <span>Referrals</span>
        <span class="tg-tab-badge" id="tg-tab-badge-referrals">0</span>
      </div>
      <div class="tg-tab" data-tab="withdrawals" onclick="tgSwitchTab('withdrawals')">
        <span>Withdrawals</span>
        <span class="tg-tab-badge" id="tg-tab-badge-withdrawals">0</span>
      </div>
    </div>

    <!-- ═══ CONTENT ═══ -->
    <div id="tg-content">
      <div class="tg-skel-card">
        <div class="tg-skel tg-skel-line w-70"></div>
        <div class="tg-skel tg-skel-line w-40"></div>
        <div class="tg-skel tg-skel-line w-90 h-20"></div>
      </div>
      <div class="tg-skel-card">
        <div class="tg-skel tg-skel-line w-70"></div>
        <div class="tg-skel tg-skel-line w-40"></div>
      </div>
    </div>

  </div>
</div>

<!-- ═══ WITHDRAW MODAL ═══ -->
<div class="tg-modal" id="tg-withdraw-modal">
  <div class="tg-modal-card">
    <div class="tg-modal-head">
      <div class="tg-modal-title">💸 Withdraw Commission</div>
      <button class="tg-modal-close" onclick="tgCloseWithdraw()">✕</button>
    </div>

    <div class="tg-wd-balance-box">
      <div>
        <div class="tg-wd-balance-label">Available Balance</div>
        <div style="font-size:11px;color:rgba(247,231,206,0.55);margin-top:4px;">Min withdraw: <span id="tg-wd-min">₹100</span></div>
      </div>
      <div class="tg-wd-balance-val" id="tg-wd-available">₹0</div>
    </div>

    <div class="tg-modal-field">
      <label>Amount *</label>
      <input type="number" id="tg-wd-amount" placeholder="Enter amount" inputmode="numeric">
    </div>

    <div class="tg-modal-field">
      <label>Payment Method *</label>
      <div class="tg-wd-method-row">
        <button type="button" class="tg-wd-method-btn active" data-method="upi" onclick="tgPickMethod('upi', this)">
          <div class="tg-wd-method-circle">📱</div>
          <span>UPI</span>
        </button>
        <button type="button" class="tg-wd-method-btn" data-method="bank" onclick="tgPickMethod('bank', this)">
          <div class="tg-wd-method-circle">🏦</div>
          <span>Bank</span>
        </button>
      </div>
    </div>

    <div id="tg-upi-fields">
      <div class="tg-modal-field">
        <label>UPI ID *</label>
        <input type="text" id="tg-wd-upi" placeholder="yourname@upi" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>

    <div id="tg-bank-fields" style="display:none;">
      <div class="tg-modal-field">
        <label>Account Holder Name *</label>
        <input type="text" id="tg-wd-holder" placeholder="Name as per bank">
      </div>
      <div class="tg-modal-field">
        <label>Account Number *</label>
        <input type="text" id="tg-wd-accno" placeholder="Account number" inputmode="numeric">
      </div>
      <div class="tg-modal-field">
        <label>IFSC Code *</label>
        <input type="text" id="tg-wd-ifsc" placeholder="e.g. SBIN0001234" maxlength="11" style="text-transform:uppercase;" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <button class="tg-modal-save" id="tg-wd-submit" onclick="tgSubmitWithdraw()">
      Request Withdraw
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
(function() {
  'use strict';

  if (!window.__TOEGO_FB__) {
    window.__TOEGO_FB__ = firebase.initializeApp({
      apiKey: "AIzaSyAhxecFY9TwZTYbdCVRAcnp1whI-Uqc-P8",
      authDomain: "toego-ecommerce.firebaseapp.com",
      projectId: "toego-ecommerce",
      storageBucket: "toego-ecommerce.firebasestorage.app",
      messagingSenderId: "234167880880",
      appId: "1:234167880880:web:b89d4b8e5f8cc9af3c3f75"
    });
  }
  const auth = firebase.auth();
  const db = firebase.firestore();
  const FV = firebase.firestore.FieldValue;

  try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {}); } catch(e) {}
  try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch(e) {}

  let currentUser = null;
  let _redirected = false;
  let _authFirstResolve = false;

  let WALLET_DATA = { available: 0, pending: 0, totalEarned: 0, withdrawn: 0 };
  let WALLET_CONFIG = { defaultPercent: 5, minWithdraw: 100 };
  let REFERRALS = [];
  let WITHDRAWALS = [];
  let SELECTED_METHOD = 'upi';
  let CURRENT_TAB = 'referrals';

  let _unsubWallet = null;
  let _unsubReferrals = null;
  let _unsubWithdrawals = null;

  /* ═══ CACHE ═══ */
  const CACHE_TTL = 5 * 60 * 1000;
  const CACHE_PREFIX = 'tg_comm_';
  const cache = {
    set(key, data) {
      try { localStorage.setItem(CACHE_PREFIX + key, JSON.stringify({ data, ts: Date.now() })); } catch(e) {}
    },
    get(key, ttl) {
      try {
        const raw = localStorage.getItem(CACHE_PREFIX + key);
        if (!raw) return null;
        const c = JSON.parse(raw);
        if (!c || !c.ts || (Date.now() - c.ts) > (ttl || CACHE_TTL)) return null;
        return c.data;
      } catch(e) { return null; }
    }
  };

  /* ═══ UTILS ═══ */
  function toast(msg, type) {
    type = type || 'info';
    const w = document.getElementById('tg-toasts');
    if (!w) return;
    const el = document.createElement('div');
    el.className = 'tg-toast ' + type;
    el.textContent = msg;
    w.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }
  function fmtINR(n) {
    return '₹' + Number(n || 0).toLocaleString('en-IN');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function initialFromName(name) {
    if (!name) return '?';
    return String(name).trim().charAt(0).toUpperCase();
  }
  function toDateMs(ts) {
    if (!ts) return 0;
    if (typeof ts === 'number') return ts;
    if (ts.toDate && typeof ts.toDate === 'function') {
      try { return ts.toDate().getTime(); } catch(e) { return 0; }
    }
    if (ts.seconds) return ts.seconds * 1000;
    const d = new Date(ts);
    return isNaN(d.getTime()) ? 0 : d.getTime();
  }
  function fmtDate(ts) {
    const ms = toDateMs(ts);
    if (!ms) return '';
    const d = new Date(ms);
    const now = new Date();
    const diff = now.getTime() - ms;
    if (diff < 60 * 1000) return 'Just now';
    if (diff < 60 * 60 * 1000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 7 * 24 * 60 * 60 * 1000) return Math.floor(diff / 86400000) + 'd ago';
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  /* ═══ HERO UI ═══ */
  function updateHeroUI() {
    const avail = Number(WALLET_DATA.available || 0);
    const pend = Number(WALLET_DATA.pending || 0);
    const total = Number(WALLET_DATA.totalEarned || 0);
    const withdrawn = Number(WALLET_DATA.withdrawn || 0);
    const min = Number(WALLET_CONFIG.minWithdraw || 100);

    document.getElementById('tg-hero-amount').textContent = fmtINR(avail);
    document.getElementById('tg-hero-available').textContent = fmtINR(avail);
    document.getElementById('tg-hero-pending').textContent = fmtINR(pend);
    document.getElementById('tg-hero-total').textContent = fmtINR(total);

    const pct = Math.min(100, (avail / min) * 100);
    const progressEl = document.getElementById('tg-hero-progress');
    if (progressEl) {
      progressEl.style.width = pct + '%';
      progressEl.classList.toggle('full', avail >= min);
    }

    const subText = avail >= min
      ? 'Ready to withdraw! ✓'
      : fmtINR(Math.max(0, min - avail)) + ' more to withdraw';
    document.getElementById('tg-hero-sub-text').textContent = subText;

    document.getElementById('tg-qs-withdrawn').textContent = fmtINR(withdrawn);
  }

  function updateTabBadges() {
    document.getElementById('tg-tab-badge-referrals').textContent = REFERRALS.length;
    document.getElementById('tg-tab-badge-withdrawals').textContent = WITHDRAWALS.length;
    document.getElementById('tg-qs-referrals').textContent = REFERRALS.length;
  }

  /* ═══ STATUS HELPERS ═══ */
  function refStatusLabel(s) {
    s = String(s || 'pending').toLowerCase();
    return { pending: 'Pending', credited: 'Credited', approved: 'Credited', cancelled: 'Cancelled' }[s] || 'Pending';
  }
  function refStatusClass(s) {
    s = String(s || 'pending').toLowerCase();
    if (s === 'credited' || s === 'approved') return 'credited';
    if (s === 'cancelled') return 'cancelled';
    return 'pending';
  }
  function wdStatusLabel(s) {
    s = String(s || 'pending').toLowerCase();
    return { pending: 'Pending', approved: 'Approved', processing: 'Processing', paid: 'Paid', rejected: 'Rejected', cancelled: 'Cancelled' }[s] || 'Pending';
  }
  function wdStatusClass(s) {
    s = String(s || 'pending').toLowerCase();
    if (s === 'paid') return 'paid';
    if (s === 'approved' || s === 'processing') return 'approved';
    if (s === 'rejected' || s === 'cancelled') return 'rejected';
    return 'pending';
  }

  /* ═══ RENDER: REFERRALS ═══ */
  function renderReferrals() {
    const el = document.getElementById('tg-content');
    if (!REFERRALS.length) {
      el.innerHTML = '<div class="tg-empty">' +
        '<div class="tg-empty-icon">🎁</div>' +
        '<div class="tg-empty-title">No referrals yet</div>' +
        '<div class="tg-empty-desc">Share products with friends and earn commission on every order they place!</div>' +
      '</div>';
      return;
    }

    el.innerHTML = '<div class="tg-list">' + REFERRALS.map(r => {
      const buyerName = r.buyerName || 'Customer';
      const initial = initialFromName(buyerName);
      const statusCls = refStatusClass(r.status);
      const statusLbl = refStatusLabel(r.status);
      const comm = Number(r.commissionAmount || 0);
      const orderAmt = Number(r.orderAmount || 0);
      const pct = Number(r.commissionPercent || 0);
      const items = Array.isArray(r.items) ? r.items : [];

      let itemsHtml = '';
      if (items.length) {
        itemsHtml = '<div class="tg-items-details">' +
          '<div class="tg-items-details-title">Products (' + items.length + ')</div>' +
          items.map(it => {
            const nm = esc(it.name || 'Item');
            const qty = Number(it.qty || 1);
            const c = Number(it.commission || 0);
            return '<div class="tg-item-row">' +
              '<div class="tg-item-row-name">' + nm + '</div>' +
              '<div class="tg-item-row-qty">×' + qty + '</div>' +
              '<div class="tg-item-row-comm">+' + fmtINR(c) + '</div>' +
            '</div>';
          }).join('') +
        '</div>';
      }

      const lineCls = statusCls === 'cancelled' ? 'rejected-line' : statusCls === 'pending' ? 'pending-line' : '';
      const lineLabel = statusCls === 'credited'
        ? '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Commission Earned'
        : statusCls === 'cancelled'
        ? '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg> Commission Cancelled'
        : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Commission Pending';

      return '<div class="tg-card">' +
        '<div class="tg-card-head">' +
          '<div class="tg-card-title">' +
            '<div class="tg-card-avatar">' + esc(initial) + '</div>' +
            '<div class="tg-card-title-text">' +
              '<b>' + esc(buyerName) + '</b>' +
              '<small>Order #' + esc(String(r.orderId || '').slice(0, 10).toUpperCase()) + '</small>' +
            '</div>' +
          '</div>' +
          '<span class="tg-badge ' + statusCls + '">' + statusLbl + '</span>' +
        '</div>' +
        '<div class="tg-card-body">' +
          '<div class="tg-card-row">' +
            '<span class="label"><svg viewBox="0 0 24 24"><path d="M6 2h12l2 6H4z"/><path d="M4 8v12h16V8"/></svg>Order Amount</span>' +
            '<span class="val">' + fmtINR(orderAmt) + '</span>' +
          '</div>' +
          (pct ? '<div class="tg-card-row">' +
            '<span class="label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Commission Rate</span>' +
            '<span class="val blue">' + pct + '%</span>' +
          '</div>' : '') +
          '<div class="tg-card-row">' +
            '<span class="label"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Date</span>' +
            '<span class="val">' + fmtDate(r.createdAt) + '</span>' +
          '</div>' +
          itemsHtml +
        '</div>' +
        '<div class="tg-commission-line ' + lineCls + '">' +
          '<span class="label">' + lineLabel + '</span>' +
          '<span class="val">' + fmtINR(comm) + '</span>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  /* ═══ RENDER: WITHDRAWALS ═══ */
  function renderWithdrawals() {
    const el = document.getElementById('tg-content');
    if (!WITHDRAWALS.length) {
      el.innerHTML = '<div class="tg-empty">' +
        '<div class="tg-empty-icon">💸</div>' +
        '<div class="tg-empty-title">No withdrawals yet</div>' +
        '<div class="tg-empty-desc">Once your available balance reaches the minimum, you can request a withdrawal.</div>' +
      '</div>';
      return;
    }

    el.innerHTML = '<div class="tg-list">' + WITHDRAWALS.map(w => {
      const amt = Number(w.amount || 0);
      const statusCls = wdStatusClass(w.status);
      const statusLbl = wdStatusLabel(w.status);
      const method = String(w.method || 'upi').toLowerCase();

      let methodHtml = '';
      if (method === 'upi') {
        methodHtml = '<div class="tg-card-row">' +
          '<span class="label"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>UPI ID</span>' +
          '<span class="val mono">' + esc(w.upiId || '—') + '</span>' +
        '</div>';
      } else if (method === 'bank') {
        const bd = w.bankDetails || {};
        const accLast4 = String(bd.accountNumber || '').slice(-4) || '—';
        methodHtml = '<div class="tg-card-row">' +
          '<span class="label"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>Bank</span>' +
          '<span class="val">' + esc(bd.holder || '—') + ' · XXXX' + esc(accLast4) + '</span>' +
        '</div>' +
        '<div class="tg-card-row">' +
          '<span class="label"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>IFSC</span>' +
          '<span class="val mono">' + esc(bd.ifsc || '—') + '</span>' +
        '</div>';
      }

      const adminNote = w.adminNote && String(w.adminNote).trim()
        ? '<div class="tg-admin-note"><b>Admin note:</b> ' + esc(w.adminNote) + '</div>'
        : '';

      const lineCls = statusCls === 'rejected' ? 'rejected-line' : statusCls === 'pending' ? 'pending-line' : '';
      const lineLabel = statusCls === 'paid'
        ? '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Paid'
        : statusCls === 'rejected'
        ? '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg> Rejected'
        : statusCls === 'approved'
        ? '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg> Approved'
        : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Pending Review';

      return '<div class="tg-card">' +
        '<div class="tg-card-head">' +
          '<div class="tg-card-title">' +
            '<div class="tg-card-avatar green">₹</div>' +
            '<div class="tg-card-title-text">' +
              '<b>Withdrawal Request</b>' +
              '<small>' + fmtDate(w.requestedAt) + '</small>' +
            '</div>' +
          '</div>' +
          '<span class="tg-badge ' + statusCls + '">' + statusLbl + '</span>' +
        '</div>' +
        '<div class="tg-card-body">' +
          methodHtml +
          (w.processedAt ? '<div class="tg-card-row">' +
            '<span class="label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' + (statusCls === 'paid' ? 'Paid on' : statusCls === 'rejected' ? 'Rejected on' : 'Processed') + '</span>' +
            '<span class="val">' + fmtDate(w.processedAt) + '</span>' +
          '</div>' : '') +
          adminNote +
        '</div>' +
        '<div class="tg-commission-line ' + lineCls + '">' +
          '<span class="label">' + lineLabel + '</span>' +
          '<span class="val">' + fmtINR(amt) + '</span>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function renderContent() {
    if (CURRENT_TAB === 'referrals') renderReferrals();
    else renderWithdrawals();
    updateTabBadges();
  }

  window.tgSwitchTab = function(tab) {
    CURRENT_TAB = tab;
    document.querySelectorAll('.tg-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });
    renderContent();
  };

  /* ═══ PARALLEL LOADING ═══ */
  async function loadAllData() {
    if (!currentUser) return;
    const uid = currentUser.uid;

    const cachedWallet = cache.get('wallet_' + uid);
    const cachedRefs = cache.get('refs_' + uid);
    const cachedWds = cache.get('wds_' + uid);
    const cachedCfg = cache.get('cfg_' + uid);

    if (cachedCfg) {
      WALLET_CONFIG = { ...WALLET_CONFIG, ...cachedCfg };
      document.getElementById('tg-wd-min').textContent = '₹' + (WALLET_CONFIG.minWithdraw || 100);
    }
    if (cachedWallet) { WALLET_DATA = cachedWallet; updateHeroUI(); }
    if (cachedRefs && Array.isArray(cachedRefs)) {
      REFERRALS = cachedRefs;
      if (CURRENT_TAB === 'referrals') renderContent(); else updateTabBadges();
    }
    if (cachedWds && Array.isArray(cachedWds)) {
      WITHDRAWALS = cachedWds;
      if (CURRENT_TAB === 'withdrawals') renderContent(); else updateTabBadges();
    }

    loadConfigLive();
    loadWalletLive();
    loadReferralsLive();
    loadWithdrawalsLive();
    loadOrderCount();
  }

  async function loadConfigLive() {
    if (!currentUser) return;
    try {
      const snap = await db.collection('siteSettings').doc('commission').get();
      if (snap.exists) {
        WALLET_CONFIG = { defaultPercent: 5, minWithdraw: 100, ...snap.data() };
        cache.set('cfg_' + currentUser.uid, WALLET_CONFIG);
        document.getElementById('tg-wd-min').textContent = '₹' + (WALLET_CONFIG.minWithdraw || 100);
        updateHeroUI();
      }
    } catch(e) {}
  }

  function loadWalletLive() {
    if (!currentUser) return;
    if (_unsubWallet) { try { _unsubWallet(); } catch(e) {} }
    const uid = currentUser.uid;
    _unsubWallet = db.collection('users').doc(uid).collection('wallet').doc('summary')
      .onSnapshot(snap => {
        WALLET_DATA = snap.exists ? snap.data() : { available: 0, pending: 0, totalEarned: 0, withdrawn: 0 };
        cache.set('wallet_' + uid, WALLET_DATA);
        updateHeroUI();
      }, () => {});
  }

  function loadReferralsLive() {
    if (!currentUser) return;
    if (_unsubReferrals) { try { _unsubReferrals(); } catch(e) {} }
    const uid = currentUser.uid;
    _unsubReferrals = db.collection('referrals').where('referrerId', '==', uid).orderBy('createdAt', 'desc').limit(50)
      .onSnapshot(snap => {
        REFERRALS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        cache.set('refs_' + uid, REFERRALS);
        if (CURRENT_TAB === 'referrals') renderContent(); else updateTabBadges();
      }, () => {
        db.collection('referrals').where('referrerId', '==', uid).limit(50).get()
          .then(s => {
            REFERRALS = s.docs.map(d => ({ id: d.id, ...d.data() }));
            REFERRALS.sort((a, b) => toDateMs(b.createdAt) - toDateMs(a.createdAt));
            cache.set('refs_' + uid, REFERRALS);
            if (CURRENT_TAB === 'referrals') renderContent(); else updateTabBadges();
          }).catch(() => {});
      });
  }

  function loadWithdrawalsLive() {
    if (!currentUser) return;
    if (_unsubWithdrawals) { try { _unsubWithdrawals(); } catch(e) {} }
    const uid = currentUser.uid;
    _unsubWithdrawals = db.collection('withdrawals').where('userId', '==', uid).orderBy('requestedAt', 'desc').limit(50)
      .onSnapshot(snap => {
        WITHDRAWALS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        cache.set('wds_' + uid, WITHDRAWALS);
        if (CURRENT_TAB === 'withdrawals') renderContent(); else updateTabBadges();
      }, () => {
        db.collection('withdrawals').where('userId', '==', uid).limit(50).get()
          .then(s => {
            WITHDRAWALS = s.docs.map(d => ({ id: d.id, ...d.data() }));
            WITHDRAWALS.sort((a, b) => toDateMs(b.requestedAt) - toDateMs(a.requestedAt));
            cache.set('wds_' + uid, WITHDRAWALS);
            if (CURRENT_TAB === 'withdrawals') renderContent(); else updateTabBadges();
          }).catch(() => {});
      });
  }

  function loadOrderCount() {
    if (!currentUser) return;
    const cached = cache.get('ordercount_' + currentUser.uid);
    if (cached != null) document.getElementById('tg-qs-orders').textContent = cached;

    db.collection('orders').where('customerId', '==', currentUser.uid).limit(200).get()
      .then(s => {
        document.getElementById('tg-qs-orders').textContent = s.size;
        cache.set('ordercount_' + currentUser.uid, s.size);
      })
      .catch(() => {
        db.collection('orders').where('userId', '==', currentUser.uid).limit(200).get()
          .then(s => {
            document.getElementById('tg-qs-orders').textContent = s.size;
            cache.set('ordercount_' + currentUser.uid, s.size);
          }).catch(() => {});
      });
  }

  /* ═══ WITHDRAW MODAL ═══ */
  window.tgOpenWithdraw = async function() {
    if (!currentUser) { toast('Please log in first', 'error'); return; }
    const avail = Number(WALLET_DATA.available || 0);
    const min = Number(WALLET_CONFIG.minWithdraw || 100);
    if (avail < min) { toast('Minimum ₹' + min + ' required. Balance: ' + fmtINR(avail), 'error'); return; }

    document.getElementById('tg-wd-available').textContent = fmtINR(avail);
    document.getElementById('tg-wd-amount').value = avail;
    document.getElementById('tg-wd-upi').value = '';
    document.getElementById('tg-wd-holder').value = '';
    document.getElementById('tg-wd-accno').value = '';
    document.getElementById('tg-wd-ifsc').value = '';
    SELECTED_METHOD = 'upi';
    document.querySelectorAll('.tg-wd-method-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.method === 'upi');
    });
    document.getElementById('tg-upi-fields').style.display = 'block';
    document.getElementById('tg-bank-fields').style.display = 'none';
    document.getElementById('tg-withdraw-modal').classList.add('show');
    document.body.style.overflow = 'hidden';
  };

  window.tgCloseWithdraw = function() {
    document.getElementById('tg-withdraw-modal').classList.remove('show');
    document.body.style.overflow = '';
  };

  window.tgPickMethod = function(method, el) {
    SELECTED_METHOD = method;
    document.querySelectorAll('.tg-wd-method-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.method === method);
    });
    document.getElementById('tg-upi-fields').style.display = method === 'upi' ? 'block' : 'none';
    document.getElementById('tg-bank-fields').style.display = method === 'bank' ? 'block' : 'none';
  };

  window.tgSubmitWithdraw = async function() {
    if (!currentUser) return;
    const amt = Number(document.getElementById('tg-wd-amount').value || 0);
    const avail = Number(WALLET_DATA.available || 0);
    const min = Number(WALLET_CONFIG.minWithdraw || 100);
    if (amt < min) return toast('Minimum ' + fmtINR(min), 'error');
    if (amt > avail) return toast('Amount exceeds available balance', 'error');

    let payload = {};
    if (SELECTED_METHOD === 'upi') {
      const upi = (document.getElementById('tg-wd-upi').value || '').trim();
      if (!upi || !/^[\w.\-]{2,}@[\w]{2,}$/.test(upi)) return toast('Valid UPI ID daalo', 'error');
      payload = { method: 'upi', upiId: upi };
    } else {
      const holder = (document.getElementById('tg-wd-holder').value || '').trim();
      const accno = (document.getElementById('tg-wd-accno').value || '').trim();
      const ifsc = (document.getElementById('tg-wd-ifsc').value || '').trim().toUpperCase();
      if (!holder) return toast('Account holder name required', 'error');
      if (!accno || accno.length < 6) return toast('Valid account number required', 'error');
      if (!ifsc || ifsc.length !== 11) return toast('Valid 11-character IFSC required', 'error');
      payload = { method: 'bank', bankDetails: { holder, accountNumber: accno, ifsc } };
    }

    const btn = document.getElementById('tg-wd-submit');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      await db.runTransaction(async (tx) => {
        const wRef = db.collection('users').doc(currentUser.uid).collection('wallet').doc('summary');
        const wSnap = await tx.get(wRef);
        const curAvail = Number(wSnap.data()?.available || 0);
        if (curAvail < amt) throw new Error('Insufficient balance');
        tx.set(wRef, {
          available: curAvail - amt,
          pending: Number(wSnap.data()?.pending || 0) + amt,
          updatedAt: FV.serverTimestamp()
        }, { merge: true });
        tx.set(db.collection('withdrawals').doc(), {
          userId: currentUser.uid,
          userName: currentUser.displayName || (currentUser.email || '').split('@')[0] || 'User',
          userEmail: currentUser.email || '',
          amount: amt,
          ...payload,
          status: 'pending',
          requestedAt: FV.serverTimestamp(),
          adminNote: '',
          processedAt: null
        });
        tx.set(db.collection('wallet_transactions').doc(), {
          userId: currentUser.uid,
          type: 'withdraw_request',
          amount: amt,
          note: 'Withdrawal via ' + (payload.method === 'upi' ? 'UPI: ' + payload.upiId : 'Bank: ' + payload.bankDetails.accountNumber.slice(-4)),
          status: 'pending',
          createdAt: FV.serverTimestamp()
        });
      });
      toast('✅ Withdraw request submitted!', 'success');
      tgCloseWithdraw();
    } catch (err) {
      toast(err.message || 'Failed to submit', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Request Withdraw';
    }
  };

  /* ═══ SHARE REFERRAL ═══ */
  window.tgShareRefer = function() {
    if (!currentUser) return;
    const code = 'TOE' + currentUser.uid.slice(0, 6).toUpperCase();
    const url = window.location.origin + '/shop-home.html?ref=' + currentUser.uid;
    const msg = '🛍️ Shop on TOEGO and get ₹100 OFF your first order!\n\nUse my referral link:\n' + url + '\n\nCode: ' + code;
    if (navigator.share) {
      navigator.share({ title: 'TOEGO Referral', text: msg, url }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(msg).then(() => toast('Referral link copied ✓', 'success')).catch(() => toast('Copy failed', 'error'));
    } else {
      toast('Referral: ' + code, 'info');
    }
  };

  /* ═══ AUTH ═══ */
  auth.onAuthStateChanged((user) => {
    if (user) {
      _authFirstResolve = true;
      if (currentUser && currentUser.uid === user.uid) return;
      currentUser = user;
      loadAllData();
    } else {
      if (!_authFirstResolve) {
        _authFirstResolve = true;
        setTimeout(() => {
          if (auth.currentUser) return;
          if (!_redirected) { _redirected = true; window.location.replace('log-in.html?redirect=' + encodeURIComponent('commission.html')); }
        }, 300);
      } else {
        if (!_redirected) { _redirected = true; window.location.replace('log-in.html?redirect=' + encodeURIComponent('commission.html')); }
      }
    }
  });

  if (auth.currentUser) {
    currentUser = auth.currentUser;
    loadAllData();
  }

  document.querySelectorAll('.tg-modal').forEach(m => {
    m.addEventListener('click', (e) => {
      if (e.target === m) {
        m.classList.remove('show');
        document.body.style.overflow = '';
      }
    });
  });

})();
</script>
</body>
</html>
