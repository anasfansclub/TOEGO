<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login — TOEGO</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link rel="preconnect" href="https://accounts.google.com">
<meta name="theme-color" content="#2874f0" id="tg-theme-meta">
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0!important;padding:0!important;width:100%!important;max-width:100vw;overflow-x:hidden;min-height:100vh;font-family:'Roboto',Arial,sans-serif;color:#212121;background:#f1f3f6;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font:inherit;}
a{color:inherit;text-decoration:none;}
header#top,#top_menu,nav.o_main_navbar,.o_main_navbar,footer#bottom,.o_footer,#footer,.o_breadcrumb,.breadcrumb{display:none!important;}
.tg-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#f1f3f6;}
.tg-card{width:100%;max-width:720px;background:#fff;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.10);display:flex;overflow:hidden;}
.tg-left{flex:0 0 40%;max-width:40%;background:#2874f0;color:#fff;padding:34px 30px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.tg-left::after{content:'';position:absolute;bottom:-80px;left:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%);border-radius:50%;}
.tg-left-logo{font-weight:900;font-style:italic;font-size:24px;letter-spacing:-0.4px;position:relative;z-index:2;}
.tg-left-logo span{color:#ffe500;}
.tg-left-content{position:relative;z-index:2;margin-top:auto;margin-bottom:auto;padding:24px 0;}
.tg-left-title{font-size:26px;font-weight:500;line-height:1.15;margin:0 0 12px;}
.tg-left-sub{font-size:14px;line-height:1.5;opacity:0.88;margin:0;max-width:260px;}
.tg-left-foot{font-size:11px;opacity:0.7;position:relative;z-index:2;}
.tg-right{flex:1 1 auto;padding:36px 42px 32px;display:flex;flex-direction:column;justify-content:center;}
.tg-field{position:relative;margin-bottom:24px;}
.tg-field input{width:100%;height:42px;border:none;border-bottom:1px solid #d4d5d9;background:transparent;font-size:15px;color:#212121;padding:6px 0 8px;outline:none;border-radius:0;}
.tg-field input:focus{border-bottom-color:#2874f0;}
.tg-field label{position:absolute;left:0;top:12px;font-size:15px;color:#878787;pointer-events:none;transition:all .18s;background:#fff;padding:0 4px;margin-left:-4px;}
.tg-field input:focus+label,.tg-field input:not(:placeholder-shown)+label,.tg-field input.filled+label{top:-7px;font-size:12px;color:#2874f0;}
.tg-field-pass{position:relative;}
.tg-pass-toggle{position:absolute;right:0;top:10px;font-size:12.5px;color:#2874f0;font-weight:600;padding:4px 0;}
.tg-terms{font-size:11.5px;color:#878787;line-height:1.55;margin:4px 0 20px;}
.tg-terms a{color:#2874f0;font-weight:500;}
.tg-submit{width:100%;padding:14px 16px;border-radius:3px;font-size:15px;font-weight:700;color:#fff;background:#fb641b;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,0.15);}
.tg-submit:hover{filter:brightness(1.05);}
.tg-submit:disabled{opacity:0.75;cursor:not-allowed;}
.tg-submit.loading{pointer-events:none;}
.tg-spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:tgSpin .7s linear infinite;display:none;}
@keyframes tgSpin{to{transform:rotate(360deg);}}
.tg-submit.loading .tg-spinner{display:block;}
.tg-div{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:#999;font-size:11px;text-transform:uppercase;font-weight:500;}
.tg-div::before,.tg-div::after{content:'';flex:1;height:1px;background:#e5e7eb;}
.tg-alt-btn{width:100%;padding:12px 16px;border-radius:3px;background:#fff;border:1px solid #d4d5d9;font-size:14px;font-weight:600;color:#2874f0;display:flex;align-items:center;justify-content:center;gap:10px;}
.tg-alt-btn svg{width:18px;height:18px;flex-shrink:0;}
.tg-alt-btn.loading{pointer-events:none;opacity:0.75;}
.tg-forgot-row{text-align:right;margin:-12px 0 18px;}
.tg-forgot{font-size:13px;color:#2874f0;font-weight:600;}
.tg-mode{text-align:center;margin-top:20px;font-size:13.5px;color:#878787;}
.tg-mode button{color:#2874f0;font-weight:700;margin-left:4px;}
.tg-field-name{display:none;}
.tg-card.signup .tg-field-name{display:block;}
.tg-card.signup .tg-forgot-row{display:none;}
.tg-toasts{position:fixed;top:20px;right:20px;z-index:999999;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 40px);pointer-events:none;}
.tg-toast{padding:13px 18px;border-radius:4px;background:#212121;color:#fff;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,0.25);pointer-events:auto;animation:tgToastIn .25s;max-width:380px;line-height:1.4;}
@keyframes tgToastIn{from{transform:translateX(130%);opacity:0;}to{transform:translateX(0);opacity:1;}}
.tg-toast.success{background:#388e3c;}
.tg-toast.error{background:#d32f2f;}
.tg-toast.info{background:#2874f0;}
.tg-auth-loading{position:fixed;inset:0;background:#fff;z-index:99999998;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;}
.tg-auth-loading.show{display:flex;}
.tg-auth-loading-logo{font-weight:900;font-style:italic;font-size:32px;color:#2874f0;margin-bottom:8px;}
.tg-auth-loading-logo span{color:#ffe500;}
.tg-auth-loading-spinner{width:48px;height:48px;border:4px solid #e0e0e0;border-top-color:#2874f0;border-radius:50%;animation:tgSpin .8s linear infinite;}
.tg-auth-loading-text{font-size:15px;color:#666;font-weight:500;text-align:center;padding:0 20px;line-height:1.5;}
.tg-auth-loading-check{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;margin-bottom:6px;animation:tgCheckPop .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 12px 40px rgba(34,197,94,0.4);}
@keyframes tgCheckPop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
.tg-auth-loading-check svg{width:38px;height:38px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:tgCheckDraw .3s .1s ease forwards;}
@keyframes tgCheckDraw{to{stroke-dashoffset:0;}}
.tg-modal{position:fixed;inset:0;background:rgba(15,23,41,0.6);backdrop-filter:blur(4px);z-index:999999999;display:none;align-items:center;justify-content:center;padding:20px;}
.tg-modal.show{display:flex;}
.tg-modal-box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:32px 28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.tg-modal-icon{width:72px;height:72px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;}
.tg-modal-icon.warn{background:linear-gradient(135deg,#fff3e0,#ffe0b2);color:#f57c00;}
.tg-modal-icon.error{background:linear-gradient(135deg,#ffebee,#ffcdd2);color:#d32f2f;}
.tg-modal-icon.info{background:linear-gradient(135deg,#e3f2fd,#bbdefb);color:#1565c0;}
.tg-modal-icon.success{background:linear-gradient(135deg,#e6f7ec,#c8e6c9);color:#1b8a3a;}
.tg-modal-title{font-size:19px;font-weight:800;color:#212121;margin:0 0 10px;line-height:1.3;}
.tg-modal-desc{font-size:14px;color:#666;line-height:1.55;margin:0 0 22px;}
.tg-modal-desc b{color:#212121;font-weight:700;word-break:break-word;}
.tg-modal-actions{display:flex;gap:10px;flex-direction:column;}
.tg-modal-btn{padding:13px 20px;border-radius:10px;font-size:14.5px;font-weight:800;display:flex;align-items:center;justify-content:center;width:100%;}
.tg-modal-btn.primary{background:linear-gradient(135deg,#2874f0,#1a5dc7);color:#fff;}
.tg-modal-btn.orange{background:linear-gradient(135deg,#fb641b,#e65100);color:#fff;}
.tg-modal-btn.danger{background:linear-gradient(135deg,#d32f2f,#b71c1c);color:#fff;}
.tg-modal-btn.ghost{background:#f1f3f6;color:#212121;}
@media (max-width:720px){.tg-wrap{padding:16px 12px;align-items:flex-start;padding-top:28px;}.tg-card{max-width:100%;flex-direction:column;}.tg-left{flex:0 0 auto;max-width:100%;padding:22px 24px 20px;}.tg-left-content{margin:8px 0 0;padding:0;}.tg-left-title{font-size:19px;}.tg-left-sub{font-size:12.5px;max-width:100%;}.tg-left-foot{display:none;}.tg-right{padding:26px 24px 28px;}.tg-toasts{top:12px;right:12px;left:12px;max-width:none;align-items:stretch;}.tg-toast{max-width:none;}}
</style>
</head>
<body>

<div class="tg-auth-loading" id="tg-auth-loading">
  <div class="tg-auth-loading-logo">TOE<span>GO</span></div>
  <div class="tg-auth-loading-spinner" id="tg-auth-loading-spinner"></div>
  <div class="tg-auth-loading-check" id="tg-auth-loading-check" style="display:none;">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <div class="tg-auth-loading-text" id="tg-auth-loading-text">Signing you in…</div>
</div>

<div class="tg-modal" id="tg-modal">
  <div class="tg-modal-box">
    <div class="tg-modal-icon" id="tg-modal-icon">!</div>
    <h3 class="tg-modal-title" id="tg-modal-title">Title</h3>
    <p class="tg-modal-desc" id="tg-modal-desc"></p>
    <div class="tg-modal-actions">
      <button class="tg-modal-btn primary" id="tg-modal-primary">OK</button>
      <button class="tg-modal-btn ghost" id="tg-modal-secondary" style="display:none;">Cancel</button>
    </div>
  </div>
</div>

<div class="tg-toasts" id="tg-toasts"></div>

<div class="tg-wrap" id="tg-wrap">
  <div class="tg-card" id="tg-card">
    <aside class="tg-left" id="tg-left">
      <div class="tg-left-logo">TOE<span>GO</span></div>
      <div class="tg-left-content">
        <h1 class="tg-left-title" id="tg-left-title">Login</h1>
        <p class="tg-left-sub" id="tg-left-sub">Get access to your Orders, Wishlist and Recommendations</p>
      </div>
      <div class="tg-left-foot">© 2025 TOEGO.com</div>
    </aside>
    <main class="tg-right">
      <form id="tg-form" autocomplete="on" novalidate>
        <div class="tg-field tg-field-name">
          <input type="text" name="name" id="tg-name" placeholder=" " autocomplete="name" maxlength="60">
          <label for="tg-name">Enter Full Name</label>
        </div>
        <div class="tg-field">
          <input type="email" name="email" id="tg-email" placeholder=" " autocomplete="email" required>
          <label for="tg-email">Enter Email</label>

        <div class="tg-field tg-field-pass">
          <input type="password" name="password" id="tg-password" placeholder=" " autocomplete="current-password" required minlength="6">
          <label for="tg-password">Enter Password</label>
          <button type="button" class="tg-pass-toggle" id="tg-toggle-pass">Show</button>
        </div>
        <div class="tg-forgot-row" id="tg-forgot-row">
          <a href="#" class="tg-forgot" id="tg-forgot">Forgot Password?</a>
        </div>
        <div class="tg-terms">By continuing, you agree to TOEGO's <a href="terms.html">Terms of Use</a>.</div>
        <button type="submit" class="tg-submit" id="tg-submit">
          <span class="tg-spinner"></span>
          <span id="tg-submit-text">Login</span>
        </button>
        <div class="tg-div">or</div>
        <button type="button" class="tg-alt-btn" id="tg-google">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
          <span id="tg-google-text">Continue with Google</span>
        </button>
        <div class="tg-mode">
          <span id="tg-mode-label">New to TOEGO?</span>
          <button type="button" id="tg-mode-switch">Create an account</button>
        </div>
      </form>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
(function() {
  'use strict';

  /* ═══════════════════════════════════════════════════════════════
     CONSTANTS
     ═══════════════════════════════════════════════════════════════ */
  const API_KEY = "AIzaSyAhxecFY9TwZTYbdCVRAcnp1whI-Uqc-P8";
  const PROJECT_ID = "toego-ecommerce";
  const REDIRECT_URL = 'shop-home.html';
  const AUTH_CACHE_KEY = 'toego_auth_cache';
  const SESSION_KEY = 'toego_session_v2';
  const GOOGLE_PENDING_KEY = 'tg_google_pending';
  const LOGIN_SUCCESS_KEY = 'tg_login_success';

  const REST_SIGNUP = `https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${API_KEY}`;
  const REST_LOGIN = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`;
  const REST_RESET = `https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=${API_KEY}`;
  const REST_PROFILE = `https://identitytoolkit.googleapis.com/v1/accounts:update?key=${API_KEY}`;

  /* ═══════════════════════════════════════════════════════════════
     SAFE STORAGE
     ═══════════════════════════════════════════════════════════════ */
  const _mem = new Map();
  function safeGet(k) {
    try { const v = localStorage.getItem(k); if (v) return v; } catch(e) {}
    try { const v = sessionStorage.getItem(k); if (v) return v; } catch(e) {}
    return _mem.get(k) ?? null;
  }
  function safeSet(k, v) {
    try { localStorage.setItem(k, v); } catch(e) {}
    try { sessionStorage.setItem(k, v); } catch(e) {}
    _mem.set(k, v);
  }
  function safeRemove(k) {
    try { localStorage.removeItem(k); } catch(e) {}
    try { sessionStorage.removeItem(k); } catch(e) {}
    _mem.delete(k);
  }

  /* ═══════════════════════════════════════════════════════════════
     GOOGLE PENDING HELPERS
     ═══════════════════════════════════════════════════════════════ */
  function setPendingGoogle() { safeSet(GOOGLE_PENDING_KEY, String(Date.now())); }
  function clearPendingGoogle() { safeRemove(GOOGLE_PENDING_KEY); }
  function isPendingGoogle() {
    try {
      const v = safeGet(GOOGLE_PENDING_KEY);
      if (!v) return false;
      const ts = Number(v);
      if (!ts || isNaN(ts) || Date.now() - ts > 5 * 60 * 1000) { clearPendingGoogle(); return false; }
      return true;
    } catch(e) { return false; }
  }

  function markLoginSuccess(name) {
    const data = JSON.stringify({ name: name || 'User', ts: Date.now() });
    safeSet(LOGIN_SUCCESS_KEY, data);
  }

  /* ═══════════════════════════════════════════════════════════════
     REST ERROR MAPPER
     ═══════════════════════════════════════════════════════════════ */
  function mapRestError(msg) {
    msg = String(msg || '').toUpperCase();
    if (msg.includes('EMAIL_EXISTS')) return 'auth/email-already-in-use';
    if (msg.includes('EMAIL_NOT_FOUND')) return 'auth/user-not-found';
    if (msg.includes('INVALID_PASSWORD')) return 'auth/wrong-password';
    if (msg.includes('INVALID_LOGIN_CREDENTIALS')) return 'auth/wrong-password';
    if (msg.includes('INVALID_EMAIL')) return 'auth/invalid-email';
    if (msg.includes('USER_DISABLED')) return 'auth/user-disabled';
    if (msg.includes('TOO_MANY_ATTEMPTS')) return 'auth/too-many-requests';
    if (msg.includes('WEAK_PASSWORD')) return 'auth/weak-password';
    if (msg.includes('OPERATION_NOT_ALLOWED')) return 'auth/operation-not-allowed';
    return 'auth/unknown';
  }

  /* ═══════════════════════════════════════════════════════════════
     REST API CALLS
     ═══════════════════════════════════════════════════════════════ */
  async function restCall(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) {
      const msg = (data && data.error && data.error.message) || 'UNKNOWN';
      throw { code: mapRestError(msg), message: msg };
    }
    return data;
  }
  async function restSignup(email, password) { return restCall(REST_SIGNUP, { email, password, returnSecureToken: true }); }
  async function restLogin(email, password) { return restCall(REST_LOGIN, { email, password, returnSecureToken: true }); }
  async function restReset(email) { return restCall(REST_RESET, { requestType: 'PASSWORD_RESET', email }); }
  async function updateProfileRest(idToken, displayName) {
    try { await restCall(REST_PROFILE, { idToken, displayName, returnSecureToken: false }); } catch(e) {}
  }

  /* ═══════════════════════════════════════════════════════════════
     SAVE USER DOC — Both SDK and REST
     ═══════════════════════════════════════════════════════════════ */
  async function saveUserDocREST(idToken, uid, email, name, photoURL) {
    if (!idToken || !uid) return;
    try {
      const docUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/users/${uid}`;
      const now = new Date().toISOString();
      const fields = {
        uid: { stringValue: String(uid) },
        email: { stringValue: String(email || '') },
        name: { stringValue: String(name || (email || '').split('@')[0] || 'User') },
        role: { stringValue: 'customer' },
        lastLogin: { timestampValue: now }
      };
      if (photoURL) fields.photoURL = { stringValue: String(photoURL) };

      const checkRes = await fetch(docUrl + '?mask.fieldPaths=uid', {
        headers: { 'Authorization': 'Bearer ' + idToken }
      });

      if (checkRes.ok) {
        const params = '?updateMask.fieldPaths=name&updateMask.fieldPaths=lastLogin' + (photoURL ? '&updateMask.fieldPaths=photoURL' : '');
        await fetch(docUrl + params, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
          body: JSON.stringify({ fields })
        });
      } else {
        fields.createdAt = { timestampValue: now };
        await fetch(docUrl, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
          body: JSON.stringify({ fields })
        });
      }
      console.log('[userdoc] saved via REST ✓');
    } catch(e) { console.warn('[userdoc] REST failed:', e); }
  }

  async function saveUserDocSDK(user, name, photoURL) {
    try {
      const ref = db.collection('users').doc(user.uid);
      const snap = await ref.get();
      const data = {
        uid: user.uid,
        email: user.email || '',
        name: name || user.displayName || (user.email || '').split('@')[0] || 'User',
        role: 'customer',
        lastLogin: FV.serverTimestamp()
      };
      if (photoURL || user.photoURL) data.photoURL = photoURL || user.photoURL;
      if (!snap.exists) {
        data.createdAt = FV.serverTimestamp();
        await ref.set(data);
      } else {
        await ref.update(data);
      }
      console.log('[userdoc] saved via SDK ✓');
    } catch(e) {
      console.warn('[userdoc] SDK failed:', e && e.code);
    }
  }

  /* ═══════════════════════════════════════════════════════════════
     FIREBASE INIT
     ═══════════════════════════════════════════════════════════════ */
  let auth, db, FV;
  try {
    if (!window.__TOEGO_FB__) {
      window.__TOEGO_FB__ = firebase.initializeApp({
        apiKey: API_KEY,
        authDomain: PROJECT_ID + ".firebaseapp.com",
        projectId: PROJECT_ID,
        storageBucket: PROJECT_ID + ".firebasestorage.app",
        messagingSenderId: "234167880880",
        appId: "1:234167880880:web:b89d4b8e5f8cc9af3c3f75"
      });
    }
    auth = firebase.auth();
    db = firebase.firestore();
    FV = firebase.firestore.FieldValue;
  } catch(e) { console.error('[init]', e); }

  /* Persistence — LOCAL with SESSION fallback (better than NONE) */
  try {
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .catch(() => auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(() => {}));
  } catch(e) {}

  /* ═══════════════════════════════════════════════════════════════
     SHOW LOADING IF GOOGLE PENDING (legacy safety — no-op now)
     ═══════════════════════════════════════════════════════════════ */
  if (isPendingGoogle()) {
    document.getElementById('tg-auth-loading').classList.add('show');
    document.getElementById('tg-wrap').style.display = 'none';
    document.body.style.overflow = 'hidden';
  }

  /* ═══════════════════════════════════════════════════════════════
     UI HELPERS
     ═══════════════════════════════════════════════════════════════ */
  function toast(msg, type) {
    type = type || 'info';
    const w = document.getElementById('tg-toasts');
    if (!w || !msg) return;
    const el = document.createElement('div');
    el.className = 'tg-toast ' + type;
    el.textContent = msg;
    w.appendChild(el);
    setTimeout(() => { el.style.transition = 'transform .3s, opacity .3s'; el.style.transform = 'translateX(130%)'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2500);
  }

  function showAuthLoading(text, showCheck) {
    const el = document.getElementById('tg-auth-loading');
    const txt = document.getElementById('tg-auth-loading-text');
    const spinner = document.getElementById('tg-auth-loading-spinner');
    const check = document.getElementById('tg-auth-loading-check');
    if (txt) txt.textContent = text || 'Signing you in…';
    if (showCheck) { if (spinner) spinner.style.display = 'none'; if (check) check.style.display = 'flex'; }
    else { if (spinner) spinner.style.display = 'block'; if (check) check.style.display = 'none'; }
    if (el) el.classList.add('show');
    const wrap = document.getElementById('tg-wrap');
    if (wrap) wrap.style.display = 'none';
    document.body.style.overflow = 'hidden';
  }
  function hideAuthLoading() {
    const el = document.getElementById('tg-auth-loading');
    if (el) el.classList.remove('show');
    const wrap = document.getElementById('tg-wrap');
    if (wrap) wrap.style.display = '';
    document.body.style.overflow = '';
  }

  /* ═══ MODAL ═══ */
  const modal = document.getElementById('tg-modal');
  const modalIcon = document.getElementById('tg-modal-icon');
  const modalTitle = document.getElementById('tg-modal-title');
  const modalDesc = document.getElementById('tg-modal-desc');
  const modalPrimary = document.getElementById('tg-modal-primary');
  const modalSecondary = document.getElementById('tg-modal-secondary');
  let _modalCb = null;
  function showModal(opts) {
    opts = opts || {};
    const type = opts.type || 'info';
    const icons = { warn: '!', error: '✕', info: 'i', success: '✓' };
    modalIcon.className = 'tg-modal-icon ' + type;
    modalIcon.textContent = icons[type] || '!';
    modalTitle.textContent = opts.title || 'Notice';
    modalDesc.innerHTML = opts.desc || '';
    modalPrimary.innerHTML = opts.primaryText || 'OK';
    modalPrimary.className = 'tg-modal-btn ' + (type === 'error' ? 'danger' : type === 'warn' ? 'orange' : 'primary');
    _modalCb = opts.onPrimary || null;
    if (opts.secondaryText) {
      modalSecondary.style.display = 'flex';
      modalSecondary.textContent = opts.secondaryText;
      modalSecondary.onclick = function() { closeModal(); if (opts.onSecondary) opts.onSecondary(); };
    } else { modalSecondary.style.display = 'none'; }
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() { modal.classList.remove('show'); document.body.style.overflow = ''; _modalCb = null; }
  modalPrimary.addEventListener('click', function() { const cb = _modalCb; closeModal(); if (cb) cb(); });
  modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });

  /* ═══ ERROR HANDLER ═══ */
  function showError(err) {
    const code = (err && err.code) || 'unknown';
    console.warn('[auth-error]', code, err && err.message);
    if (code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') return;
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') return;
    if (code === 'auth/no-auth-event') return;

    if (code === 'auth/email-already-in-use') {
      showModal({ type: 'warn', title: 'Already Registered', desc: 'Ye email pehle se registered hai.<br><br>Login karein?', primaryText: 'Yes, Login', secondaryText: 'Different Email', onPrimary: () => { if (mode !== 'login') setMode('login'); passwordInput.value = ''; passwordInput.focus(); }, onSecondary: () => { emailInput.focus(); emailInput.select(); } });
      return;
    }
    if (code === 'auth/weak-password') { showModal({ type: 'warn', title: 'Weak Password', desc: 'Password kam se kam <b>6 characters</b>.', primaryText: 'OK', onPrimary: () => { passwordInput.focus(); passwordInput.select(); } }); return; }
    if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') {
      showModal({ type: 'error', title: 'Incorrect Password', desc: 'Email sahi hai lekin <b>password galat</b> hai.', primaryText: 'Try Again', secondaryText: 'Reset Password', onPrimary: () => { passwordInput.focus(); passwordInput.select(); }, onSecondary: () => doForgotPassword() });
      return;
    }
    if (code === 'auth/user-not-found') { showModal({ type: 'warn', title: 'Account Not Found', desc: 'Is email se koi account nahi mila.', primaryText: 'Create Account', secondaryText: 'Try Different', onPrimary: () => setMode('signup'), onSecondary: () => { emailInput.focus(); emailInput.select(); } }); return; }
    if (code === 'auth/invalid-email') { showModal({ type: 'warn', title: 'Invalid Email', desc: 'Valid email address daalo.', primaryText: 'OK', onPrimary: () => { emailInput.focus(); emailInput.select(); } }); return; }
    if (code === 'auth/network-request-failed') { showModal({ type: 'error', title: 'No Internet', desc: 'Network connection check karo.', primaryText: 'Retry', onPrimary: () => submitBtn.click() }); return; }
    if (code === 'auth/too-many-requests') { showModal({ type: 'error', title: 'Too Many Attempts', desc: 'Kuch der baad try karo.', primaryText: 'OK' }); return; }
    if (code === 'auth/user-disabled') { showModal({ type: 'error', title: 'Account Disabled', desc: 'Ye account block hai.', primaryText: 'OK' }); return; }
    if (code === 'auth/operation-not-allowed') { showModal({ type: 'error', title: 'Configuration Error', desc: 'Service abhi available nahi hai.', primaryText: 'OK' }); return; }
    if (code === 'auth/unauthorized-domain') { showModal({ type: 'error', title: 'Configuration Error', desc: 'Domain authorized nahi hai. Admin se contact karein.', primaryText: 'OK' }); return; }
    showModal({ type: 'error', title: 'Login Failed', desc: 'Kuch problem aayi. Please try again.', primaryText: 'Try Again' });
  }

  /* ═══ UI REFS ═══ */
  const card = document.getElementById('tg-card');
  const leftTitle = document.getElementById('tg-left-title');
  const leftSub = document.getElementById('tg-left-sub');
  const form = document.getElementById('tg-form');
  const nameInput = document.getElementById('tg-name');
  const emailInput = document.getElementById('tg-email');
  const passwordInput = document.getElementById('tg-password');
  const submitBtn = document.getElementById('tg-submit');
  const submitText = document.getElementById('tg-submit-text');
  const modeSwitch = document.getElementById('tg-mode-switch');
  const modeLabel = document.getElementById('tg-mode-label');
  const passToggle = document.getElementById('tg-toggle-pass');
  const googleBtn = document.getElementById('tg-google');
  const googleText = document.getElementById('tg-google-text');
  const forgotLink = document.getElementById('tg-forgot');
  const forgotRow = document.getElementById('tg-forgot-row');

  let mode = 'login';
  function setMode(m) {
    mode = m;
    if (m === 'signup') {
      card.classList.add('signup');
      leftTitle.textContent = 'Looks like you\'re new here!';
      leftSub.textContent = 'Sign up with TOEGO and unlock exclusive deals.';
      submitText.textContent = 'Sign Up';
      modeLabel.textContent = 'Already have an account?';
      modeSwitch.textContent = 'Log in';
      passwordInput.setAttribute('autocomplete', 'new-password');
      forgotRow.style.display = 'none';
    } else {
      card.classList.remove('signup');
      leftTitle.textContent = 'Login';
      leftSub.textContent = 'Get access to your Orders, Wishlist and Recommendations';
      submitText.textContent = 'Login';
      modeLabel.textContent = 'New to TOEGO?';
      modeSwitch.textContent = 'Create an account';
      passwordInput.setAttribute('autocomplete', 'current-password');
      forgotRow.style.display = '';
    }
  }
  modeSwitch.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));
  passToggle.addEventListener('click', () => {
    const isPass = passwordInput.type === 'password';
    passwordInput.type = isPass ? 'text' : 'password';
    passToggle.textContent = isPass ? 'Hide' : 'Show';
  });
  [nameInput, emailInput, passwordInput].forEach(inp => {
    if (!inp) return;
    const upd = () => inp.classList.toggle('filled', !!inp.value);
    inp.addEventListener('input', upd);
    inp.addEventListener('blur', upd);
    upd();
  });

  function setSubmitLoading(on, txt) {
    if (on) { submitBtn.classList.add('loading'); submitBtn.disabled = true; if (txt) submitText.textContent = txt; }
    else { submitBtn.classList.remove('loading'); submitBtn.disabled = false; submitText.textContent = mode === 'signup' ? 'Sign Up' : 'Login'; }
  }
  function setGoogleLoading(on) {
    googleBtn.classList.toggle('loading', on);
    googleBtn.disabled = !!on;
    googleText.textContent = on ? 'Please wait…' : 'Continue with Google';
  }

  /* ═══════════════════════════════════════════════════════════════
     SUCCESS HANDLER
     ═══════════════════════════════════════════════════════════════ */
  let _redirected = false;

  async function handleSuccess(userData) {
    if (_redirected) return;
    _redirected = true;

    showAuthLoading('Login successful! Redirecting…', true);

    const sessionData = {
      uid: userData.uid,
      email: userData.email || '',
      name: userData.name || (userData.email || '').split('@')[0] || 'User',
      photoURL: userData.photoURL || '',
      role: 'customer',
      ts: Date.now()
    };

    safeSet(AUTH_CACHE_KEY, JSON.stringify(sessionData));
    safeSet(SESSION_KEY, JSON.stringify(sessionData));
    markLoginSuccess(sessionData.name);

    let idToken = userData.idToken;
    if (!idToken && auth.currentUser) {
      try { idToken = await auth.currentUser.getIdToken(); } catch(e) {}
    }

    if (idToken) {
      saveUserDocREST(idToken, sessionData.uid, sessionData.email, sessionData.name, sessionData.photoURL);
    }
    if (auth.currentUser && auth.currentUser.uid === sessionData.uid) {
      saveUserDocSDK(auth.currentUser, sessionData.name, sessionData.photoURL).catch(() => {});
    }

    setTimeout(() => { window.location.replace(REDIRECT_URL); }, 600);
  }

  /* ═══════════════════════════════════════════════════════════════
     EMAIL/PASSWORD SUBMIT
     ═══════════════════════════════════════════════════════════════ */
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = (emailInput.value || '').trim();
    const password = passwordInput.value || '';
    const name = (nameInput && nameInput.value || '').trim();

    if (!email) { showModal({ type: 'warn', title: 'Email Required', desc: 'Email daalo.', primaryText: 'OK', onPrimary: () => emailInput.focus() }); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showModal({ type: 'warn', title: 'Invalid Email', desc: 'Valid email daalo.', primaryText: 'OK', onPrimary: () => { emailInput.focus(); emailInput.select(); } }); return; }
    if (!password) { showModal({ type: 'warn', title: 'Password Required', desc: 'Password daalo.', primaryText: 'OK', onPrimary: () => passwordInput.focus() }); return; }
    if (password.length < 6) { showModal({ type: 'warn', title: 'Password Too Short', desc: 'Kam se kam 6 characters.', primaryText: 'OK', onPrimary: () => { passwordInput.focus(); passwordInput.select(); } }); return; }
    if (mode === 'signup' && !name) { showModal({ type: 'warn', title: 'Name Required', desc: 'Full name daalo.', primaryText: 'OK', onPrimary: () => nameInput.focus() }); return; }

    setSubmitLoading(true, mode === 'signup' ? 'Creating account…' : 'Logging in…');

    /* TIER 1: SDK */
    try {
      console.log('[tier1] SDK', mode);
      let cred;
      if (mode === 'signup') {
        cred = await auth.createUserWithEmailAndPassword(email, password);
        if (cred.user && name) { try { await cred.user.updateProfile({ displayName: name }); } catch(e) {} }
      } else {
        cred = await auth.signInWithEmailAndPassword(email, password);
      }
      if (cred && cred.user) {
        console.log('[tier1] ✓');
        let idToken = '';
        try { idToken = await cred.user.getIdToken(); } catch(e) {}
        await handleSuccess({
          uid: cred.user.uid,
          email: email,
          name: name || cred.user.displayName || email.split('@')[0],
          photoURL: cred.user.photoURL || '',
          idToken: idToken
        });
        return;
      }
    } catch (err) {
      const code = err && err.code;
      console.log('[tier1] failed:', code);

      /* TIER 2: Recover from auth.currentUser */
      if ((code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') && auth.currentUser) {
        console.log('[tier2] recovered');
        let idToken = '';
        try { idToken = await auth.currentUser.getIdToken(); } catch(e) {}
        await handleSuccess({
          uid: auth.currentUser.uid,
          email: auth.currentUser.email || email,
          name: name || auth.currentUser.displayName || email.split('@')[0],
          photoURL: auth.currentUser.photoURL || '',
          idToken: idToken
        });
        return;
      }

      /* TIER 3: REST */
      if (code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') {
        console.log('[tier3] REST');
        try {
          const data = mode === 'signup'
            ? await restSignup(email, password)
            : await restLogin(email, password);
          console.log('[tier3] ✓');
          if (mode === 'signup' && name && data.idToken) updateProfileRest(data.idToken, name);
          await handleSuccess({
            uid: data.localId,
            email: data.email || email,
            name: name || data.email.split('@')[0],
            idToken: data.idToken
          });
          return;
        } catch (restErr) {
          console.log('[tier3] failed:', restErr && restErr.code);
          setSubmitLoading(false);
          showError(restErr);
          return;
        }
      }

      setSubmitLoading(false);
      showError(err);
    }
  });

  /* ═══════════════════════════════════════════════════════════════
     ✅ FIXED: GOOGLE LOGIN — POPUP ONLY, NO REDIRECT
     ═══════════════════════════════════════════════════════════════ */
  googleBtn.addEventListener('click', function() {
    if (googleBtn.disabled) return;

    setGoogleLoading(true);

    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    /* No await before signInWithPopup — preserves user gesture */
    auth.signInWithPopup(provider).then(async function(result) {
      if (result && result.user) {
        console.log('[google] popup success:', result.user.email);
        clearPendingGoogle();
        let idToken = '';
        try { idToken = await result.user.getIdToken(); } catch(e) {}
        await handleSuccess({
          uid: result.user.uid,
          email: result.user.email,
          name: result.user.displayName || (result.user.email || '').split('@')[0],
          photoURL: result.user.photoURL || '',
          idToken: idToken
        });
      } else {
        setGoogleLoading(false);
      }
    }).catch(async function(err) {
      const code = err && err.code;
      console.log('[google] error:', code);

      /* User closed popup — silent, just re-enable button */
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
        setGoogleLoading(false);
        return;
      }

      /* Popup blocked — clear instructions */
      if (code === 'auth/popup-blocked') {
        setGoogleLoading(false);
        showModal({
          type: 'warn',
          title: 'Popup Blocked',
          desc: 'Browser ne popup block kiya hai.<br><br>Address bar me <b>popup icon</b> se "Always allow" karein, phir "Try Again" dabayein.',
          primaryText: 'Try Again',
          secondaryText: 'Cancel',
          onPrimary: () => setTimeout(() => { try { googleBtn.click(); } catch(e) {} }, 150)
        });
        return;
      }

      /* In-app browser (Instagram, Facebook, etc.) */
      if (code === 'auth/operation-not-supported-in-this-environment') {
        setGoogleLoading(false);
        showModal({
          type: 'error',
          title: 'Browser Not Supported',
          desc: 'Ye browser Google login support nahi karta.<br><br>Please <b>Chrome, Safari, Firefox</b> ya koi bhi standard browser me TOEGO kholein.',
          primaryText: 'OK'
        });
        return;
      }

      /* Network issue */
      if (code === 'auth/network-request-failed') {
        setGoogleLoading(false);
        showModal({
          type: 'error',
          title: 'No Internet',
          desc: 'Internet connection check karein aur dobara try karein.',
          primaryText: 'Retry',
          onPrimary: () => setTimeout(() => { try { googleBtn.click(); } catch(e) {} }, 150)
        });
        return;
      }

      /* Domain not authorized */
      if (code === 'auth/unauthorized-domain') {
        setGoogleLoading(false);
        showModal({
          type: 'error',
          title: 'Configuration Error',
          desc: 'Ye domain Firebase me authorized nahi hai. Admin se contact karein.',
          primaryText: 'OK'
        });
        return;
      }

      /* Account disabled */
      if (code === 'auth/user-disabled') {
        setGoogleLoading(false);
        showModal({
          type: 'error',
          title: 'Account Disabled',
          desc: 'Ye Google account block hai.',
          primaryText: 'OK'
        });
        return;
      }

      /* Storage errors — try recovery from current user */
      if (code === 'auth/web-storage-unsupported' || code === 'auth/internal-error') {
        if (auth.currentUser) {
          let idToken = '';
          try { idToken = await auth.currentUser.getIdToken(); } catch(e) {}
          await handleSuccess({
            uid: auth.currentUser.uid,
            email: auth.currentUser.email,
            name: auth.currentUser.displayName || (auth.currentUser.email || '').split('@')[0],
            photoURL: auth.currentUser.photoURL || '',
            idToken: idToken
          });
          return;
        }
        setGoogleLoading(false);
        showModal({
          type: 'error',
          title: 'Storage Required',
          desc: 'Browser storage allow karein. Incognito mode me Google login nahi hoga.',
          primaryText: 'OK'
        });
        return;
      }

      /* Any other error */
      setGoogleLoading(false);
      showError(err);
    });
  });

  /* ═══ Redirect return (no-op now — safe) ═══ */
  (async function handleRedirectReturn() {
    try {
      const result = await auth.getRedirectResult();
      if (result && result.user) {
        clearPendingGoogle();
        let idToken = '';
        try { idToken = await result.user.getIdToken(); } catch(e) {}
        await handleSuccess({
          uid: result.user.uid,
          email: result.user.email,
          name: result.user.displayName || (result.user.email || '').split('@')[0],
          photoURL: result.user.photoURL || '',
          idToken: idToken
        });
      }
    } catch (err) { /* silent */ }
  })();

  /* ═══════════════════════════════════════════════════════════════
     SESSION RESTORE — SDK verified, ultra-proof
     ═══════════════════════════════════════════════════════════════ */
  let _authCheckFirst = true;
  auth.onAuthStateChanged(async (user) => {
    if (_authCheckFirst) {
      _authCheckFirst = false;
      if (user && !_redirected) {
        console.log('[session-restore] Firebase confirms:', user.email);
        showAuthLoading('Welcome back!', true);
        let idToken = '';
        try { idToken = await user.getIdToken(); } catch(e) {}
        await handleSuccess({
          uid: user.uid,
          email: user.email,
          name: user.displayName || (user.email || '').split('@')[0],
          photoURL: user.photoURL || '',
          idToken: idToken
        });
        return;
      }
      /* Not logged in — clear any stale cache, stay on login page */
      console.log('[session-restore] not logged in — showing login form');
      safeRemove(AUTH_CACHE_KEY);
      safeRemove(SESSION_KEY);
      return;
    }

    /* Subsequent fires — user just logged in */
    if (user && !_redirected) {
      console.log('[auth-state] user present:', user.email);
      clearPendingGoogle();
      let idToken = '';
      try { idToken = await user.getIdToken(); } catch(e) {}
      await handleSuccess({
        uid: user.uid,
        email: user.email,
        name: user.displayName || (user.email || '').split('@')[0],
        photoURL: user.photoURL || '',
        idToken: idToken
      });
    }
  });

  /* Failsafe — if pending Google stuck after 6s, show login */
  setTimeout(() => {
    if (isPendingGoogle() && !auth.currentUser && !_redirected) {
      console.log('[failsafe] restoring login form');
      clearPendingGoogle();
      hideAuthLoading();
    }
  }, 6000);

  window.addEventListener('pageshow', (e) => {
    if (e.persisted && auth.currentUser && !_redirected) {
      console.log('[pageshow] user present');
      handleSuccess({
        uid: auth.currentUser.uid,
        email: auth.currentUser.email,
        name: auth.currentUser.displayName || (auth.currentUser.email || '').split('@')[0],
        photoURL: auth.currentUser.photoURL || ''
      });
    }
  });

  /* ═══ FORGOT PASSWORD ═══ */
  async function doForgotPassword() {
    const email = (emailInput.value || '').trim();
    if (!email) { showModal({ type: 'info', title: 'Email Required', desc: 'Password reset ke liye email daalo.', primaryText: 'OK', onPrimary: () => emailInput.focus() }); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showModal({ type: 'warn', title: 'Invalid Email', desc: 'Valid email daalo.', primaryText: 'OK', onPrimary: () => { emailInput.focus(); emailInput.select(); } }); return; }

    try {
      try { await auth.sendPasswordResetEmail(email); }
      catch(sdkErr) { console.log('[reset] SDK failed, REST:', sdkErr && sdkErr.code); await restReset(email); }
      showModal({ type: 'success', title: 'Reset Link Sent', desc: 'Reset link bhej diya:<br><br><b>' + email + '</b>', primaryText: 'OK' });
    } catch (err) {
      const code = err && err.code;
      if (code === 'auth/user-not-found') {
        showModal({ type: 'warn', title: 'Account Not Found', desc: 'Is email se koi account nahi mila.', primaryText: 'Create Account', secondaryText: 'Cancel', onPrimary: () => setMode('signup') });
      } else {
        showError(err);
      }
    }
  }
  forgotLink.addEventListener('click', (e) => { e.preventDefault(); doForgotPassword(); });

  /* ═══ THEME ═══ */
  setTimeout(() => {
    try {
      db.collection('siteSettings').doc('theme').get()
        .then(snap => {
          if (snap.exists) {
            const p = snap.data().themeColor || '#2874f0';
            const left = document.getElementById('tg-left');
            if (left) left.style.background = p;
            document.documentElement.style.setProperty('--tg-primary', p);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', p);
          }
        }).catch(() => {});
    } catch(e) {}
  }, 300);

})();
</script>
</body>
</html>
