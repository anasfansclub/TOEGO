<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin:0!important; padding:0!important; width:100%!important; max-width:100vw; overflow-x:hidden; background:#f1f3f6; font-family:'Roboto',Arial,sans-serif; color:#212121; -webkit-font-smoothing:antialiased; }
img { max-width:100%; display:block; }
button { font:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, select, textarea { font:inherit; }
a { color:inherit; text-decoration:none; }
header#top, #top_menu, nav.o_main_navbar, .o_main_navbar, footer#bottom, .o_footer, #footer, .o_breadcrumb, .breadcrumb, .o_website_edit_toolbar, .o_notification_manager, .o_editor_banner, .o_loading_indicator { display:none!important; visibility:hidden!important; }

/* HEADER */
.tg-hd { background:#2874f0; position:fixed; top:0; left:0; right:0; z-index:1000; box-shadow:0 1px 4px rgba(0,0,0,.15); width:100%; }
.tg-hd-inner { display:flex; align-items:center; gap:10px; padding:10px 14px; height:58px; }
.tg-hd-back { width:38px; height:38px; display:flex; align-items:center; justify-content:center; color:#fff; border-radius:50%; flex-shrink:0; transition:background .15s; }
.tg-hd-back:hover { background:rgba(255,255,255,.12); }
.tg-hd-back svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.tg-hd-title { flex:1; color:#fff; font-size:17px; font-weight:700; letter-spacing:-.2px; display:flex; align-items:center; gap:8px; }
.tg-hd-count { font-size:12.5px; font-weight:500; opacity:.85; background:rgba(255,255,255,.2); padding:2px 8px; border-radius:999px; font-weight:700; }
.tg-hd-actions { display:flex; gap:2px; flex-shrink:0; }
.tg-hd-btn { width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:#fff; border-radius:50%; transition:background .15s; }
.tg-hd-btn:hover { background:rgba(255,255,255,.12); }
.tg-hd-btn svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* LAYOUT */
.tg-wrap { padding-top:58px; padding-bottom:100px; min-height:100vh; }
.tg-container { max-width:680px; margin:0 auto; padding:12px; }

/* ACTION BAR */
.tg-action-bar { background:#fff; border-radius:12px; padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.tg-action-info { flex:1; min-width:0; }
.tg-action-title { font-size:13px; font-weight:700; color:#212121; }
.tg-action-sub { font-size:11.5px; color:#888; margin-top:2px; }
.tg-action-btn { padding:8px 14px; background:#f0f5ff; color:#2874f0; font-size:12px; font-weight:800; border-radius:8px; text-transform:uppercase; letter-spacing:.3px; transition:all .15s; flex-shrink:0; }
.tg-action-btn:hover { background:#e0eaff; }
.tg-action-btn.danger { background:#ffebee; color:#d32f2f; }
.tg-action-btn.danger:hover { background:#ffcdd2; }

/* TABS */
.tg-tabs { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:4px 0 10px; margin-bottom:2px; }
.tg-tabs::-webkit-scrollbar { display:none; }
.tg-tab { padding:9px 16px; background:#fff; border:1.5px solid #e0e0e0; border-radius:999px; font-size:12.5px; font-weight:700; color:#666; white-space:nowrap; cursor:pointer; transition:all .15s; display:inline-flex; align-items:center; gap:6px; flex-shrink:0; }
.tg-tab:hover { border-color:#2874f0; color:#2874f0; }
.tg-tab.active { background:linear-gradient(135deg,#2874f0,#1a5dc7); border-color:#2874f0; color:#fff; box-shadow:0 3px 10px rgba(40,116,240,.25); }
.tg-tab-count { background:rgba(0,0,0,.08); padding:2px 7px; border-radius:999px; font-size:10px; font-weight:800; min-width:18px; text-align:center; }
.tg-tab.active .tg-tab-count { background:rgba(255,255,255,.25); }
.tg-tab.has-unread .tg-tab-count { background:#ff6161; color:#fff; }
.tg-tab.active.has-unread .tg-tab-count { background:#fff; color:#2874f0; }

/* NOTIFICATION LIST */
.tg-notif-list { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.tg-notif-item { display:flex; gap:14px; padding:16px 18px; border-bottom:1px solid #f1f3f6; cursor:pointer; transition:background .15s; position:relative; }
.tg-notif-item:last-child { border-bottom:none; }
.tg-notif-item:hover { background:#f8f9fb; }
.tg-notif-item.unread { background:linear-gradient(135deg,#f8fbff,#f0f5ff); }
.tg-notif-item.unread::before { content:''; position:absolute; left:0; top:16px; bottom:16px; width:4px; background:linear-gradient(180deg,#2874f0,#1a5dc7); border-radius:0 4px 4px 0; }

.tg-notif-icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; position:relative; overflow:hidden; }
.tg-notif-icon img { width:100%; height:100%; object-fit:cover; }
.tg-notif-icon.order { background:linear-gradient(135deg,#eef3ff,#e0eaff); color:#2874f0; }
.tg-notif-icon.offer { background:linear-gradient(135deg,#fff3e0,#ffe0b2); color:#fb641b; }
.tg-notif-icon.system { background:linear-gradient(135deg,#ede7f6,#d1c4e9); color:#7e57c2; }
.tg-notif-icon.promo { background:linear-gradient(135deg,#fce4ec,#f8bbd0); color:#f43397; }
.tg-notif-icon.payment { background:linear-gradient(135deg,#e6f7ec,#d1f0dd); color:#1b8a3a; }
.tg-notif-icon.alert { background:linear-gradient(135deg,#ffebee,#ffcdd2); color:#d32f2f; }

.tg-notif-body { flex:1; min-width:0; }
.tg-notif-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px; }
.tg-notif-title { font-size:13.5px; font-weight:800; color:#212121; line-height:1.3; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.tg-notif-unread-dot { width:8px; height:8px; border-radius:50%; background:#ff6161; flex-shrink:0; margin-top:6px; box-shadow:0 0 0 3px rgba(255,97,97,.15); }
.tg-notif-text { font-size:12.5px; color:#555; line-height:1.5; margin-bottom:6px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.tg-notif-foot { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.tg-notif-time { font-size:11px; color:#999; font-weight:500; display:inline-flex; align-items:center; gap:4px; }
.tg-notif-time svg { width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2; }
.tg-notif-cta { font-size:11px; font-weight:800; color:#2874f0; text-transform:uppercase; letter-spacing:.3px; padding:3px 8px; background:#f0f5ff; border-radius:6px; display:inline-flex; align-items:center; gap:3px; }
.tg-notif-cta svg { width:10px; height:10px; stroke:currentColor; fill:none; stroke-width:2.5; }
.tg-notif-pill { font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.4px; }

/* SKELETON */
.tg-skel-item { display:flex; gap:14px; padding:16px 18px; border-bottom:1px solid #f1f3f6; }
.tg-skel { background:linear-gradient(90deg,#f0f0f0 0%,#e8e8e8 50%,#f0f0f0 100%); background-size:200% 100%; animation:tgShim 1.4s infinite; border-radius:8px; }
@keyframes tgShim { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }

/* EMPTY STATE */
.tg-empty { background:#fff; border-radius:12px; padding:50px 24px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.05); }
.tg-empty-icon { width:130px; height:130px; margin:0 auto 20px; background:linear-gradient(135deg,#eef3ff,#e0eaff); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:60px; box-shadow:0 12px 40px rgba(40,116,240,.15); }
.tg-empty-title { font-size:19px; font-weight:800; color:#212121; margin:0 0 8px; }
.tg-empty-desc { font-size:13.5px; color:#666; line-height:1.55; margin:0 0 22px; max-width:380px; margin-left:auto; margin-right:auto; }
.tg-empty-cta { display:inline-flex; align-items:center; gap:8px; padding:13px 28px; background:linear-gradient(135deg,#2874f0,#1a5dc7); color:#fff; font-size:13.5px; font-weight:800; border-radius:8px; letter-spacing:.4px; text-transform:uppercase; box-shadow:0 6px 18px rgba(40,116,240,.3); transition:all .15s; }
.tg-empty-cta:hover { filter:brightness(1.05); transform:translateY(-1px); }
.tg-empty-cta svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

/* PULL TO REFRESH */
.tg-ptr { height:0; overflow:hidden; transition:height .2s ease; text-align:center; }
.tg-ptr.show { height:50px; }
.tg-ptr-inner { padding:12px 0; color:#2874f0; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:8px; }
.tg-ptr-inner svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.4; animation:tgSpin 1s linear infinite; }
@keyframes tgSpin { to { transform:rotate(360deg); } }

/* BOTTOM NAV */
.tg-bnav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e0e0e0; display:flex; z-index:9999; box-shadow:0 -2px 8px rgba(0,0,0,.06); padding-bottom:env(safe-area-inset-bottom,0); }
.tg-bnav-item { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 2px; gap:3px; font-size:10px; color:#666; font-weight:600; position:relative; transition:color .15s; }
.tg-bnav-item.active { color:#2874f0; }
.tg-bnav-item svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.tg-bnav-badge { position:absolute; top:4px; right:calc(50% - 20px); background:#ff6161; color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

/* TOASTS */
.tg-toasts { position:fixed; bottom:88px; left:50%; transform:translateX(-50%); z-index:99999; display:flex; flex-direction:column; gap:8px; max-width:calc(100vw - 24px); pointer-events:none; }
.tg-toast { padding:12px 20px; background:#212121; color:#fff; font-size:13px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.3); pointer-events:auto; font-weight:500; animation:tgToastIn .25s; }
@keyframes tgToastIn { from { transform:translateY(20px); opacity:0; } to { transform:none; opacity:1; } }
.tg-toast.success { background:#388e3c; }
.tg-toast.error { background:#d32f2f; }
.tg-toast.info { background:#2874f0; }

/* RESPONSIVE */
@media (max-width:480px) {
  .tg-notif-item { padding:14px; gap:12px; }
  .tg-notif-icon { width:42px; height:42px; font-size:20px; border-radius:10px; }
  .tg-notif-title { font-size:13px; }
  .tg-notif-text { font-size:12px; }
  .tg-hd-title { font-size:15px; }
}
</style>

<script>
(function() {
  'use strict';

  /* ══════════════════ FIREBASE ══════════════════ */
  if (!window.__TOEGO_FB__) {
    window.__TOEGO_FB__ = firebase.initializeApp({
      apiKey: "AIzaSyAhxecFY9TwZTYbdCVRAcnp1whI-Uqc-P8",
      authDomain: "toego-ecommerce.firebaseapp.com",
      projectId: "toego-ecommerce",
      storageBucket: "toego-ecommerce.firebasestorage.app",
      messagingSenderId: "234167880880",
      appId: "1:234167880880:web:b89d4b8e5f8cc9af3c3f75"
    });
  }
  const auth = firebase.auth();
  const db = firebase.firestore();
  const FV = firebase.firestore.FieldValue;

  try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch(e) {}

  /* ══════════════════ CONSTANTS ══════════════════ */
  const GUEST_CART_KEY = 'toego_cart_guest';
  const READ_KEY = 'toego_notif_read';       /* Array of read notification IDs */
  const GUEST_NOTIF_KEY = 'toego_guest_notifs';
  const LAST_FETCH_KEY = 'toego_notif_last_fetch';

  /* ══════════════════ STATE ══════════════════ */
  let currentUser = null;
  let allNotifs = [];
  let readIds = new Set();
  let currentTab = 'all';
  let unsubNotifs = null;
  let ptrActive = false;

  /* ══════════════════ HELPERS ══════════════════ */
  function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function toast(msg, type='info') {
    const w = document.getElementById('tg-toasts');
    if (!w) return;
    const el = document.createElement('div');
    el.className = 'tg-toast ' + type;
    el.textContent = msg;
    w.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  }

  function loadReadIds() {
    try {
      const arr = JSON.parse(localStorage.getItem(READ_KEY) || '[]');
      readIds = new Set(Array.isArray(arr) ? arr : []);
    } catch(e) { readIds = new Set(); }
  }
  function saveReadIds() {
    try { localStorage.setItem(READ_KEY, JSON.stringify([...readIds])); } catch(e) {}
  }

  /* Time ago */
  function timeAgo(ts) {
    if (!ts) return '';
    let d;
    try {
      if (ts.toDate) d = ts.toDate();
      else if (ts.seconds) d = new Date(ts.seconds * 1000);
      else if (ts instanceof Date) d = ts;
      else d = new Date(ts);
      if (isNaN(d.getTime())) return '';
    } catch(e) { return ''; }
    const s = Math.floor((Date.now() - d.getTime()) / 1000);
    if (s < 10) return 'Just now';
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    if (s < 2592000) return Math.floor(s / 604800) + 'w ago';
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }

  /* Determine notif type (order/offer/system/etc) */
  function getNotifType(n) {
    const type = String(n.type || '').toLowerCase();
    const title = String(n.title || '').toLowerCase();
    const category = String(n.category || '').toLowerCase();

    if (type === 'order' || category === 'order' || title.includes('order')) return 'order';
    if (type === 'offer' || type === 'promo' || category === 'offer' || category === 'promo') return 'offer';
    if (type === 'payment' || category === 'payment') return 'payment';
    if (type === 'alert' || category === 'alert') return 'alert';
    if (type === 'system' || category === 'system') return 'system';
    return 'system';
  }

  /* Icon emoji by type */
  function getNotifIcon(n) {
    const t = getNotifType(n);
    if (n.image) return '<img src="' + esc(n.image) + '" alt="" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + getNotifEmoji(t) + '\';" />';
    return getNotifEmoji(t);
  }
  function getNotifEmoji(t) {
    return { order: '📦', offer: '🎁', promo: '🎉', system: '🔔', payment: '💳', alert: '⚠️' }[t] || '🔔';
  }

  /* ══════════════════ RENDER ══════════════════ */
  function renderNotifications() {
    const listEl = document.getElementById('tg-list');
    const emptyEl = document.getElementById('tg-empty');
    const loadingEl = document.getElementById('tg-loading');
    const actionBar = document.getElementById('tg-action-bar');

    if (loadingEl) loadingEl.style.display = 'none';

    /* Filter by tab */
    let list = allNotifs.slice();
    if (currentTab !== 'all') {
      list = list.filter(n => {
        const t = getNotifType(n);
        if (currentTab === 'order') return t === 'order' || t === 'payment' || t === 'alert';
        if (currentTab === 'offer') return t === 'offer' || t === 'promo';
        if (currentTab === 'system') return t === 'system';
        return true;
      });
    }

    /* Sort — newest first */
    list.sort((a, b) => {
      const ta = a.createdAt?.toDate?.()?.getTime?.() || a.createdAt?.seconds * 1000 || 0;
      const tb = b.createdAt?.toDate?.()?.getTime?.() || b.createdAt?.seconds * 1000 || 0;
      return tb - ta;
    });

    /* Update tab counts */
    const counts = { all: allNotifs.length, order: 0, offer: 0, system: 0 };
    allNotifs.forEach(n => {
      const t = getNotifType(n);
      if (t === 'order' || t === 'payment' || t === 'alert') counts.order++;
      else if (t === 'offer' || t === 'promo') counts.offer++;
      else counts.system++;
    });
    const unreadCounts = { all: 0, order: 0, offer: 0, system: 0 };
    allNotifs.forEach(n => {
      if (!readIds.has(n.id)) {
        const t = getNotifType(n);
        unreadCounts.all++;
        if (t === 'order' || t === 'payment' || t === 'alert') unreadCounts.order++;
        else if (t === 'offer' || t === 'promo') unreadCounts.offer++;
        else unreadCounts.system++;
      }
    });

    setText('tg-tc-all', counts.all);
    setText('tg-tc-order', counts.order);
    setText('tg-tc-offer', counts.offer);
    setText('tg-tc-system', counts.system);

    /* Update unread dots on tabs */
    ['all','order','offer','system'].forEach(tab => {
      const tabEl = document.querySelector('.tg-tab[data-tab="' + tab + '"]');
      if (tabEl) {
        tabEl.classList.toggle('has-unread', unreadCounts[tab] > 0);
      }
    });

    /* Update header unread count */
    const unreadTotal = unreadCounts.all;
    const hdCount = document.getElementById('tg-unread-count');
    if (hdCount) {
      if (unreadTotal > 0) {
        hdCount.textContent = unreadTotal;
        hdCount.style.display = 'inline-block';
      } else {
        hdCount.style.display = 'none';
      }
    }

    /* Action bar */
    if (allNotifs.length === 0) {
      actionBar.style.display = 'none';
    } else {
      actionBar.style.display = 'flex';
      setText('tg-action-title', allNotifs.length + ' notification' + (allNotifs.length > 1 ? 's' : ''));
      if (unreadTotal > 0) {
        setText('tg-action-sub', unreadTotal + ' unread');
        document.getElementById('tg-mark-all-btn').style.display = 'inline-block';
      } else {
        setText('tg-action-sub', 'All caught up!');
        document.getElementById('tg-mark-all-btn').style.display = 'none';
      }
    }

    /* Empty state */
    if (list.length === 0) {
      listEl.style.display = 'none';
      emptyEl.style.display = 'block';
      /* If tab filter has no results but total has some */
      const emptyTitle = emptyEl.querySelector('.tg-empty-title');
      const emptyDesc = emptyEl.querySelector('.tg-empty-desc');
      if (allNotifs.length > 0) {
        emptyTitle.textContent = 'No ' + (currentTab === 'all' ? '' : currentTab) + ' notifications';
        emptyDesc.textContent = 'Try a different filter to see more notifications.';
      } else {
        emptyTitle.textContent = 'No notifications yet';
        emptyDesc.textContent = "You're all caught up! Order updates, offers and important alerts will show up here.";
      }
      return;
    }

    emptyEl.style.display = 'none';
    listEl.style.display = 'block';

    listEl.innerHTML = list.map(n => {
      const isRead = readIds.has(n.id);
      const type = getNotifType(n);
      const hasLink = !!(n.url || n.link || n.orderId || n.productId);
      const time = timeAgo(n.createdAt);
      return '<div class="tg-notif-item ' + (isRead ? '' : 'unread') + '" onclick="tgOpenNotif(\'' + esc(n.id) + '\')">' +
        '<div class="tg-notif-icon ' + type + '">' + getNotifIcon(n) + '</div>' +
        '<div class="tg-notif-body">' +
          '<div class="tg-notif-head">' +
            '<div class="tg-notif-title">' + esc(n.title || 'Notification') + '</div>' +
            (isRead ? '' : '<div class="tg-notif-unread-dot"></div>') +
          '</div>' +
          '<div class="tg-notif-text">' + esc(n.body || n.message || '') + '</div>' +
          '<div class="tg-notif-foot">' +
            '<span class="tg-notif-time"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' + esc(time) + '</span>' +
            (hasLink ? '<span class="tg-notif-cta">View <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>' : '') +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function setText(id, v) { const el = document.getElementById(id); if (el) el.textContent = v; }

  /* ══════════════════ FILTER TABS ══════════════════ */
  window.tgFilterNotifications = function(tab, el) {
    currentTab = tab;
    document.querySelectorAll('.tg-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    renderNotifications();
  };

  /* ══════════════════ OPEN NOTIFICATION ══════════════════ */
  window.tgOpenNotif = function(id) {
    const n = allNotifs.find(x => x.id === id);
    if (!n) return;

    /* Mark as read */
    if (!readIds.has(id)) {
      readIds.add(id);
      saveReadIds();
      /* Re-render */
      renderNotifications();
      /* Sync to Firestore if logged in */
      if (currentUser) {
        try {
          db.collection('notifications').doc(id).update({
            readBy: FV.arrayUnion(currentUser.uid)
          }).catch(() => {});
        } catch(e) {}
      }
      /* Update bell on shop-home (via localStorage) */
      try { localStorage.setItem('toego_last_notif', id); } catch(e) {}
    }

    /* Navigate */
    let url = n.url || n.link;
    if (!url && n.orderId) url = 'my-orders.html?id=' + encodeURIComponent(n.orderId);
    if (!url && n.productId) url = 'product.html?id=' + encodeURIComponent(n.productId);
    if (!url && n.type === 'offer') url = 'products.html?sale=50';

    if (url) {
      setTimeout(() => { window.location.href = url; }, 180);
    }
  };

  /* ══════════════════ MARK ALL READ ══════════════════ */
  window.tgMarkAllRead = function() {
    if (!allNotifs.length) return;
    allNotifs.forEach(n => readIds.add(n.id));
    saveReadIds();
    renderNotifications();
    toast('All marked as read ✓', 'success');

    /* Sync to Firestore */
    if (currentUser) {
      try {
        const batch = db.batch();
        allNotifs.slice(0, 450).forEach(n => {
          const ref = db.collection('notifications').doc(n.id);
          batch.update(ref, { readBy: FV.arrayUnion(currentUser.uid) });
        });
        batch.commit().catch(() => {});
      } catch(e) {}
    }
  };

  /* ══════════════════ CLEAR ALL ══════════════════ */
  window.tgClearAll = function() {
    if (!allNotifs.length) return;
    if (!confirm('Clear all notifications? This only hides them locally — you can still see them in your account history.')) return;
    allNotifs.forEach(n => readIds.add(n.id));
    saveReadIds();
    allNotifs = [];
    renderNotifications();
    toast('Notifications cleared', 'info');
  };

  /* ══════════════════ REFRESH ══════════════════ */
  window.tgRefreshNotifications = function() {
    const ptr = document.getElementById('tg-ptr');
    if (ptr) ptr.classList.add('show');
    loadNotifications().finally(() => {
      setTimeout(() => { if (ptr) ptr.classList.remove('show'); }, 400);
    });
  };

  /* ══════════════════ LOAD NOTIFICATIONS ══════════════════ */
  async function loadNotifications() {
    const loadingEl = document.getElementById('tg-loading');
    const listEl = document.getElementById('tg-list');
    const emptyEl = document.getElementById('tg-empty');

    if (!allNotifs.length) {
      if (loadingEl) loadingEl.style.display = 'block';
      if (listEl) listEl.style.display = 'none';
      if (emptyEl) emptyEl.style.display = 'none';
    }

    /* Guest — load from localStorage */
    if (!currentUser) {
      try {
        const stored = JSON.parse(localStorage.getItem(GUEST_NOTIF_KEY) || '[]');
        allNotifs = Array.isArray(stored) ? stored : [];
      } catch(e) { allNotifs = []; }
      /* Add sample guest notifications if empty */
      if (!allNotifs.length) {
        allNotifs = getSampleNotifs();
        try { localStorage.setItem(GUEST_NOTIF_KEY, JSON.stringify(allNotifs)); } catch(e) {}
      }
      renderNotifications();
      return;
    }

    /* Logged-in — Firestore listener */
    if (unsubNotifs) { try { unsubNotifs(); } catch(e){} unsubNotifs = null; }

    return new Promise(resolve => {
      try {
        /* Get global + user-specific notifications */
        unsubNotifs = db.collection('notifications')
          .where('active', '==', true)
          .orderBy('createdAt', 'desc')
          .limit(100)
          .onSnapshot(
            snap => {
              const list = [];
              snap.forEach(d => {
                const data = d.data();
                /* Skip if targeted to other specific users */
                if (Array.isArray(data.targetUsers) && data.targetUsers.length > 0) {
                  if (!data.targetUsers.includes(currentUser.uid)) return;
                }
                /* Mark read from Firestore readBy field */
                if (Array.isArray(data.readBy) && data.readBy.includes(currentUser.uid)) {
                  readIds.add(d.id);
                }
                list.push({ id: d.id, ...data });
              });
              allNotifs = list;
              saveReadIds();
              renderNotifications();
              resolve();
            },
            err => {
              console.warn('[notif] listener err:', err && err.message);
              /* Fallback without orderBy */
              db.collection('notifications').where('active', '==', true).limit(100).get()
                .then(snap => {
                  const list = [];
                  snap.forEach(d => {
                    const data = d.data();
                    if (Array.isArray(data.targetUsers) && data.targetUsers.length > 0) {
                      if (!data.targetUsers.includes(currentUser.uid)) return;
                    }
                    if (Array.isArray(data.readBy) && data.readBy.includes(currentUser.uid)) {
                      readIds.add(d.id);
                    }
                    list.push({ id: d.id, ...data });
                  });
                  allNotifs = list;
                  saveReadIds();
                  renderNotifications();
                  resolve();
                })
                .catch(() => {
                  allNotifs = [];
                  renderNotifications();
                  resolve();
                });
            }
          );
      } catch(e) {
        console.warn('[notif] setup err:', e);
        allNotifs = [];
        renderNotifications();
        resolve();
      }
    });
  }

  /* Sample guest notifications */
  function getSampleNotifs() {
    const now = Date.now();
    return [
      { id: 'welcome_' + now, type: 'system', title: 'Welcome to TOEGO! 🎉', body: 'Explore our top categories and get exclusive deals. Free delivery on orders above ₹499.', createdAt: now - 3600000 },
      { id: 'offer_' + now, type: 'offer', title: 'Mega Sale Live Now 🔥', body: 'Up to 80% OFF on all products. Shop before it ends!', createdAt: now - 7200000, url: 'products.html?sale=50' },
      { id: 'tip_' + now, type: 'system', title: '💡 Pro Tip', body: 'Add products to your wishlist and get notified when prices drop.', createdAt: now - 86400000 }
    ];
  }

  /* ══════════════════ CART BADGE ══════════════════ */
  function updateCartBadgeFromGuest() {
    try {
      const raw = JSON.parse(localStorage.getItem(GUEST_CART_KEY) || '[]');
      const n = raw.reduce((s, i) => s + Number(i.qty || 1), 0);
      const el = document.getElementById('tg-bnav-badge');
      if (el) { el.textContent = n; el.style.display = n > 0 ? 'flex' : 'none'; }
    } catch(e) {}
  }

  /* ══════════════════ PULL TO REFRESH ══════════════════ */
  (function setupPTR() {
    let startY = 0;
    let pulling = false;
    const wrap = document.querySelector('.tg-wrap');
    if (!wrap) return;

    wrap.addEventListener('touchstart', e => {
      if (window.scrollY > 10) return;
      startY = e.touches[0].clientY;
      pulling = true;
    }, { passive: true });

    wrap.addEventListener('touchmove', e => {
      if (!pulling) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 80 && !ptrActive) {
        ptrActive = true;
        tgRefreshNotifications();
        setTimeout(() => { ptrActive = false; }, 1500);
      }
    }, { passive: true });

    wrap.addEventListener('touchend', () => {
      pulling = false;
    });
  })();

  /* ══════════════════ AUTH ══════════════════ */
  loadReadIds();

  auth.onAuthStateChanged(u => {
    currentUser = u;
    if (!u) {
      updateCartBadgeFromGuest();
      loadNotifications();
    } else {
      /* Live cart badge for logged-in */
      try {
        db.collection('carts').doc(u.uid).collection('items')
          .onSnapshot(snap => {
            let n = 0;
            snap.forEach(d => { n += Number(d.data().qty || 1); });
            const el = document.getElementById('tg-bnav-badge');
            if (el) { el.textContent = n; el.style.display = n > 0 ? 'flex' : 'none'; }
          }, () => { updateCartBadgeFromGuest(); });
      } catch(e) { updateCartBadgeFromGuest(); }
      loadNotifications();
    }
  });

  /* Initial guest badge */
  updateCartBadgeFromGuest();

})();
</script>
